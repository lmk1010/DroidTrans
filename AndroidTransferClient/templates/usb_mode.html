<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USB模式 - Android照片传输工具</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg width='48' height='48' viewBox='0 0 1024 1024' xmlns='http://www.w3.org/2000/svg'><path d='M0 0m512 0l0 0q512 0 512 512l0 0q0 512-512 512l0 0q-512 0-512-512l0 0q0-512 512-512Z' fill='%234992FF'/><path d='M260.654545 620.897745a37.236364 37.236364 0 1 1-74.472727-1.340509l3.165091-175.476363a186.181818 186.181818 0 0 1 186.144582-182.830546H679.005091a37.236364 37.236364 0 1 1 0 74.472728H375.491491a111.709091 111.709091 0 0 0-111.709091 109.698327L260.654545 620.897745z' fill='%23FFFFFF'/><path d='M697.455709 257.805964a27.927273 27.927273 0 1 1-33.214836 44.907054l-122.842764-90.875345a27.927273 27.927273 0 0 1 33.214836-44.907055l122.842764 90.875346z' fill='%23FFFFFF'/><path d='M675.579345 277.355055a27.927273 27.927273 0 1 1 35.355928 43.250036l-142.391855 116.363636a27.927273 27.927273 0 0 1-35.337309-43.250036l142.373236-116.363636z' fill='%23FFFFFF'/><path d='M800.581818 403.102255a37.236364 37.236364 0 1 1 74.472727 1.340509l-3.16509 175.476363a186.181818 186.181818 0 0 1-186.144582 182.830546H382.231273a37.236364 37.236364 0 1 1 0-74.472728h303.532218a111.709091 111.709091 0 0 0 111.709091-109.698327L800.581818 403.102255z' fill='%23FFFFFF'/><path d='M363.780655 766.194036a27.927273 27.927273 0 1 1 33.214836-44.907054l122.842764 90.875345a27.927273 27.927273 0 0 1-33.214837 44.907055l-122.842763-90.875346z' fill='%23FFFFFF'/><path d='M385.657018 746.644945a27.927273 27.927273 0 1 1-35.355927-43.250036l142.391854-116.363636a27.927273 27.927273 0 0 1 35.33731 43.250036l-142.373237 116.363636z' fill='%23FFFFFF'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            padding: 32px 24px;
        }

        .container {
            max-width: 1140px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 2px 6px 2px rgba(60,64,67,0.15);
            overflow: hidden;
        }

        .mode-header {
            background: #f8f9fa;
            padding: 20px 32px;
            border-bottom: 1px solid #e8eaed;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mode-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0;
        }

        .mode-badge.adb {
            background: #4285f4;
            color: white;
        }

        .header {
            background: white;
            padding: 32px 40px;
            border-bottom: 1px solid #e8eaed;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-logo {
            flex-shrink: 0;
        }

        .header-logo svg {
            display: block;
        }

        .header-content {
            flex: 1;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #202124;
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        .header p {
            color: #5f6368;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0;
        }

        .controls {
            padding: 20px 32px;
            background: white;
            border-bottom: 1px solid #e8eaed;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 0 24px;
            height: 40px;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.25px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: none;
            font-family: 'Roboto', sans-serif;
        }

        .btn:disabled {
            background: #f1f3f4 !important;
            color: #80868b !important;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-primary {
            background: #4285f4;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #1a73e8;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        .btn-primary:active:not(:disabled) {
            background: #1765cc;
        }

        .btn-success {
            background: #34a853;
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #2d9648;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        .btn-success:active:not(:disabled) {
            background: #24813b;
        }

        .btn-danger {
            background: #ea4335;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: #d33b2c;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        .btn-danger:active:not(:disabled) {
            background: #b93221;
        }

        .btn-tonal {
            background: rgba(26, 115, 232, 0.1);
            color: #1a73e8;
        }

        .btn-tonal:hover:not(:disabled) {
            background: rgba(26, 115, 232, 0.16);
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        .btn-tonal:active:not(:disabled) {
            background: rgba(26, 115, 232, 0.22);
        }

        .status {
            flex: 1;
            text-align: right;
            font-size: 14px;
            color: #666;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0;
        }

        .status-connected {
            background: #e6f4ea;
            color: #137333;
        }

        .status-disconnected {
            background: #fce8e6;
            color: #c5221f;
        }

        .progress-container {
            padding: 16px 24px;
            background: #fff8e1;
            border-bottom: 1px solid rgba(0,0,0,0.12);
            display: none;
        }

        .progress-container.active {
            display: block;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: rgba(0,0,0,0.87);
            font-weight: 500;
            letter-spacing: 0.25px;
        }

        .progress-bar-container {
            background: rgba(0,0,0,0.12);
            border-radius: 2px;
            height: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar {
            background: #4285f4;
            height: 100%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 4px;
        }

        .current-file {
            font-size: 12px;
            color: rgba(0,0,0,0.6);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: 0.4px;
        }

        .content {
            padding: 32px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: #f8f9fa;
            border: 1px solid #e8eaed;
            padding: 24px;
            border-radius: 12px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stat-card:hover {
            background: white;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            transform: translateY(-2px);
        }

        .stat-card h3 {
            font-size: 12px;
            color: #5f6368;
            margin-bottom: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card p {
            font-size: 36px;
            font-weight: 400;
            color: #202124;
            line-height: 1;
        }

        .filter-bar {
            margin-bottom: 20px;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .filter-bar input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #dadce0;
            border-radius: 24px;
            background: white;
            font-size: 14px;
            font-family: 'Roboto', sans-serif;
            letter-spacing: 0;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-bar input:hover {
            border-color: #b0b3b8;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
        }

        .filter-bar input:focus {
            outline: none;
            border: 2px solid #4285f4;
            padding: 11px 15px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
        }

        .filter-bar select {
            padding: 10px 16px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Roboto', sans-serif;
            background: white;
            cursor: pointer;
            letter-spacing: 0;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-bar select:hover {
            border-color: #b0b3b8;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
        }

        .photo-list {
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #e8eaed;
            border-radius: 12px;
        }

        .photo-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #e8eaed;
            transition: background 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .photo-item:hover {
            background: #f8f9fa;
        }

        .photo-item:last-child {
            border-bottom: none;
        }

        .photo-checkbox {
            margin-right: 16px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #4285f4;
        }

        .photo-info {
            flex: 1;
        }

        .photo-name {
            font-weight: 500;
            margin-bottom: 4px;
            color: #202124;
            font-size: 14px;
            letter-spacing: 0;
        }

        .photo-details {
            font-size: 13px;
            color: #5f6368;
            letter-spacing: 0;
        }

        .photo-path {
            font-size: 12px;
            color: #80868b;
            margin-top: 4px;
            font-family: 'Roboto Mono', 'Courier New', monospace;
            letter-spacing: 0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            border: 3px solid #e8eaed;
            border-top: 3px solid #4285f4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .select-all-container {
            padding: 16px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e8eaed;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .select-all-container label {
            font-weight: 500;
            cursor: pointer;
            color: #202124;
            font-size: 14px;
            letter-spacing: 0;
        }

        code {
            background: #f1f3f4;
            padding: 3px 8px;
            border-radius: 6px;
            font-family: 'Roboto Mono', 'Courier New', monospace;
            font-size: 13px;
            color: #1a73e8;
            letter-spacing: 0;
        }

        /* Material Design Snackbar/Toast */
        .snackbar {
            visibility: hidden;
            min-width: 288px;
            max-width: 568px;
            background-color: #323232;
            color: #fff;
            text-align: left;
            border-radius: 4px;
            padding: 14px 16px;
            position: fixed;
            z-index: 10000;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.25px;
            line-height: 20px;
            box-shadow: 0 3px 5px -1px rgba(0,0,0,0.2), 0 6px 10px 0 rgba(0,0,0,0.14), 0 1px 18px 0 rgba(0,0,0,0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .snackbar.show {
            visibility: visible;
            animation: snackbar-fadein 0.15s cubic-bezier(0, 0, 0.2, 1), snackbar-fadeout 0.15s cubic-bezier(0.4, 0, 1, 1) 2.85s;
        }

        .snackbar.error {
            background-color: #d32f2f;
        }

        .snackbar.success {
            background-color: #2e7d32;
        }

        .snackbar.warning {
            background-color: #f57c00;
        }

        .snackbar.info {
            background-color: #1976d2;
        }

        .snackbar-message {
            flex: 1;
        }

        @keyframes snackbar-fadein {
            from { bottom: 0; opacity: 0; }
            to { bottom: 24px; opacity: 1; }
        }

        @keyframes snackbar-fadeout {
            from { bottom: 24px; opacity: 1; }
            to { bottom: 0; opacity: 0; }
        }

        /* Material Design Dialog */
        .dialog-overlay {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.32);
            animation: dialog-overlay-fadein 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dialog-overlay.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes dialog-overlay-fadein {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .dialog {
            background: white;
            border-radius: 4px;
            box-shadow: 0 11px 15px -7px rgba(0,0,0,0.2), 0 24px 38px 3px rgba(0,0,0,0.14), 0 9px 46px 8px rgba(0,0,0,0.12);
            min-width: 280px;
            max-width: 560px;
            max-height: calc(100% - 96px);
            overflow: hidden;
            animation: dialog-scale-in 0.2s cubic-bezier(0, 0, 0.2, 1);
        }

        @keyframes dialog-scale-in {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .dialog-title {
            padding: 24px 24px 20px;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 0.15px;
            line-height: 24px;
            color: rgba(0, 0, 0, 0.87);
        }

        .dialog-content {
            padding: 0 24px 24px;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.5px;
            line-height: 24px;
            color: rgba(0, 0, 0, 0.6);
            overflow-y: auto;
            max-height: 400px;
        }

        .dialog-content p {
            margin: 0 0 16px 0;
        }

        .dialog-content p:last-child {
            margin-bottom: 0;
        }

        .dialog-actions {
            padding: 8px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .dialog-button {
            padding: 0 16px;
            height: 36px;
            border: none;
            border-radius: 4px;
            background: none;
            color: #1a73e8;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.25px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dialog-button:hover {
            background: rgba(26, 115, 232, 0.04);
        }

        .dialog-button.primary {
            background: #1a73e8;
            color: white;
        }

        .dialog-button.primary:hover {
            background: #1765cc;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        .directory-picker-overlay {
            display: none;
            position: fixed;
            z-index: 10001;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.32);
        }

        .directory-picker-overlay.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .directory-picker-dialog {
            background: white;
            border-radius: 12px;
            box-shadow: 0 11px 15px -7px rgba(0,0,0,0.2), 0 24px 38px 3px rgba(0,0,0,0.14), 0 9px 46px 8px rgba(0,0,0,0.12);
            width: min(620px, calc(100% - 32px));
            max-height: calc(100vh - 96px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .directory-picker-header {
            padding: 24px 24px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .directory-picker-header h2 {
            font-size: 20px;
            font-weight: 500;
            color: rgba(0, 0, 0, 0.87);
            margin: 0;
        }

        .directory-picker-body {
            padding: 0 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .directory-picker-path {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 13px;
            color: rgba(0, 0, 0, 0.6);
        }

        .directory-picker-current {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-chip {
            border: none;
            background: rgba(26, 115, 232, 0.12);
            color: #1a73e8;
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-chip:hover:not(:disabled) {
            background: rgba(26, 115, 232, 0.18);
        }

        .btn-chip:disabled {
            background: rgba(60, 64, 67, 0.08);
            color: rgba(60, 64, 67, 0.6);
            cursor: not-allowed;
        }

        .directory-picker-list {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            background: #f8f9fa;
            overflow: hidden;
            max-height: 45vh;
            overflow-y: auto;
        }

        .directory-picker-list::-webkit-scrollbar {
            width: 6px;
        }

        .directory-picker-list::-webkit-scrollbar-thumb {
            border-radius: 3px;
            background: rgba(0,0,0,0.2);
        }

        .directory-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border: none;
            background: none;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            color: #202124;
            transition: background 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .directory-item:hover {
            background: rgba(26, 115, 232, 0.08);
        }

        .directory-item .folder-icon {
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #1a73e8;
        }

        .directory-item .directory-item-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .directory-picker-empty {
            padding: 24px;
            text-align: center;
            font-size: 13px;
            color: rgba(0, 0, 0, 0.6);
        }

        .directory-picker-footer {
            padding: 8px 24px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .directory-picker-hint {
            font-size: 12px;
            color: rgba(0, 0, 0, 0.6);
        }

        .icon-button {
            border: none;
            background: none;
            color: rgba(0, 0, 0, 0.6);
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            padding: 4px;
            border-radius: 50%;
            transition: background 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .icon-button:hover {
            background: rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="mode-header">
            <div>
                <span class="mode-badge adb">USB 模式</span>
            </div>
            <button class="btn btn-primary" onclick="window.location.href='/'">返回模式选择</button>
        </div>

        <div class="header">
            <div class="header-logo">
                <!-- 循环传输箭头Logo -->
                <svg width="48" height="48" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
                  <path d="M0 0m512 0l0 0q512 0 512 512l0 0q0 512-512 512l0 0q-512 0-512-512l0 0q0-512 512-512Z" fill="#4992FF"/>
                  <path d="M260.654545 620.897745a37.236364 37.236364 0 1 1-74.472727-1.340509l3.165091-175.476363a186.181818 186.181818 0 0 1 186.144582-182.830546H679.005091a37.236364 37.236364 0 1 1 0 74.472728H375.491491a111.709091 111.709091 0 0 0-111.709091 109.698327L260.654545 620.897745z" fill="#FFFFFF"/>
                  <path d="M697.455709 257.805964a27.927273 27.927273 0 1 1-33.214836 44.907054l-122.842764-90.875345a27.927273 27.927273 0 0 1 33.214836-44.907055l122.842764 90.875346z" fill="#FFFFFF"/>
                  <path d="M675.579345 277.355055a27.927273 27.927273 0 1 1 35.355928 43.250036l-142.391855 116.363636a27.927273 27.927273 0 0 1-35.337309-43.250036l142.373236-116.363636z" fill="#FFFFFF"/>
                  <path d="M800.581818 403.102255a37.236364 37.236364 0 1 1 74.472727 1.340509l-3.16509 175.476363a186.181818 186.181818 0 0 1-186.144582 182.830546H382.231273a37.236364 37.236364 0 1 1 0-74.472728h303.532218a111.709091 111.709091 0 0 0 111.709091-109.698327L800.581818 403.102255z" fill="#FFFFFF"/>
                  <path d="M363.780655 766.194036a27.927273 27.927273 0 1 1 33.214836-44.907054l122.842764 90.875345a27.927273 27.927273 0 0 1-33.214837 44.907055l-122.842763-90.875346z" fill="#FFFFFF"/>
                  <path d="M385.657018 746.644945a27.927273 27.927273 0 1 1-35.355927-43.250036l142.391854-116.363636a27.927273 27.927273 0 0 1 35.33731 43.250036l-142.373237 116.363636z" fill="#FFFFFF"/>
                </svg>
            </div>
            <div class="header-content">
                <h1>Android 照片传输工具 - USB 模式</h1>
                <p>通过 USB 连接传输照片 · 高速稳定</p>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="checkDeviceBtn" onclick="checkDevice()">检查设备</button>
            <button class="btn btn-primary" id="scanBtn" onclick="scanPhotos()" disabled>扫描照片</button>
            <button class="btn btn-success" id="transferBtn" onclick="startTransfer()" disabled>开始传输</button>
            <button class="btn btn-success" id="resumeBtn" onclick="resumeTransfer()" style="display: none;">🔄 继续传输</button>
            <button class="btn btn-danger" id="stopBtn" onclick="stopTransfer()" style="display: none;">停止传输</button>
            <div class="status">
                <span class="status-badge status-disconnected" id="deviceStatus">未连接</span>
            </div>
        </div>

        <div class="controls" style="background: white; padding: 20px 32px; border-bottom: 1px solid #e8eaed;">
            <label style="font-weight: 500; margin-right: 12px; color: #202124; font-size: 14px; letter-spacing: 0;">📁 输出目录</label>
            <input type="text" id="outputPath" value="{{ default_output_dir }}"
                   style="flex: 1; padding: 12px 16px; border: 1px solid #dadce0; border-radius: 8px; background: white; font-size: 14px; font-family: 'Roboto Mono', monospace; letter-spacing: 0; transition: all 0.2s;"
                   placeholder="选择或输入保存路径，例如：{{ project_root }}/photos_output">
            <button class="btn btn-primary" onclick="chooseOutputDirectory()">选择目录</button>
            <button class="btn btn-tonal" onclick="resetPath()">恢复默认</button>
            <button class="btn btn-tonal" onclick="openFolder()">📂 打开文件夹</button>
            <small style="color: #5f6368; width: 100%; margin-top: 16px; display: block; font-size: 13px; letter-spacing: 0;">
                💡 支持输入绝对路径或相对路径，也可以点击"选择目录"按钮直接挑选<br>
                📍 当前默认输出：<code>{{ default_output_dir }}</code>
            </small>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-info">
                <span id="progressText">准备中...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar" style="width: 0%">0%</div>
            </div>
            <div class="current-file" id="currentFile">等待开始...</div>
        </div>

        <div class="content">
            <div class="stats" id="stats" style="display: none;">
                <div class="stat-card">
                    <h3>照片总数</h3>
                    <p id="totalCount">0</p>
                </div>
                <div class="stat-card">
                    <h3>已选择</h3>
                    <p id="selectedCount">0</p>
                </div>
                <div class="stat-card">
                    <h3>总大小</h3>
                    <p id="totalSize">0 MB</p>
                </div>
            </div>

            <div class="filter-bar" id="filterBar" style="display: none;">
                <input type="text" id="searchInput" placeholder="搜索照片名称..." onkeyup="filterPhotos()">
                <select id="sortSelect" onchange="sortPhotos()">
                    <option value="date_desc">最新优先</option>
                    <option value="date_asc">最旧优先</option>
                    <option value="name_asc">名称 A-Z</option>
                    <option value="name_desc">名称 Z-A</option>
                    <option value="size_desc">大小降序</option>
                    <option value="size_asc">大小升序</option>
                </select>
            </div>

            <div class="photo-list" id="photoList">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <h3>暂无照片</h3>
                    <p>请先检查设备连接，然后扫描照片</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Material Design Snackbar -->
    <div id="snackbar" class="snackbar" role="status" aria-live="polite">
        <span class="snackbar-message"></span>
    </div>

    <!-- Material Design Dialog -->
    <div id="dialogOverlay" class="dialog-overlay">
        <div class="dialog">
            <div class="dialog-title" id="dialogTitle"></div>
            <div class="dialog-content" id="dialogContent"></div>
            <div class="dialog-actions" id="dialogActions"></div>
        </div>
    </div>

    <!-- Directory Picker -->
    <div id="directoryPickerOverlay" class="directory-picker-overlay" aria-hidden="true">
        <div class="directory-picker-dialog" role="dialog" aria-modal="true" aria-labelledby="directoryPickerTitle">
            <div class="directory-picker-header">
                <h2 id="directoryPickerTitle">选择输出目录</h2>
                <button type="button" class="icon-button" onclick="cancelDirectorySelection()" aria-label="关闭目录选择">&times;</button>
            </div>
            <div class="directory-picker-body">
                <div class="directory-picker-path">
                    <button type="button" class="btn-chip" id="directoryPickerUp" onclick="navigateToParentDirectory()">上一级</button>
                    <span class="directory-picker-current" id="directoryPickerCurrent"></span>
                </div>
                <div class="directory-picker-list" id="directoryPickerList">
                    <div class="directory-picker-empty">正在加载...</div>
                </div>
            </div>
            <div class="directory-picker-footer">
                <div class="directory-picker-hint">提示：点击文件夹进入下一级，确认后将使用当前目录作为输出路径。</div>
                <div class="dialog-actions">
                    <button type="button" class="dialog-button" onclick="cancelDirectorySelection()">取消</button>
                    <button type="button" class="dialog-button primary" id="directoryPickerConfirm" onclick="confirmDirectorySelection()">选择此目录</button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='usb_mode.js') if config.get('USE_SEPARATE_JS') else '' }}"></script>
    <script>
        // USB Mode JavaScript
        let allPhotos = [];
        let filteredPhotos = [];
        let selectedPhotos = new Set();
        let scanStatusInterval = null;
        let deviceStatusInterval = null;
        let progressInterval = null;

        const defaultOutputPath = {{ default_output_dir | tojson }};
        const outputPathInput = document.getElementById('outputPath');

        const snackbarElement = document.getElementById('snackbar');
        const snackbarMessageElement = snackbarElement.querySelector('.snackbar-message');
        let snackbarTimeoutId = null;

        const dialogOverlay = document.getElementById('dialogOverlay');
        const dialogTitleElement = document.getElementById('dialogTitle');
        const dialogContentElement = document.getElementById('dialogContent');
        const dialogActionsElement = document.getElementById('dialogActions');
        let pendingConfirmationResolve = null;

        const directoryPickerOverlay = document.getElementById('directoryPickerOverlay');
        const directoryPickerCurrentElement = document.getElementById('directoryPickerCurrent');
        const directoryPickerListElement = document.getElementById('directoryPickerList');
        const directoryPickerConfirmButton = document.getElementById('directoryPickerConfirm');
        const directoryPickerUpButton = document.getElementById('directoryPickerUp');
        let directoryPickerResolve = null;
        let directoryPickerState = {
            currentPath: defaultOutputPath,
            parentPath: null
        };

        function resolvePendingConfirmation(value) {
            if (typeof pendingConfirmationResolve === 'function') {
                const resolver = pendingConfirmationResolve;
                pendingConfirmationResolve = null;
                resolver(value);
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function hideToast() {
            if (snackbarTimeoutId) {
                clearTimeout(snackbarTimeoutId);
                snackbarTimeoutId = null;
            }
            snackbarElement.classList.remove('show');
        }

        function showToast(message, options = {}) {
            const { type = 'info', duration = 4000 } = options;
            const variant = ['info', 'success', 'warning', 'error'].includes(type) ? type : 'info';
            const displayDuration = Number.isFinite(duration) && duration > 0 ? duration : 4000;

            if (snackbarTimeoutId) {
                clearTimeout(snackbarTimeoutId);
                snackbarTimeoutId = null;
            }

            snackbarElement.className = `snackbar ${variant}`;
            snackbarMessageElement.textContent = message;

            snackbarElement.classList.remove('show');
            void snackbarElement.offsetWidth;
            snackbarElement.classList.add('show');

            const timeout = variant === 'error' ? Math.max(displayDuration, 6000) : displayDuration;
            snackbarTimeoutId = setTimeout(() => {
                hideToast();
            }, timeout);
        }

        function renderDialogContent(message) {
            dialogContentElement.innerHTML = '';
            const appendParagraph = (content) => {
                if (content === null || content === undefined || content === '') {
                    return;
                }
                const paragraph = document.createElement('p');
                paragraph.innerHTML = escapeHtml(content).replace(/\n/g, '<br>');
                dialogContentElement.appendChild(paragraph);
            };

            if (Array.isArray(message)) {
                message.forEach(appendParagraph);
            } else {
                appendParagraph(message);
            }
        }

        function hideDialog(options = {}) {
            const { suppressResolve = false } = options;
            dialogOverlay.classList.remove('show');
            dialogActionsElement.innerHTML = '';
            if (!suppressResolve) {
                resolvePendingConfirmation(false);
            }
        }

        function showDialog({ title = '提示', message = '', actions = [] } = {}) {
            dialogTitleElement.textContent = title;
            renderDialogContent(message);

            dialogActionsElement.innerHTML = '';
            const finalActions = actions.length ? actions : [{ label: '确定', type: 'primary' }];

            finalActions.forEach(action => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'dialog-button' + (action.type ? ` ${action.type}` : '');
                button.textContent = action.label || '确定';
                button.addEventListener('click', () => {
                    if (typeof action.onClick === 'function') {
                        action.onClick();
                    }
                    if (!action.keepOpen) {
                        hideDialog();
                    }
                });
                dialogActionsElement.appendChild(button);
            });

            dialogOverlay.classList.add('show');
        }

        function showConfirmation({ title = '确认操作', message = '', confirmLabel = '确定', cancelLabel = '取消' } = {}) {
            return new Promise(resolve => {
                pendingConfirmationResolve = (result) => {
                    resolve(result);
                };
                showDialog({
                    title,
                    message,
                    actions: [
                        {
                            label: cancelLabel,
                            onClick: () => resolvePendingConfirmation(false)
                        },
                        {
                            label: confirmLabel,
                            type: 'primary',
                            onClick: () => resolvePendingConfirmation(true)
                        }
                    ]
                });
            });
        }

        function setDirectoryPickerLoading(message = '正在加载...') {
            directoryPickerListElement.innerHTML = `<div class="directory-picker-empty">${escapeHtml(message)}</div>`;
            directoryPickerConfirmButton.disabled = true;
        }

        async function fetchDirectoryEntries(targetPath) {
            const response = await fetch('/api/directories/list', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: targetPath })
            });

            const data = await response.json();
            if (!response.ok || !data.success) {
                const errorMessage = data.error || '无法获取目录信息';
                throw new Error(errorMessage);
            }

            return data;
        }

        function renderDirectoryPicker(data) {
            directoryPickerState = {
                currentPath: data.current,
                parentPath: data.parent
            };

            directoryPickerCurrentElement.textContent = data.current;
            directoryPickerUpButton.disabled = !data.parent;

            if (!data.entries || data.entries.length === 0) {
                directoryPickerListElement.innerHTML = '<div class="directory-picker-empty">此目录暂时没有子文件夹</div>';
                directoryPickerConfirmButton.disabled = false;
                return;
            }

            const fragment = document.createDocumentFragment();
            data.entries.forEach(entry => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'directory-item';
                button.dataset.path = entry.path;

                const folderIcon = document.createElement('span');
                folderIcon.className = 'folder-icon';
                folderIcon.textContent = '📁';

                const nameSpan = document.createElement('span');
                nameSpan.className = 'directory-item-name';
                nameSpan.textContent = entry.name;

                button.appendChild(folderIcon);
                button.appendChild(nameSpan);

                button.addEventListener('click', () => navigateToDirectory(entry.path));

                fragment.appendChild(button);
            });

            directoryPickerListElement.innerHTML = '';
            directoryPickerListElement.appendChild(fragment);
            directoryPickerConfirmButton.disabled = false;
        }

        async function loadDirectory(targetPath) {
            const data = await fetchDirectoryEntries(targetPath || defaultOutputPath);
            renderDirectoryPicker(data);

            if (data.fallback_used && data.requested && data.requested !== data.current) {
                showToast(`未找到目录 "${data.requested}", 已定位到 ${data.current}`, { type: 'warning', duration: 5000 });
            }
        }

        async function navigateToDirectory(path) {
            const previousPath = directoryPickerState.currentPath;
            setDirectoryPickerLoading();
            try {
                await loadDirectory(path);
            } catch (error) {
                console.error('打开目录失败:', error);
                showToast('无法打开目录: ' + error.message, { type: 'error' });
                try {
                    await loadDirectory(previousPath);
                } catch (innerError) {
                    console.error('恢复目录失败:', innerError);
                }
            }
        }

        function navigateToParentDirectory() {
            if (!directoryPickerState.parentPath) {
                return;
            }
            navigateToDirectory(directoryPickerState.parentPath);
        }

        function closeDirectoryPicker(result = null) {
            if (!directoryPickerOverlay.classList.contains('show')) {
                return;
            }

            directoryPickerOverlay.classList.remove('show');
            directoryPickerOverlay.setAttribute('aria-hidden', 'true');

            const resolver = directoryPickerResolve;
            directoryPickerResolve = null;
            if (typeof resolver === 'function') {
                resolver(result);
            }
        }

        function cancelDirectorySelection() {
            closeDirectoryPicker(null);
        }

        function confirmDirectorySelection() {
            closeDirectoryPicker(directoryPickerState.currentPath);
        }

        function openDirectoryPicker(initialPath) {
            if (directoryPickerOverlay.classList.contains('show')) {
                return Promise.resolve(null);
            }

            const startPath = (initialPath && initialPath.trim()) || outputPathInput.value.trim() || defaultOutputPath;

            directoryPickerOverlay.classList.add('show');
            directoryPickerOverlay.setAttribute('aria-hidden', 'false');
            setDirectoryPickerLoading();

            return new Promise(resolve => {
                directoryPickerResolve = resolve;
                loadDirectory(startPath).catch(error => {
                    console.error('加载目录失败:', error);
                    showToast('加载目录失败: ' + error.message, { type: 'error' });
                    closeDirectoryPicker(null);
                });
            });
        }

        async function chooseOutputDirectory() {
            try {
                const selectedPath = await openDirectoryPicker(outputPathInput.value);
                if (selectedPath) {
                    outputPathInput.value = selectedPath;
                    showToast(`已选择输出目录: ${selectedPath}`, { type: 'success' });
                }
            } catch (error) {
                console.error('选择目录失败:', error);
                showToast('选择目录失败: ' + error.message, { type: 'error' });
            }
        }

        dialogOverlay.addEventListener('click', event => {
            if (event.target === dialogOverlay) {
                hideDialog();
            }
        });

        directoryPickerOverlay.addEventListener('click', event => {
            if (event.target === directoryPickerOverlay) {
                cancelDirectorySelection();
            }
        });

        document.addEventListener('keydown', event => {
            if (event.key !== 'Escape') {
                return;
            }

            if (directoryPickerOverlay.classList.contains('show')) {
                cancelDirectorySelection();
                return;
            }

            if (dialogOverlay.classList.contains('show')) {
                hideDialog();
            }
        });

        // Device status monitoring
        function startDeviceStatusPolling() {
            stopDeviceStatusPolling();
            deviceStatusInterval = setInterval(checkDeviceStatus, 3000);
        }

        function stopDeviceStatusPolling() {
            if (deviceStatusInterval) {
                clearInterval(deviceStatusInterval);
                deviceStatusInterval = null;
            }
        }

        async function checkDeviceStatus() {
            try {
                const response = await fetch('/api/device_status');
                const data = await response.json();

                const statusBadge = document.getElementById('deviceStatus');
                if (data.connected) {
                    statusBadge.className = 'status-badge status-connected';
                    statusBadge.textContent = `已连接 (${data.devices.join(', ')})`;
                } else {
                    statusBadge.className = 'status-badge status-disconnected';
                    statusBadge.textContent = '未连接';
                }

                if (data.disconnect_detected || !data.connected) {
                    handleDeviceDisconnect();
                }
            } catch (error) {
                console.error('检查设备状态失败:', error);
            }
        }

        function handleDeviceDisconnect() {
            stopDeviceStatusPolling();

            if (scanStatusInterval) {
                stopScanStatusPolling();
                const scanBtn = document.getElementById('scanBtn');
                scanBtn.disabled = false;
                scanBtn.textContent = '扫描照片';
            }

            if (progressInterval) {
                stopTransfer();
                clearInterval(progressInterval);
                document.getElementById('transferBtn').style.display = 'inline-block';
                document.getElementById('stopBtn').style.display = 'none';
            }

            showDialog({
                title: '设备已断开',
                message: '⚠️ USB设备已断开！\n\n请重新连接设备后再继续操作。'
            });

            const statusBadge = document.getElementById('deviceStatus');
            statusBadge.className = 'status-badge status-disconnected';
            statusBadge.textContent = '设备已断开';

            document.getElementById('scanBtn').disabled = true;
            document.getElementById('transferBtn').disabled = true;
        }

        window.addEventListener('load', checkResumeProgress);

        async function checkResumeProgress() {
            try {
                const response = await fetch('/api/check_progress');
                const data = await response.json();

                if (data.has_progress) {
                    const resumeBtn = document.getElementById('resumeBtn');
                    resumeBtn.style.display = 'inline-block';
                    resumeBtn.title = `有 ${data.pending} 个文件未传输（已完成 ${data.completed}/${data.total}）`;

                    const shouldResume = await showConfirmation({
                        title: '发现未完成的传输',
                        message: `发现未完成的传输任务：\n\n总文件: ${data.total}\n已完成: ${data.completed}\n剩余: ${data.pending}\n失败: ${data.failed}\n\n是否立即继续传输？`,
                        confirmLabel: '继续传输',
                        cancelLabel: '稍后'
                    });

                    if (shouldResume) {
                        resumeTransfer();
                    }
                }
            } catch (error) {
                console.error('检查进度失败:', error);
            }
        }

        async function resumeTransfer() {
            const resumeBtn = document.getElementById('resumeBtn');
            resumeBtn.disabled = true;
            resumeBtn.textContent = '恢复中...';

            try {
                const response = await fetch('/api/resume_transfer', { method: 'POST' });
                const data = await response.json();

                if (data.success) {
                    document.getElementById('progressContainer').classList.add('active');
                    resumeBtn.style.display = 'none';
                    document.getElementById('stopBtn').style.display = 'inline-block';
                    document.getElementById('scanBtn').disabled = true;
                    document.getElementById('transferBtn').disabled = true;
                    startProgressPolling();
                    startDeviceStatusPolling();
                    showToast(data.message, { type: 'success' });
                } else {
                    showToast('恢复传输失败: ' + data.error, { type: 'error' });
                    resumeBtn.disabled = false;
                    resumeBtn.textContent = '🔄 继续传输';
                }
            } catch (error) {
                showToast('恢复传输失败: ' + error.message, { type: 'error' });
                resumeBtn.disabled = false;
                resumeBtn.textContent = '🔄 继续传输';
            }
        }

        async function checkDevice() {
            const btn = document.getElementById('checkDeviceBtn');
            btn.disabled = true;
            btn.textContent = '检查中...';

            try {
                const response = await fetch('/api/check_device');
                const data = await response.json();

                const statusBadge = document.getElementById('deviceStatus');
                if (data.connected) {
                    statusBadge.className = 'status-badge status-connected';
                    statusBadge.textContent = `已连接 (${data.devices.join(', ')})`;
                    document.getElementById('scanBtn').disabled = false;
                } else {
                    statusBadge.className = 'status-badge status-disconnected';
                    statusBadge.textContent = '未连接';
                    showDialog({
                        title: '未检测到设备',
                        message: '请确保：\n1. 手机已通过USB连接\n2. 已开启USB调试\n3. 已授权此电脑的ADB访问'
                    });
                }
            } catch (error) {
                showToast('检查设备失败: ' + error.message, { type: 'error' });
            } finally {
                btn.disabled = false;
                btn.textContent = '检查设备';
            }
        }

        async function scanPhotos() {
            const btn = document.getElementById('scanBtn');
            const photoList = document.getElementById('photoList');

            btn.disabled = true;
            btn.textContent = '扫描中...';

            stopScanStatusPolling();
            selectedPhotos.clear();
            allPhotos = [];
            filteredPhotos = [];
            document.getElementById('transferBtn').disabled = true;
            document.getElementById('stats').style.display = 'none';
            document.getElementById('filterBar').style.display = 'none';

            photoList.innerHTML = '<div class="loading"><div class="spinner"></div><p>正在扫描手机照片，请稍候...</p></div>';

            try {
                const response = await fetch('/api/scan', { method: 'POST' });
                const data = await response.json();

                if (data.success) {
                    startScanStatusPolling();
                    startDeviceStatusPolling();
                } else {
                    throw new Error(data.error || '扫描启动失败');
                }
            } catch (error) {
                showToast('扫描失败: ' + error.message, { type: 'error' });
                photoList.innerHTML = '<div class="empty-state"><h3>扫描失败</h3><p>' + error.message + '</p></div>';
                btn.disabled = false;
                btn.textContent = '重新扫描';
            }
        }

        function stopScanStatusPolling() {
            if (scanStatusInterval) {
                clearInterval(scanStatusInterval);
                scanStatusInterval = null;
            }
        }

        function startScanStatusPolling() {
            stopScanStatusPolling();
            updateScanStatus(true);
            scanStatusInterval = setInterval(updateScanStatus, 1000);
        }

        async function updateScanStatus(isInitial = false) {
            const photoList = document.getElementById('photoList');

            try {
                const response = await fetch('/api/scan_status');
                const status = await response.json();

                if (status.stage === 'error' || status.error) {
                    throw new Error(status.error || '扫描失败');
                }

                if (status.is_running) {
                    const stageDescriptions = {
                        idle: '准备扫描...',
                        finding: '正在查找照片文件...',
                        getting_info: '正在获取照片信息...'
                    };

                    const stageText = stageDescriptions[status.stage] || '正在扫描手机照片...';
                    let extraInfo = '';

                    if (status.stage === 'finding') {
                        extraInfo = `已发现 ${status.files_found} 个文件`;
                    } else if (status.stage === 'getting_info') {
                        const percent = status.total_files > 0 ? Math.round((status.files_processed / status.total_files) * 100) : 0;
                        extraInfo = `处理中: ${status.files_processed}/${status.total_files} (${percent}%)`;
                    }

                    const parts = [
                        '<div class="loading">',
                        '<div class="spinner"></div>',
                        `<p>${stageText}</p>`
                    ];

                    if (extraInfo) {
                        parts.push(`<p>${extraInfo}</p>`);
                    }

                    if (status.current_dir) {
                        parts.push(`<p>当前目录: ${status.current_dir}</p>`);
                    }

                    parts.push('</div>');
                    photoList.innerHTML = parts.join('');
                    return;
                }

                if (status.stage === 'done') {
                    stopScanStatusPolling();
                    stopDeviceStatusPolling();
                    await loadScanResult();
                    return;
                }

                if (!status.is_running && status.stage === 'idle' && !isInitial) {
                    stopScanStatusPolling();
                    const btn = document.getElementById('scanBtn');
                    btn.disabled = false;
                    btn.textContent = '重新扫描';
                }
            } catch (error) {
                stopScanStatusPolling();
                const btn = document.getElementById('scanBtn');
                btn.disabled = false;
                btn.textContent = '重新扫描';
                photoList.innerHTML = `<div class="empty-state"><h3>扫描失败</h3><p>${error.message}</p></div>`;
                console.error('更新扫描状态失败:', error);
            }
        }

        async function loadScanResult() {
            const photoList = document.getElementById('photoList');

            try {
                const response = await fetch('/api/scan_result');
                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.error || '扫描结果获取失败');
                }

                allPhotos = result.photos || [];
                filteredPhotos = [...allPhotos];
                selectedPhotos.clear();

                displayPhotos();
                updateStats();
                document.getElementById('stats').style.display = 'grid';
                document.getElementById('filterBar').style.display = filteredPhotos.length > 0 ? 'flex' : 'none';
            } catch (error) {
                photoList.innerHTML = `<div class="empty-state"><h3>扫描失败</h3><p>${error.message}</p></div>`;
                showToast('扫描失败: ' + error.message, { type: 'error' });
            } finally {
                const btn = document.getElementById('scanBtn');
                btn.disabled = false;
                btn.textContent = '重新扫描';
            }
        }

        function displayPhotos() {
            const photoList = document.getElementById('photoList');

            if (filteredPhotos.length === 0) {
                photoList.innerHTML = '<div class="empty-state"><h3>没有找到照片</h3><p>请调整筛选条件</p></div>';
                return;
            }

            let html = '<div class="select-all-container">';
            html += '<input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()" class="photo-checkbox">';
            html += '<label for="selectAllCheckbox">全选 / 全不选</label>';
            html += '</div>';

            filteredPhotos.forEach(photo => {
                const isSelected = selectedPhotos.has(photo.path);
                html += `
                    <div class="photo-item">
                        <input type="checkbox" class="photo-checkbox" ${isSelected ? 'checked' : ''}
                               onchange="togglePhoto('${photo.path}')" data-path="${photo.path}">
                        <div class="photo-info">
                            <div class="photo-name">${photo.name}</div>
                            <div class="photo-details">
                                大小: ${photo.size_mb} MB | 日期: ${photo.date}
                            </div>
                            <div class="photo-path">${photo.path}</div>
                        </div>
                    </div>
                `;
            });

            photoList.innerHTML = html;
            document.getElementById('transferBtn').disabled = selectedPhotos.size === 0;
        }

        function togglePhoto(path) {
            if (selectedPhotos.has(path)) {
                selectedPhotos.delete(path);
            } else {
                selectedPhotos.add(path);
            }
            updateStats();
            document.getElementById('transferBtn').disabled = selectedPhotos.size === 0;
        }

        function toggleSelectAll() {
            const checked = document.getElementById('selectAllCheckbox').checked;
            selectedPhotos.clear();

            if (checked) {
                filteredPhotos.forEach(photo => selectedPhotos.add(photo.path));
            }

            displayPhotos();
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = filteredPhotos.length;
            document.getElementById('selectedCount').textContent = selectedPhotos.size;

            let totalSize = 0;
            allPhotos.forEach(photo => {
                if (selectedPhotos.has(photo.path)) {
                    totalSize += photo.size;
                }
            });

            document.getElementById('totalSize').textContent = (totalSize / 1024 / 1024).toFixed(2) + ' MB';
        }

        function filterPhotos() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            filteredPhotos = allPhotos.filter(photo =>
                photo.name.toLowerCase().includes(searchText) ||
                photo.path.toLowerCase().includes(searchText)
            );
            sortPhotos();
        }

        function sortPhotos() {
            const sortBy = document.getElementById('sortSelect').value;

            filteredPhotos.sort((a, b) => {
                switch (sortBy) {
                    case 'date_desc': return b.mtime - a.mtime;
                    case 'date_asc': return a.mtime - b.mtime;
                    case 'name_asc': return a.name.localeCompare(b.name);
                    case 'name_desc': return b.name.localeCompare(a.name);
                    case 'size_desc': return b.size - a.size;
                    case 'size_asc': return a.size - b.size;
                    default: return 0;
                }
            });

            displayPhotos();
        }

        function resetPath() {
            outputPathInput.value = defaultOutputPath;
            showToast('已恢复默认输出目录', { type: 'info' });
        }

        async function openFolder() {
            const path = outputPathInput.value.trim();
            if (!path) {
                showToast('请先输入目录路径', { type: 'warning' });
                return;
            }
            
            try {
                const response = await fetch('/api/wifi/open_folder', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ folder_path: path })
                });
                
                const data = await response.json();
                if (data.success) {
                    showToast('已打开文件夹', { type: 'success' });
                } else {
                    showToast('打开失败: ' + data.error, { type: 'error' });
                }
            } catch (error) {
                console.error('打开文件夹失败:', error);
                showToast('打开失败: ' + error.message, { type: 'error' });
            }
        }

        async function startTransfer() {
            if (selectedPhotos.size === 0) {
                showToast('请至少选择一张照片', { type: 'warning' });
                return;
            }

            const outputPath = outputPathInput.value.trim();
            if (!outputPath) {
                showToast('请输入输出目录路径', { type: 'warning' });
                return;
            }

            const photos = allPhotos.filter(photo => selectedPhotos.has(photo.path));

            try {
                const response = await fetch('/api/transfer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        photos: photos,
                        output_dir: outputPath
                    })
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('progressContainer').classList.add('active');
                    document.getElementById('transferBtn').style.display = 'none';
                    document.getElementById('stopBtn').style.display = 'inline-block';
                    document.getElementById('scanBtn').disabled = true;
                    document.getElementById('currentFile').textContent = `保存到: ${outputPath}`;
                    startProgressPolling();
                    startDeviceStatusPolling();
                } else {
                    showToast('启动传输失败: ' + data.error, { type: 'error' });
                }
            } catch (error) {
                showToast('启动传输失败: ' + error.message, { type: 'error' });
            }
        }

        async function stopTransfer() {
            try {
                await fetch('/api/stop_transfer', { method: 'POST' });
            } catch (error) {
                console.error('停止传输失败:', error);
            }
        }

        function startProgressPolling() {
            progressInterval = setInterval(updateProgress, 500);
        }

        async function updateProgress() {
            try {
                const response = await fetch('/api/transfer_status');
                const status = await response.json();

                const percent = status.total > 0 ? Math.round((status.current / status.total) * 100) : 0;

                document.getElementById('progressText').textContent =
                    `正在传输: ${status.current} / ${status.total}`;
                document.getElementById('progressPercent').textContent = percent + '%';
                document.getElementById('progressBar').style.width = percent + '%';
                document.getElementById('currentFile').textContent = '当前: ' + status.current_file;

                if (!status.is_running && status.current > 0) {
                    clearInterval(progressInterval);
                    stopDeviceStatusPolling();
                    document.getElementById('progressText').textContent = '传输完成!';
                    document.getElementById('currentFile').textContent =
                        status.failed.length > 0 ?
                        `完成! ${status.failed.length} 个文件失败` :
                        '所有文件传输成功!';
                    document.getElementById('transferBtn').style.display = 'inline-block';
                    document.getElementById('stopBtn').style.display = 'none';
                    document.getElementById('scanBtn').disabled = false;

                    if (status.failed.length > 0) {
                        console.error('失败的文件:', status.failed);
                        setTimeout(checkResumeProgress, 1000);
                    }
                }
            } catch (error) {
                console.error('更新进度失败:', error);
            }
        }
    </script>
</body>
</html>
