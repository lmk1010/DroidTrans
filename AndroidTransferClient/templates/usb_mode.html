        async function scanPhotos() {
            const btn = document.getElementById('scanBtn');
            const photoList = document.getElementById('photoList');

            if (window.__scanStarting) {
                showToast('扫描已在启动中…', { type: 'info' });
                return;
            }

            // 检查USB测速是否完成
            try {
                const speedResp = await fetch('/api/usb/speed');
                const speedData = await speedResp.json();

                // 如果正在测速，等待
                if (speedData.probing === true) {
                    showToast('⚡ USB速度测试进行中，请稍候...', { type: 'info' });
                    return;
                }

                // 检查是否有有效的测速结果
                const hasMeasuredSpeed = speedData.measured_mbps && speedData.measured_mbps > 0;

                // 如果没有有效结果（测速失败或未测速），显示对话框
                if (!hasMeasuredSpeed && !speedData.probing) {
                    showDialog({
                        title: '⚠️ USB速度测试失败',
                        message: 'USB速度测试失败，可能原因：\n\n1. USB连接不稳定\n2. 手机权限限制\n3. ADB传输异常\n\n建议：\n• 重新插拔USB线\n• 切换USB端口\n• 更换USB线缆\n\n请选择如何继续：',
                        actions: [
                            { label: '跳过测速，直接扫描', onClick: async () => {
                                try {
                                    const resp = await fetch('/api/usb/skip_speed_test', { method: 'POST' });
                                    const data = await resp.json();
                                    if (data.success) {
                                        showToast('已跳过USB测速', { type: 'success' });
                                        // 立即刷新USB状态，确保前端读到跳过标记
                                        await updateUsbSpeedInfo();
                                        // 短暂延迟后继续扫描，确保状态已更新
                                        setTimeout(() => scanPhotos(), 300);
                                    } else {
                                        showToast('操作失败: ' + (data.error || '未知错误'), { type: 'error' });
                                    }
                                } catch (e) {
                                    showToast('操作失败: ' + e.message, { type: 'error' });
                                }
                            }},
                            { label: '重新测速', type: 'primary', onClick: async () => {
                                try {
                                    const resp = await fetch('/api/usb/retry_speed_test', { method: 'POST' });
                                    const data = await resp.json();
                                    if (data.success) {
                                        showToast('正在重新测速...', { type: 'info' });
                                        // 3秒后刷新状态
                                        setTimeout(() => updateUsbSpeedInfo(), 3000);
                                    } else {
                                        showToast('重新测速失败: ' + (data.error || '未知错误'), { type: 'error' });
                                    }
                                } catch (e) {
                                    showToast('重新测速失败: ' + e.message, { type: 'error' });
                                }
                            }}
                        ]
                    });
                    return;
                }

                // 有有效结果，允许扫描
                console.log('[USB] 测速检查通过，允许扫描', { measured_mbps: speedData.measured_mbps });

            } catch (e) {
                console.warn('检查USB测速状态失败:', e);
                // 如果检查失败，允许继续扫描（避免阻止用户操作）
            }

            btn.disabled = true;
            btn.textContent = '扫描中...';

            stopScanStatusPolling();
            selectedPhotos.clear();
            allPhotos = [];
            filteredPhotos = [];
            // 显式重扫：清除本地相册缓存
            clearAlbumsCache();
            document.getElementById('transferBtn').disabled = true;
            document.getElementById('stats').style.display = 'none';
            document.getElementById('filterBar').style.display = 'none';

            photoList.innerHTML = '<div class="loading"><div class="spinner"></div><p>正在扫描手机照片，请稍候...</p></div>';

            try {
                // 若已有扫描在进行，直接进入轮询，避免二次触发导致“扫描正在进行中”
                try {
                    const sresp = await fetch('/api/scan_status');
                    const s = await sresp.json();
                    if (s && (s.is_running || s.stage === 'finding' || s.stage === 'getting_info')) {
                        try { if (typeof s.scan_id === 'number') window.__scanId = s.scan_id; } catch (e) {}
                        startScanStatusPolling();
                        startDeviceStatusPolling();
                        btn.disabled = true;
                        btn.textContent = '扫描中...';
                        return;
                    }
                } catch (_) { /* ignore */ }

                window.__scanStarting = true;
                const response = await fetch('/api/scan', { method: 'POST' });
                const data = await response.json();

                if (data.success) {
                    try { if (typeof data.scan_id === 'number') window.__scanId = data.scan_id; } catch (e) {}
                    startScanStatusPolling();
                    startDeviceStatusPolling();
                    try { renderScanHero(); } catch (e) {}
                } else {
                    throw new Error(data.error || '扫描启动失败');
                }
            } catch (error) {
                // 若后端提示“扫描正在进行中”，视为成功进入扫描流程
                const msg = (error && error.message) ? String(error.message) : '';
                if (msg.includes('扫描正在进行中')) {
                    startScanStatusPolling();
                    startDeviceStatusPolling();
                    showToast('扫描已在进行中', { type: 'info' });
                    btn.disabled = true;
                    btn.textContent = '扫描中...';
                } else {
                    showToast('扫描失败: ' + msg, { type: 'error' });
                    photoList.innerHTML = '<div class="empty-state"><h3>扫描失败</h3><p>' + msg + '</p></div>';
                    btn.disabled = false;
                    btn.textContent = '重新扫描';
                }
            }
            finally {
                window.__scanStarting = false;
            }
        }

        function stopScanStatusPolling() {
            if (scanStatusInterval) {
                clearInterval(scanStatusInterval);
                scanStatusInterval = null;
            }
        }

        function startScanStatusPolling() {
            stopScanStatusPolling();
            updateScanStatus(true);
            scanStatusInterval = setInterval(updateScanStatus, 1000);
        }

        async function updateScanStatus(isInitial = false) {
            const photoList = document.getElementById('photoList');

            try {
                const response = await fetch('/api/scan_status');
                const status = await response.json();
                // 基于扫描序号过滤旧结果
                try {
                    const sid = typeof status.scan_id === 'number' ? status.scan_id : 0;
                    if (typeof window.__scanId === 'number' && window.__scanId && sid && sid !== window.__scanId) {
                        return; // 忽略非当前扫描的状态包
                    }
                    if ((!window.__scanId || window.__scanId === 0) && sid) {
                        window.__scanId = sid; // 首次对齐
                    }
                } catch (e) {}
                // 若拿到预览/在运行，记录活动时间用于抖动防护
                try {
                    const ap = status.albums_preview || {};
                    if (status.is_running || (ap && Object.keys(ap).length > 0)) {
                        window.__lastScanActiveTs = Date.now();
                    }
                } catch (e) {}

                if (status.stage === 'error' || status.error) {
                    throw new Error(status.error || '扫描失败');
                }

            if (status.is_running) {
                    const stageDescriptions = {
                        idle: '准备扫描...',
                        finding: '正在查找照片文件...',
                        getting_info: '正在获取照片信息...',
                        thumbs: '正在预生成缩略图（可能较慢）...'
                    };

                    const stageText = stageDescriptions[status.stage] || '正在扫描手机照片...';
                    let extraInfo = '';

                    if (status.stage === 'finding') {
                        if ((status.files_found || 0) > 0) {
                            extraInfo = `已发现 ${status.files_found} 个文件`;
                        } else {
                            extraInfo = '';
                        }
                    } else if (status.stage === 'getting_info') {
                        const percent = status.total_files > 0 ? Math.round((status.files_processed / status.total_files) * 100) : 0;
                        extraInfo = `处理中: ${status.files_processed}/${status.total_files} (${percent}%)`;
                    } else if (status.stage === 'thumbs') {
                        const tTotal = status.thumbs_total || 0;
                        const tDone = status.thumbs_done || 0;
                        const percent = tTotal > 0 ? Math.round((tDone / tTotal) * 100) : 0;
                        extraInfo = `缩略图: ${tDone}/${tTotal} (${percent}%)`;
                    }

                    // 若已生成部分相册预览，则增量显示相册卡片 + 骨架
                    const ap = status.albums_preview || {};
                    const albumKeys = Object.keys(ap);
                    if (albumKeys.length > 0) {
                        const tTotal = status.thumbs_total || 0;
                        const tDone = status.thumbs_done || 0;
                        const percent = tTotal > 0 ? Math.round((tDone / tTotal) * 100) : 0;
                        let html = '';
                        html += `<div class="progress-container active" id="thumbProgressWrap">
                                    <div class="progress-info">
                                        <span>缩略图生成进度</span>
                                        <span id="thumbProgressText">${tDone}/${tTotal} (${percent}%)</span>
                                    </div>
                                    <div class="progress-bar-container"><div class="progress-bar" id="thumbProgressBar" style="width:${percent}%"></div></div>
                                </div>`;
                        html += '<div class="album-grid">';
                        // 排序
                        albumKeys.sort((a,b)=> (ap[a].priority||99) - (ap[b].priority||99));
                        albumKeys.forEach(k => {
                            const a = ap[k];
                            const cover = a.cover || '';
                            html += `
                                <div class="album-card" onclick="showToast('正在扫描相册，请稍候...', { type: 'info' })">
                                    <div class="album-cover">
                                        ${cover ? `
                                            <div class="skeleton-cover"></div>
                                            <img src="/api/thumb?path=${encodeURIComponent(cover)}" class="loaded" alt="${a.name}">
                                        ` : `
                                            <div class="album-cover-placeholder">${albumIconSVG(a.name)}</div>
                                        `}
                                    </div>
                                    <div class="album-info">
                                        <div class="album-header-row">
                                            <div class="album-title">
                                                <span class="album-icon" aria-hidden="true">${albumIconSVG(a.name)}</span>
                                                <span>${a.name}</span>
                                            </div>
                                            <div class="album-badge">${a.total_count} 张</div>
                                        </div>
                                        <div class="album-stats">
                                            <div class="album-stat-item">
                                                <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                                    <polyline points="21 15 16 10 5 21"></polyline>
                                                </svg>
                                                <span>已选择: <strong>0</strong></span>
                                            </div>
                                            <div class="album-stat-item">
                                                <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                                                </svg>
                                                <span class="album-size">${(a.total_size / 1024 / 1024).toFixed(2)} MB</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>`;
                        });
                        // 附加若干骨架卡片，暗示仍在加载
                        const skeletonCount = Math.min(6, Math.max(0, 12 - albumKeys.length));
                        for (let i=0;i<skeletonCount;i++) {
                            html += '<div class="album-card skeleton" style="height: 230px;"></div>';
                        }
                        html += '</div>';
                        photoList.innerHTML = html;
                    } else {
                        // 仍未有预览：显示不确定进度和骨架占位
                        let html = '';
                        html += `<div class="progress-container active">
                                    <div class="progress-info">
                                        <span>${stageText}</span>
                                        <span id="scanFindingText">${extraInfo || '正在扫描存储…'}</span>
                                    </div>
                                    <div class="progress-bar-container"><div class="progress-bar indeterminate"></div></div>
                                </div>`;
                        html += '<div class="album-grid">';
                        for (let i=0;i<8;i++) { html += '<div class="album-card skeleton" style="height: 230px;"></div>'; }
                        html += '</div>';
                        photoList.innerHTML = html;
                    }
                    return;
                }

                if (status.stage === 'done') {
                    stopScanStatusPolling();
                    // 继续保持设备状态轮询，作为断开/重连监听器
                    try { window.__hasAlbums = true; } catch (e) {}
                    await loadScanResult();
                    try { renderScanHero(); } catch (e) {}
                    return;
                }

                // 抖动防护：短时间内出现 idle 但此前有活动，忽略本轮，不清空UI
                const nowTs = Date.now();
                const guardMs = 5000;  // 增加到 5 秒，避免过早停止
                const recentActive = (typeof window.__lastScanActiveTs === 'number') && ((nowTs - window.__lastScanActiveTs) < guardMs);

                // 只有在确认不是扫描刚完成的情况下才停止轮询
                if (!status.is_running && status.stage === 'idle' && !isInitial && !recentActive) {
                    // 额外检查：如果有相册数据，说明扫描实际已完成，尝试加载结果
                    const apKeys = Object.keys(status.albums_preview || {});
                    if (apKeys.length > 0) {
                        console.log('[SCAN] 检测到idle但有相册数据，尝试加载结果', { albumCount: apKeys.length });
                        try {
                            await loadScanResult();
                        } catch (e) {
                            console.warn('[SCAN] 加载结果失败:', e);
                        }
                    }
                    stopScanStatusPolling();
                    const btn = document.getElementById('scanBtn');
                    btn.disabled = false;
                    btn.textContent = '重新扫描';
                }
            } catch (error) {
                stopScanStatusPolling();
                const btn = document.getElementById('scanBtn');
                btn.disabled = false;
                btn.textContent = '重新扫描';
                photoList.innerHTML = `<div class="empty-state"><h3>扫描失败</h3><p>${error.message}</p></div>`;
                console.error('更新扫描状态失败:', error);
            }
        }

        async function loadScanResult() {
            const photoList = document.getElementById('photoList');

            try {
                const response = await fetch('/api/scan_result');
                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.error || '扫描结果获取失败');
                }

                allPhotos = result.photos || [];
                allAlbums = result.albums || {};
                filteredPhotos = [...allPhotos];
                selectedPhotos.clear();

            // 显示相册视图
            switchToAlbumView();
            try { window.__hasAlbums = (Object.keys(allAlbums||{}).length>0); window.__albumViewActive = true; } catch (e) {}

                // 标记已有扫描结果，避免刷新后重复自动扫描
                localStorage.setItem('at_last_scan_done', '1');
                // 缓存相册与选择，便于刷新后立即恢复
                saveAlbumsCache();
                saveSelections();

                updateStats();
                document.getElementById('stats').style.display = 'grid';
            document.getElementById('viewSwitcher').style.display = 'none';
            document.getElementById('filterBar').style.display = 'none';
            } catch (error) {
                photoList.innerHTML = `<div class="empty-state"><h3>扫描失败</h3><p>${error.message}</p></div>`;
                showToast('扫描失败: ' + error.message, { type: 'error' });
            } finally {
                const btn = document.getElementById('scanBtn');
                btn.disabled = false;
                btn.textContent = '重新扫描';
            }
        }

        function displayPhotos() {
            const photoList = document.getElementById('photoList');

            if (filteredPhotos.length === 0) {
                photoList.innerHTML = '<div class="empty-state"><h3>没有找到照片</h3><p>请调整筛选条件</p></div>';
                return;
            }

            let html = '<div class="select-all-container">';
            html += '<input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()" class="photo-checkbox">';
            html += '<label for="selectAllCheckbox">全选 / 全不选</label>';
            html += `<span style="margin-left:12px; color:#666;">共 ${filteredPhotos.length} 张</span>`;
            html += '<button class="btn btn-tonal" style="margin-left:12px;height:32px;padding:0 12px;" onclick="invertSelection()">反选</button>';
            html += '</div>';

            // 限制显示数量，提高性能
            const maxDisplay = 1000;
            const displayCount = Math.min(filteredPhotos.length, maxDisplay);

            for (let i = 0; i < displayCount; i++) {
                const photo = filteredPhotos[i];
                const isSelected = selectedPhotos.has(photo.path);
                html += `
                    <div class="photo-item">
                        <input type="checkbox" class="photo-checkbox" ${isSelected ? 'checked' : ''}
                               onchange="togglePhoto('${photo.path}')" data-path="${photo.path}">
                        <div class="photo-info">
                            <div class="photo-name">${photo.name}</div>
                            <div class="photo-details">
                                大小: ${photo.size_mb} MB | 日期: ${photo.date}
                            </div>
                            <div class="photo-path">${photo.path}</div>
                        </div>
                    </div>
                `;
            }

            if (filteredPhotos.length > maxDisplay) {
                html += `<div style="text-align:center;padding:20px;color:#666;">显示前 ${maxDisplay} 张，共 ${filteredPhotos.length} 张照片。请使用相册视图浏览所有照片。</div>`;
            }

            photoList.innerHTML = html;
            // 统一由 updateStats 控制按钮可用状态（考虑相册整体选择）
            updateStats();
        }

        function invertSelection() {
            const before = selectedPhotos.size;
            const set = new Set(selectedPhotos);
            filteredPhotos.forEach(p => {
                if (set.has(p.path)) {
                    selectedPhotos.delete(p.path);
                } else {
                    selectedPhotos.add(p.path);
                }
            });
            // 更新全选勾选状态
            const allSelected = filteredPhotos.every(p => selectedPhotos.has(p.path));
            const cb = document.getElementById('selectAllCheckbox');
            if (cb) cb.checked = allSelected;
            displayPhotos();
            updateStats();
            saveSelections();
        }

        function togglePhoto(path) {
            if (selectedPhotos.has(path)) {
                selectedPhotos.delete(path);
            } else {
                selectedPhotos.add(path);
            }
            updateStats();
            saveSelections();
        }

        function toggleSelectAll() {
            const checked = document.getElementById('selectAllCheckbox').checked;
            selectedPhotos.clear();

            if (checked) {
                filteredPhotos.forEach(photo => selectedPhotos.add(photo.path));
                showToast(`已选择所有 ${filteredPhotos.length} 张照片`, { type: 'success' });
            } else {
                showToast('已取消选择所有照片', { type: 'info' });
            }

            displayPhotos();
            updateStats();
        }

        function updateStats() {
            // 计算总数：优先使用相册聚合（更快更全），预览时用当前相册的照片数
            let total = 0;
            const albums = allAlbums || {};
            if (currentView === 'preview' && previewState && Array.isArray(previewState.photos)) {
                total = previewState.photos.length;
            } else if (Object.keys(albums).length > 0) {
                // 相册视图：汇总各相册的 total_count（无需已展开具体照片）
                Object.values(albums).forEach(a => { total += Number(a.total_count || 0); });
            } else {
                total = filteredPhotos.length;
            }
            document.getElementById('totalCount').textContent = total;
            // 计算全局已选数：相册整体选择（减去 excluded）+ 独立选择（排除已被整体选择覆盖的）
            let selectedCount = 0;
            selectedAlbumsAll.forEach(k => { selectedCount += (albums[k]?.total_count || 0) - ((excludedByAlbum.get(k)?.size) || 0); });
            // 去重：从独立选择中剔除已计入相册整体选择的路径
            selectedPhotos.forEach(p => {
                let covered = false;
                for (const k of selectedAlbumsAll) {
                    const prefix = k.replace(/\/+$/,'') + '/';
                    if (p.startsWith(prefix)) { covered = true; break; }
                }
                if (!covered) selectedCount++;
            });
            document.getElementById('selectedCount').textContent = selectedCount;

            // 计算所有照片的总大小（可能不精确）与已选大小（基于相册总大小即时显示）
            let allSize = 0;
            let selectedSize = 0;
            // 总大小：优先用相册聚合的 total_size（快速扫描立即可用）
            if (Object.keys(albums).length > 0) {
                Object.values(albums).forEach(a => { allSize += Number(a.total_size || 0); });
            } else {
                // 退化到逐照片累加
                allPhotos.forEach(ph => { allSize += (ph.size || 0); });
            }
            // 相册整体选中的体积快速汇总
            selectedAlbumsAll.forEach(k => { const alb = albums[k]; if (alb && alb.total_size) selectedSize += alb.total_size; });
            // 额外独立选择（不在相册整体选中集合内）的体积
            selectedPhotos.forEach(p => {
                let covered = false;
                for (const k of selectedAlbumsAll) { const prefix = k.replace(/\/+$/,'') + '/'; if (p.startsWith(prefix)) { covered = true; break; } }
                if (!covered) {
                    const ph = allPhotos.find(x => x.path === p);
                    if (ph && ph.size) selectedSize += ph.size;
                }
            });

            // GB自动转换函数
            function formatSize(bytes) {
                if (bytes >= 1024 * 1024 * 1024) {
                    return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
                } else {
                    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
                }
            }

            document.getElementById('totalSize').textContent = formatSize(allSize);
            document.getElementById('selectedSize').textContent = formatSize(selectedSize);

            const transferBtn = document.getElementById('transferBtn');
            if (transferBtn) transferBtn.disabled = (selectedCount === 0);
        }

        function filterPhotos() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            filteredPhotos = allPhotos.filter(photo =>
                photo.name.toLowerCase().includes(searchText) ||
                photo.path.toLowerCase().includes(searchText)
            );
            sortPhotos();
        }

        function sortPhotos() {
            const sortBy = document.getElementById('sortSelect').value;

            filteredPhotos.sort((a, b) => {
                switch (sortBy) {
                    case 'date_desc': return b.mtime - a.mtime;
                    case 'date_asc': return a.mtime - b.mtime;
                    case 'name_asc': return a.name.localeCompare(b.name);
                    case 'name_desc': return b.name.localeCompare(a.name);
                    case 'size_desc': return b.size - a.size;
                    case 'size_asc': return a.size - b.size;
                    default: return 0;
                }
            });

            displayPhotos();
        }

        function resetPath() {
            outputPathInput.value = defaultOutputPath;
            showToast('已恢复默认输出目录', { type: 'info' });
        }

        async function openFolder() {

            if (!path) {

            }
            
            try {

                console.error('打开文件夹失败:', error);
                showToast('打开失败: ' + error.message, { type: 'error' });

        }

        let __transferPreparing = false;
        let __lastProgressPercent = 0;
        function clearSelections() {
            try {
                selectedPhotos.clear();
                selectedAlbumsAll.clear();
                excludedByAlbum.clear();
            } catch (e) {}
            try {
                localStorage.removeItem(LS_SELECTED_ALBUMS);
                localStorage.removeItem(LS_EXCLUDED_BY_ALBUM);
                localStorage.removeItem(LS_SELECTED_PHOTOS);
            } catch (e) {}
            try {
                updateStats();
                if (currentView === 'album') {
                    displayAlbums();
                } else {
                    displayPhotos();
                }
            } catch (e) {}
        }
        function startProgressPolling() {
            progressInterval = setInterval(updateProgress, 500);
        }

        async function updateProgress() {
            try {
                const response = await fetch('/api/transfer_status');
                const status = await response.json();
                // 计算百分比（优先使用后端对齐字段 percent_visible）
                const visiblePct = (status && typeof status.percent_visible === 'number') ? status.percent_visible : null;
                const computed = (status && typeof status.total === 'number' && status.total > 0)
                    ? Math.round((status.current / status.total) * 100)
                    : null;
                let percent = (visiblePct !== null)
                    ? visiblePct
                    : (computed !== null ? computed : (__transferPreparing ? __lastProgressPercent : 0));
                // Clamp: 不允许在一次传输中倒退
                if (__lastProgressPercent > 0) percent = Math.max(__lastProgressPercent, percent);
                // 完成态强制100%
                if (status && status.total > 0 && status.current >= status.total) {
                    percent = 100;
                }

                // 时间格式化：>=1小时显示 hh:mm:ss，否则 mm:ss
                function fmtTime(sec) {
                    const t = Math.max(0, Math.floor(sec || 0));
                    const h = Math.floor(t / 3600);
                    const m = Math.floor((t % 3600) / 60);
                    const s = t % 60;
                    if (h > 0) {
                        return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                    }
                    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                }

                // 大小与时间（优先使用后端“可见”字段，保证与日志一致）
                const bytesDone = (typeof status.bytes_done_visible === 'number') ? status.bytes_done_visible : (status.bytes_done || 0);
                const bytesTotal = (typeof status.bytes_total_visible === 'number') ? status.bytes_total_visible : (status.bytes_total || 0);
                const doneMB = (bytesDone / 1024 / 1024).toFixed(2);
                const totalMB = (bytesTotal / 1024 / 1024).toFixed(2);
                const remainingMB = Math.max(0, (bytesTotal - bytesDone) / 1024 / 1024);
                const etaSec = (typeof status.eta_sec_visible === 'number') ? status.eta_sec_visible : (status.speed_mbps && status.speed_mbps > 0 ? Math.max(0, remainingMB / status.speed_mbps) : 0);
                const etaText = (typeof status.eta_sec_visible === 'number') ? fmtTime(status.eta_sec_visible) : (status.speed_mbps && status.speed_mbps > 0 ? fmtTime(etaSec) : '--:--');
                const elapsedSec = Math.floor(status.elapsed_sec || 0);
                const totalEstSec = (typeof status.total_estimated_sec === 'number') ? status.total_estimated_sec : Math.floor(elapsedSec + (etaSec || 0));
                const totalText = fmtTime(totalEstSec);
                const pbEl = document.getElementById('progressBar');
                const ptEl = document.getElementById('progressText');
                const ppEl = document.getElementById('progressPercent');
                if (status.is_running) {
                    __transferPreparing = false;
                    if (pbEl) pbEl.classList.remove('indeterminate');
                    // 显示“可见进度/总数（已完成x + 在途y）”
                    const filesDone = (typeof status.completed_count === 'number') ? status.completed_count : (status.current || 0);
                    const inflight = (typeof status.inflight === 'number') ? status.inflight : 0;
                    if (ptEl) ptEl.textContent = `正在传输: ${filesDone + inflight} / ${status.total}（完成${filesDone} + 在途${inflight}）`;
                } else if (__transferPreparing) {
                    if (ptEl) ptEl.textContent = '传输准备中…';
                }
                if (ppEl) ppEl.textContent = (__transferPreparing && percent === 0) ? '…' : (percent + '%');
                if (pbEl) { pbEl.style.width = percent + '%'; if (!pbEl.classList.contains('indeterminate')) pbEl.textContent = percent + '%'; }
                __lastProgressPercent = percent;

                const shouldMask = (status && status.is_running) || __transferPreparing;
                if (shouldMask) {
                    const overlayMsg = (status && status.is_running)
                        ? (status.paused ? '传输已暂停，等待继续' : '传输进行中，请勿操作')
                        : '传输准备中，请勿操作';
                    setContentMask(true, overlayMsg);
                } else {
                    setContentMask(false);
                }

                // 当前文件
                document.getElementById('currentFile').textContent = '当前: ' + (status.current_file || '');
                // 实时显示速度（使用后端实时EMA速度），附带USB标签；>1000MB显示GB
                if (status.speed_mbps && status.speed_mbps > 0) {
                    const usbLabel = status.usb_info && status.usb_info.label ? status.usb_info.label : 'USB';
                    document.getElementById('speedInfo').textContent = `${usbLabel} · ${status.speed_mbps.toFixed(1)} MB/s`;
                } else {
                    document.getElementById('speedInfo').textContent = `速度: 计算中...`;
                }
                // 大小显示：超过1000MB按GB
                function fmtSizeMBGB(mb) {
                    if (mb >= 1000) return (mb/1024).toFixed(2) + ' GB';
                    return mb.toFixed(2) + ' MB';
                }
                document.getElementById('sizeInfo').textContent = `已传输: ${fmtSizeMBGB(bytesDone/1024/1024)} / ${fmtSizeMBGB(bytesTotal/1024/1024)}`;
                // 时间显示：带中文单位（小时/分钟/秒）
                function fmtTimeCN(sec) {
                    const t = Math.max(0, Math.floor(sec||0));
                    const h = Math.floor(t/3600);
                    const m = Math.floor((t%3600)/60);
                    const s = t % 60;
                    let parts = [];
                    if (h > 0) parts.push(`${h}小时`);
                    if (m > 0 || h > 0) parts.push(`${m}分钟`);
                    parts.push(`${s}秒`);
                    return parts.join('');
                }
                document.getElementById('etaInfo').textContent = `预计剩余: ${typeof status.eta_sec_visible === 'number' ? fmtTimeCN(status.eta_sec_visible) : (etaText === '--:--' ? '--:--' : fmtTimeCN(etaSec))}`;
                document.getElementById('totalEstInfo').textContent = `总预计: ${typeof status.total_estimated_sec === 'number' ? fmtTimeCN(status.total_estimated_sec) : fmtTimeCN(totalEstSec)}`;

                // 暂停/继续按钮联动
                const pauseBtn = document.getElementById('pauseBtn');
                const resumeLiveBtn = document.getElementById('resumeLiveBtn');
                if (status.is_running) {
                    if (status.paused) {
                        pauseBtn.style.display = 'none';
                        resumeLiveBtn.style.display = 'inline-block';
                    } else {
                        pauseBtn.style.display = 'inline-block';
                        resumeLiveBtn.style.display = 'none';
                    }
                    document.getElementById('stopBtn').style.display = 'inline-block';
                }

                if (!status.is_running && status.current > 0) {
                    clearInterval(progressInterval);
                    document.getElementById('progressText').textContent = '传输完成!';
                    document.getElementById('currentFile').textContent =
                        status.failed.length > 0 ?
                        `完成! ${status.failed.length} 个文件失败` :
                        '所有文件传输成功!';
                    // 最终强制100%
                    const pb2 = document.getElementById('progressBar');
                    const pp2 = document.getElementById('progressPercent');
                    if (pb2) { pb2.classList.remove('indeterminate'); pb2.style.width = '100%'; pb2.textContent = '100%'; }
                    if (pp2) { pp2.textContent = '100%'; }
                    document.getElementById('transferBtn').style.display = 'inline-block';
                    document.getElementById('stopBtn').style.display = 'none';
                    document.getElementById('scanBtn').disabled = false;
                    document.getElementById('pauseBtn').style.display = 'none';
                    document.getElementById('resumeLiveBtn').style.display = 'none';
                    const pb = document.getElementById('progressBar');
                    if (pb) { pb.classList.remove('indeterminate'); }

                    if (status.failed.length > 0) {
                        console.error('失败的文件:', status.failed);
                        setTimeout(checkResumeProgress, 1000);
                    }
                    setContentMask(false);
                    try {
                        if ((status.total || 0) > 0 && (status.current || 0) >= (status.total || 0)) {
                            // 仅在传输完整结束时清空选择
                            clearSelections();
                        }
                    } catch (e) { /* ignore */ }
                }
            } catch (error) {
                console.error('更新进度失败:', error);
            }
        }

        function displayAlbums() {
            const photoList = document.getElementById('photoList');

            if (Object.keys(allAlbums).length === 0) {
                photoList.innerHTML = '<div class="empty-state"><h3>暂无相册</h3><p>请先扫描照片</p></div>';
                return;
            }

            let html = '';
            html += '<div class="album-grid">';
            const coverGenList = [];

            // 按优先级排序相册
            const sortedAlbums = Object.entries(allAlbums).sort((a, b) => a[1].priority - b[1].priority);

            sortedAlbums.forEach(([albumKey, albumData]) => {
                if ((albumData.total_count || 0) <= 0) return; // 隐藏空相册
                // 计算相册已选数：整体选中则为 total_count 减去 excluded；否则统计 selectedPhotos 前缀命中
                let selectedCount = 0;
                if (selectedAlbumsAll.has(albumKey)) {
                    const excl = excludedByAlbum.get(albumKey);
                    selectedCount = (albumData.total_count || 0) - (excl ? excl.size : 0);
                } else {
                    const prefix = albumKey.replace(/\/+$/,'') + '/';
                    selectedPhotos.forEach(p => { if (p.startsWith(prefix)) selectedCount++; });
                }
                const coverPath = albumData.cover || ((albumData.photos || [])[0]?.path) || '';
                const sizeBytes = Number(albumData.total_size || 0);
                const sizeText = (sizeBytes >= 100*1024*1024) ? (sizeBytes/1024/1024/1024).toFixed(2) + ' GB' : (sizeBytes/1024/1024).toFixed(2) + ' MB';
                const total = (albumData.total_count || 0);
                let stateClass = '';
                if (selectedCount > 0) {
                    stateClass = (selectedCount >= total && total > 0) ? 'selected' : 'partial';
                }

                html += `
                    <div class="album-card ${stateClass}" data-album="${albumKey}" onclick="openAlbumPreview('${albumKey}')" aria-selected="${stateClass ? 'true' : 'false'}" title="${stateClass==='selected' ? '已全选' : (stateClass==='partial' ? '部分选择' : '')}">

                        <div class="album-cover">
                            ${coverPath ? `
                                <div class="skeleton-cover"></div>
                                <img data-cover="${coverPath}" alt="${albumData.name}"
                                     loading="lazy" decoding="async" fetchpriority="low"
                                     onload="onCoverLoaded(this)" onerror="fallbackCover(this, this.alt)">
                            ` : `
                                <div class="album-cover-placeholder">${albumIconSVG(albumData.name)}</div>
                            `}
                        </div>
                        <div class="album-info">
                            <div class="album-header-row">
                                <div class="album-title">
                                    <span class="album-icon" aria-hidden="true">${albumIconSVG(albumData.name)}</span>
                                    <span>${albumData.name}</span>
                                </div>
                                <div class="album-badge">${albumData.total_count} 张</div>
                            </div>
                            <div class="album-stats">
                                <div class="album-stat-item">
                                    <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                        <polyline points="21 15 16 10 5 21"></polyline>
                                    </svg>
                                    <span>体积: <strong>${sizeText}</strong></span>
                                </div>
                                <div class="album-stat-item">
                                    <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                                    </svg>
                                    <span class="album-size">已选: ${selectedCount}</span>
                                </div>
                            </div>
                            <div class="album-actions">
                                <button class="album-action-btn primary" onclick="event.stopPropagation(); toggleAlbumSelection('${albumKey}')">
                                    ${selectedCount === albumData.total_count ? '反选' : '全选'}
                                </button>
                                <button class="album-action-btn secondary" onclick="event.stopPropagation(); openAlbumPreview('${albumKey}')">
                                    预览
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            photoList.innerHTML = html;

            updateStats();
            updateTopActions('album');

            // 优先使用内存缓存；未命中则fetch为blob并写入缓存，避免返回列表时再次请求
            try {
                const coverImgs = document.querySelectorAll('.album-cover img[data-cover]');
                coverImgs.forEach(img => {
                    const p = img.getAttribute('data-cover');
                    if (!p) return;
                    const hit = thumbCacheGet(p);
                    if (hit && hit.url) {
                        img.src = hit.url;
                        return;
                    }
                    const done = () => { const sk = img.parentElement?.querySelector('.skeleton-cover'); if (sk) sk.remove(); img.classList.add('loaded'); };
                    fetch(`/api/thumb?path=${encodeURIComponent(p)}&size=${COVER_THUMB_SIZE}`)
                      .then(r => r.ok ? r.blob() : null)
                      .then(blob => {
                          if (!blob) { img.src = `/api/thumb?path=${encodeURIComponent(p)}&size=${COVER_THUMB_SIZE}`; return; }
                          const entry = thumbCachePut(p, blob);
                          img.onload = done;
                          img.onerror = () => { fallbackCover(img, img.alt || ''); };
                          img.src = (entry && entry.url) ? entry.url : URL.createObjectURL(blob);
                      })
                      .catch(() => { img.src = `/api/thumb?path=${encodeURIComponent(p)}&size=${COVER_THUMB_SIZE}`; });
                });
            } catch (e) { /* ignore */ }

            // 批量触发封面缩略图生成并纳入全局轮询
            try {
                // 收集封面路径
                const imgs = document.querySelectorAll('.album-cover img[data-cover]');
                const paths = [];
                imgs.forEach(img => { const p = img.getAttribute('data-cover'); if (p) { paths.push(p); globalPendingThumbs.add(p); } });
                if (paths.length) {
                    fetch('/api/thumb_batch_generate', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ paths, batch_size: 50, size: COVER_THUMB_SIZE }) }).catch(()=>{});
                    thumbPollLoop();
                }
            } catch (e) {}

            // 预取最可能点击的相册：上次打开的相册，否则第一个
            try {
                const last = localStorage.getItem('at_last_album_key');
                const prefer = (last && allAlbums[last]) ? last : (sortedAlbums.length ? sortedAlbums[0][0] : null);
                if (prefer) prefetchAlbumPhotos(prefer);
            } catch (e) {}

            // 悬停预取：鼠标移入时提前准备该相册首屏
            try {
                const cards = document.querySelectorAll('.album-card[data-album]');
                cards.forEach(card => {
                    const k = card.getAttribute('data-album');
                    card.addEventListener('mouseenter', () => prefetchAlbumPhotos(k));
                    // 触屏设备：首次触摸也可触发
                    card.addEventListener('touchstart', () => prefetchAlbumPhotos(k), { passive: true });
                });
            } catch (e) {}
        }

        // 扁平化图标（Material风格）
        function albumIconSVG(name) {
            const n = (name || '').toLowerCase();
            let icon = 'folder';
            if (n.includes('相机') || n.includes('camera')) icon = 'camera';
            else if (n.includes('截') || n.includes('screenshot')) icon = 'image';
            else if (n.includes('视频') || n.includes('video') || n.includes('抖音') || n.includes('快手')) icon = 'film';
            else if (n.includes('下载') || n.includes('download')) icon = 'download';
            else if (n.includes('微信') || n.includes('qq') || n.includes('telegram') || n.includes('whatsapp')) icon = 'chat';

            switch (icon) {
                case 'camera':
                    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3l2-3h8l2 3h3a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
                case 'image':
                    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
                case 'film':
                    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg>';
                case 'download':
                    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
                case 'chat':
                    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a4 4 0 0 1-4 4H7l-4 4V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>';
                default:
                    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h3l2-3h6l2 3h3a2 2 0 0 1 2 2z"/></svg>';
            }
        }

        function fallbackCover(imgEl, albumName) {
            try {
                if (!imgEl || !imgEl.parentNode) return;
                const parent = imgEl.parentNode;
                imgEl.style.display = 'none';
                const sk = parent.querySelector('.skeleton-cover');
                if (sk) sk.remove();
                parent.innerHTML += `<div class=\"album-cover-placeholder\">${albumIconSVG(albumName)}</div>`;
            } catch (e) {
                console.error('封面回退失败:', e);
            }
        }

        function onCoverLoaded(imgEl) {
            try {
                imgEl.classList.add('loaded');
                const parent = imgEl.parentNode;
                const sk = parent && parent.querySelector('.skeleton-cover');
                if (sk) sk.remove();
            } catch (e) {
                // no-op
            }
        }
        function selectAlbum(albumKey) {
            currentAlbumKey = albumKey;
            const albumData = allAlbums[albumKey];

            // 切换到列表视图并只显示该相册的照片
            filteredPhotos = [...albumData.photos];
            switchToListView();

            showToast(`已选择相册: ${albumData.name}`, 'info');
        }

        function toggleAlbumSelection(albumKey) {
            const albumData = allAlbums[albumKey];
            if (!albumData) return;
            // 使用相册级选择语义，避免必须展开全部具体路径
            if (selectedAlbumsAll.has(albumKey)) {
                const excl = excludedByAlbum.get(albumKey);
                if (excl && excl.size > 0) {
                    // 已整体选择且有排除项：清除排除，变为真正的全选
                    excludedByAlbum.delete(albumKey);
                    showToast(`已选择 ${albumData.name} 全部 (${albumData.total_count})`, { type: 'success' });
                } else {
                    // 已整体选择且无排除：取消选择
                    selectedAlbumsAll.delete(albumKey);
                    showToast(`已取消选择 ${albumData.name}`, { type: 'info' });
                }
            } else {
                // 设置为整体选中并清除排除
                selectedAlbumsAll.add(albumKey);
                excludedByAlbum.delete(albumKey);
                showToast(`已选择 ${albumData.name} 全部 (${albumData.total_count})`, { type: 'success' });
            }

            // 刷新UI与统计
            if (currentView === 'album') {
                displayAlbums();
            } else if (currentView === 'preview' && (previewState.albumKey === albumKey || currentAlbumKey === albumKey)) {
                refreshPreviewSelectionUI();
            }
            updateStats();
        }

        // 新的相册预览（缩略图网格 + 分批加载）
        let previewState = { albumKey: null, photos: [], loaded: 0, batchSize: 200, attached: false, loadingMore: false, seen: new Set() };

        async function openAlbumPreview(albumKey) {
            currentAlbumKey = albumKey;
            const albumData = allAlbums[albumKey];
            if (!albumData) return;
            currentView = 'preview';
            document.getElementById('filterBar').style.display = 'none';
            updateTopActions('preview');
            try { localStorage.setItem('at_last_album_key', albumKey); } catch (e) {}

            // 立即渲染占位骨架，避免点击卡顿
            const photoList = document.getElementById('photoList');
            const skeletonCount = 120; // 足够多的骨架，占满首屏，允许立即滚动
            let skHTML = '<div class="thumb-grid" id="thumbGrid">';
            for (let i=0;i<skeletonCount;i++) { skHTML += '<div class="thumb-item"><div class="thumb-skeleton"></div></div>'; }
            skHTML += '</div>';
            photoList.innerHTML = skHTML;

            // 初始状态（空列表，稍后填充）
            previewState = { albumKey, photos: [], loaded: 0, batchSize: 200, attached: false, loadingMore: false, seen: new Set() };
            attachPreviewScroll();
            showToast(`正在载入 ${albumData.name} (${albumData.total_count} 张)…`, { type: 'info' });

            // 异步获取第一页并渲染，避免阻塞点击
            (async () => {
                try {
                    let photosArr = (albumData.photos || []);
                    if (!photosArr.length) {
                        // 增加首次加载量到1000张，覆盖大部分中小相册
                        const resp = await fetch(`/api/album_photos?album=${encodeURIComponent(albumKey)}&offset=0&limit=1000`);
                        const data = await resp.json();
                        if (data && data.success) {
                            photosArr = data.photos || [];
                            allAlbums[albumKey].photos = photosArr;
                        }
                    }
                    const photosSorted = photosArr.slice().sort((a,b)=> (b.mtime||0) - (a.mtime||0));
                    // 去重：按 path 去重，保持顺序
                    const uniq = [];
                    const seen = new Set();
                    for (const p of photosSorted) {
                        if (!p || !p.path) continue;
                        if (seen.has(p.path)) continue;
                        seen.add(p.path);
                        uniq.push(p);
                    }
                    previewState.photos = uniq;
                    previewState.seen = seen;
                    previewState.loaded = 0;
                    renderAlbumPreviewGrid(true);
                } catch (e) {
                    console.error('加载相册列表失败', e);
                    // 占位退化
                    document.getElementById('thumbGrid').innerHTML = '<div style="padding:16px;color:#666;">加载失败</div>';
                }
            })();
        }

        function renderAlbumPreviewGrid(reset = false) {
            const photoList = document.getElementById('photoList');
            if (reset || !photoList.querySelector('.thumb-grid')) {
                photoList.innerHTML = `<div class="thumb-grid" id="thumbGrid"></div>`;
            }
            const grid = document.getElementById('thumbGrid');
            const start = previewState.loaded;
            const end = Math.min(previewState.photos.length, start + previewState.batchSize);

            const pendingPaths = [];
            const EAGER_LIMIT = 80; // 首屏及附近优先直接加载
            for (let i = start; i < end; i++) {
                const p = previewState.photos[i];
                const isImg = hasPreviewImageExt(p.path);
                const isVid = hasPreviewVideoExt(p.path);
                const canPreview = isImg || isVid || true; // 无扩展名也尝试预览（后端侦测类型）
                const selected = selectedPhotos.has(p.path);
                const tile = document.createElement('div');
                tile.className = 'thumb-item';
                tile.dataset.path = p.path;
                tile.innerHTML = `
                    <div class="thumb-skeleton"></div>
                    ${canPreview ? `<img class="thumb-img" decoding="async" data-path="${p.path}" alt="${p.name}" title="${p.name}">` : ''}
                    ${selected ? '<div class="thumb-overlay">✓</div>' : ''}
                    ${isVid ? '<div class="thumb-video-badge">视频</div>' : ''}
                    <div class="thumb-name" title="${p.name}">${p.name}</div>
                `;
                // 点击选择/取消
                tile.addEventListener('click', () => {
                    const albumKey = previewState.albumKey || currentAlbumKey;
                    if (selectedAlbumsAll.has(albumKey)) {
                        // 整体选中状态下，点击切换为例外（排除）
                        const excl = excludedByAlbum.get(albumKey) || new Set();
                        if (excl.has(p.path)) {
                            excl.delete(p.path);
                            const ov = tile.querySelector('.thumb-overlay');
                            if (!ov) tile.insertAdjacentHTML('beforeend', '<div class="thumb-overlay">✓</div>');
                        } else {
                            excl.add(p.path);
                            const ov = tile.querySelector('.thumb-overlay');
                            if (ov) ov.remove();
                        }
                        excludedByAlbum.set(albumKey, excl);
                    } else {
                        if (selectedPhotos.has(p.path)) selectedPhotos.delete(p.path); else selectedPhotos.add(p.path);
                        const ov = tile.querySelector('.thumb-overlay');
                        if (ov) ov.remove(); else tile.insertAdjacentHTML('beforeend', '<div class="thumb-overlay">✓</div>');
                    }
                    updateStats();
                });
                grid.appendChild(tile);

                // 可见优先：监听进入视口时立刻加载
                const imgNode = tile.querySelector('img.thumb-img');
                if (imgNode) {
                    const io = ensureThumbIO();
                    if (io) { try { io.observe(imgNode); } catch (e) {} }
                }

                // 视频默认封面（数据URI），之后就绪会替换
                if (isVid) {
                    const img = tile.querySelector('img');
                    if (img) {
                        img.setAttribute('data-ph', '1');
                        img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"><rect width="256" height="256" rx="16" fill="%23e8f0fe"/><circle cx="128" cy="128" r="56" fill="%234285f4"/><polygon points="112,96 176,128 112,160" fill="white"/></svg>';
                        img.classList.add('loaded');
                        const sk = tile.querySelector('.thumb-skeleton'); if (sk) sk.remove();
                    }
                }

                // 改为后台批量生成，由全局轮询器批量检测状态并设置src（包括无扩展名）
                pendingPaths.push(p.path);
                globalPendingThumbs.add(p.path);
            }
            previewState.loaded = end;

            // 更新或添加loading指示器
            updateLoadingIndicator();

            // 批量触发后台生成（每批最多100），并启动全局批处理轮询 + 批量可见直出
            if (pendingPaths.length) {
                try {
                    fetch('/api/thumb_batch_generate', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ paths: pendingPaths, batch_size: 100, size: THUMB_GRID_SIZE }) });
                } catch (e) {}
                // 启动（或保持）全局轮询循环
                thumbPollLoop();
                scheduleBatchFetch();
            }
        }

        function refreshPreviewSelectionUI() {
            const grid = document.getElementById('thumbGrid');
            if (!grid) return;
            const tiles = grid.children;
            for (const tile of tiles) {
                const path = tile.dataset.path;
                if (!path) continue;
                const albumKey = previewState.albumKey || currentAlbumKey;
                let has = false;
                if (selectedAlbumsAll.has(albumKey)) {
                    const excl = excludedByAlbum.get(albumKey);
                    has = !(excl && excl.has(path));
                } else {
                    has = selectedPhotos.has(path);
                }
                const ov = tile.querySelector('.thumb-overlay');
                if (has) {
                    if (!ov) tile.insertAdjacentHTML('beforeend', '<div class="thumb-overlay">✓</div>');
                } else {
                    if (ov) ov.remove();
                }
            }

        function attachPreviewScroll() {
            if (previewState.attached) return;
            const photoList = document.getElementById('photoList');
            let lastScrollTop = 0;
            let scrollVelocity = 0;

            const onScroll = () => {
                if (currentView !== 'preview') return;

                // 计算滚动速度，用于预测滚动方向和距离
                const currentScrollTop = photoList.scrollTop;
                scrollVelocity = currentScrollTop - lastScrollTop;
                lastScrollTop = currentScrollTop;

                const nearBottom = photoList.scrollTop + photoList.clientHeight >= photoList.scrollHeight - 300;
                if (nearBottom) {
                    // 如果还有未渲染的，继续渲染
                    if (previewState.loaded < previewState.photos.length) {
                        renderAlbumPreviewGrid(false);
                        scheduleBatchFetch();

                        // 智能预加载：根据滚动速度预测并提前生成缩略图
                        if (scrollVelocity > 50) {  // 快速滚动
                            const predictiveLoadCount = 300;  // 预加载300张
                            const start = previewState.loaded;
                            const end = Math.min(previewState.photos.length, start + predictiveLoadCount);
                            const predictivePaths = previewState.photos.slice(start, end).map(p => p.path);
                            if (predictivePaths.length > 0) {
                                try {
                                    fetch('/api/thumb_batch_generate', {
                                        method: 'POST',
                                        headers: {'Content-Type': 'application/json'},
                                        body: JSON.stringify({ paths: predictivePaths, batch_size: 200, size: THUMB_GRID_SIZE })
                                    });
                                    predictivePaths.forEach(p => globalPendingThumbs.add(p));
                                } catch (e) {}
                            }
                        }
                        return;
                    }
                    // 若已渲染完当前页，但总数更大，则分页拉取更多
                    const album = currentAlbumKey;
                    const total = (allAlbums[album] && allAlbums[album].total_count) ? allAlbums[album].total_count : previewState.photos.length;
                    if (!previewState.loadingMore && previewState.photos.length < total) {
                        previewState.loadingMore = true;
                        updateLoadingIndicator(); // 立即显示loading
                        const offset = previewState.photos.length;
                        const limit = 1000;  // 增加到1000张，减少请求次数
                        fetch(`/api/album_photos?album=${encodeURIComponent(album)}&offset=${offset}&limit=${limit}`)
                            .then(r=>r.json()).then(d=>{
                                if (d && d.success) {
                                    const more = d.photos || [];
                                    // 追加前去重
                                    const add = [];
                                    for (const p of more) {
                                        if (!p || !p.path) continue;
                                        if (previewState.seen && previewState.seen.has(p.path)) continue;
                                        previewState.seen && previewState.seen.add(p.path);
                                        add.push(p);
                                    }
                                    if (add.length) {
                                        previewState.photos = previewState.photos.concat(add);
                                        // 新增页大批量直出，使用更大的批次
                                        // 同时启动后台生成任务，提前准备缩略图
                                        const paths = add.map(p => p.path);
                                        batchFetchPaths(paths, 512);

                                        // 提前生成接下来的200张缩略图（异步，不阻塞）
                                        const nextBatch = paths.slice(512, 712);
                                        if (nextBatch.length > 0) {
                                            try {
                                                fetch('/api/thumb_batch_generate', {
                                                    method: 'POST',
                                                    headers: {'Content-Type': 'application/json'},
                                                    body: JSON.stringify({ paths: nextBatch, batch_size: 200, size: THUMB_GRID_SIZE })
                                                });
                                                nextBatch.forEach(p => globalPendingThumbs.add(p));
                                            } catch (e) {}
                                        }
                                    }
                                    renderAlbumPreviewGrid(false);
                                    scheduleBatchFetch();
                                }
                            }).catch(()=>{}).finally(()=>{
                                previewState.loadingMore = false;
                                updateLoadingIndicator(); // 隐藏loading
                            });
                    }
                }
            };
            photoList.__previewScroll = onScroll;
            photoList.addEventListener('scroll', onScroll);
            previewState.attached = true;
        }

        function detachPreviewScroll() {
            const photoList = document.getElementById('photoList');
            if (photoList.__previewScroll) {
                photoList.removeEventListener('scroll', photoList.__previewScroll);
                delete photoList.__previewScroll;
            }
            previewState.attached = false;
            // 离开预览时，减少无用的缩略图轮询
            stopThumbPolling();
            // 断开可见性观察，释放引用
            disconnectThumbIO();
        }

        // Override startTransfer to handle album transfers（服务端展开，避免前端海量分页请求）
        async function startTransfer() {
            // 开始传输时停止缩略图轮询，释放请求与CPU
            stopThumbPolling();
            // 先做轻量校验，避免无选择/无路径时误进入准备UI
            if ((selectedAlbumsAll?.size || 0) === 0 && (selectedPhotos?.size || 0) === 0) {
                showToast('请至少选择一张照片或一个相册', 'warning');
                return;
            }

            const outputPath = outputPathInput.value.trim();
            if (!outputPath) {
                showToast('请输入输出目录路径', 'warning');
                return;
            }

            // 先立即切换到“传输准备中”并让浏览器渲染一帧，缓解点击后的空白等待
            enterPreparingUI(outputPath);
            await nextFrame();

            // 计算实际选中的照片数量（包括相册整体选择）
            let totalSelectedCount = 0;
            const albums = allAlbums || {};
            selectedAlbumsAll.forEach(k => {
                totalSelectedCount += (albums[k]?.total_count || 0) - ((excludedByAlbum.get(k)?.size) || 0);
            });
            selectedPhotos.forEach(p => {
                let covered = false;
                for (const k of selectedAlbumsAll) {
                    const prefix = k.replace(/\/+$/,'') + '/';
                    if (p.startsWith(prefix)) { covered = true; break; }
                }
                if (!covered) totalSelectedCount++;
            });

            if (totalSelectedCount === 0) {
                exitPreparingUI();
                showToast('请至少选择一张照片或一个相册', 'warning');
                return;
            }

            try {
                const response = await fetch('/api/transfer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify((() => {
                        // 仅提交选择摘要，服务端自行展开，避免前端加载海量分页
                        const albumsArr = Array.from(selectedAlbumsAll || []);
                        const excludeMap = {};
                        albumsArr.forEach(k => {
                            const ex = excludedByAlbum.get(k);
                            if (ex && ex.size) excludeMap[k] = Array.from(ex);
                        });
                        // singles: 未被相册整体选择覆盖的独立选择
                        const singles = [];
                        selectedPhotos.forEach(p => {
                            let covered = false;
                            for (const k of albumsArr) {
                                const prefix = k.replace(/\/+$/,'') + '/';
                                if (p.startsWith(prefix)) { covered = true; break; }
                            }
                            if (!covered) singles.push(p);
                        });
                        // 计算“已选总大小”（字节）：相册聚合大小 - 被排除的照片大小 + 独立选择大小
                        let selectionSizeBytes = 0;
                        try {
                            const albumsMap = allAlbums || {};
                            // 相册整体选择体积
                            albumsArr.forEach(k => {
                                const alb = albumsMap[k];
                                if (alb && alb.total_size) selectionSizeBytes += Number(alb.total_size || 0);
                                // 扣除排除项的体积
                                const ex = excludeMap[k] || [];
                                if (ex && ex.length) {
                                    ex.forEach(p => {
                                        const ph = (allPhotos || []).find(x => x.path === p);
                                        if (ph && ph.size) selectionSizeBytes -= Number(ph.size || 0);
                                    });
                                }
                            });
                            // 未被相册覆盖的独立选择体积
                            (singles || []).forEach(p => {
                                const ph = (allPhotos || []).find(x => x.path === p);
                                if (ph && ph.size) selectionSizeBytes += Number(ph.size || 0);
                            });
                            if (!Number.isFinite(selectionSizeBytes) || selectionSizeBytes < 0) selectionSizeBytes = 0;
                        } catch (e) { selectionSizeBytes = 0; }
                        return {
                            selection: { albums: albumsArr, exclude: excludeMap, singles },
                            selection_size_bytes: selectionSizeBytes,
                            output_dir: outputPath
                        };
                    })())
                });

                const data = await response.json();

                if (data.success) {
                    // 服务端接受后，切换到可停止的传输UI
                    document.getElementById('transferBtn').style.display = 'none';
                    document.getElementById('stopBtn').style.display = 'inline-block';
                    document.getElementById('scanBtn').disabled = true;
                    setContentMask(true, '传输进行中，请勿操作');
                    startProgressPolling();
                    startDeviceStatusPolling();
                } else {
                    showToast('启动传输失败: ' + data.error, { type: 'error' });
                    exitPreparingUI();
                }
            } catch (error) {
                showToast('启动传输失败: ' + error.message, { type: 'error' });
                exitPreparingUI();
            }
        }

        async function loadBurstModeStatus() {
            try {
                const resp = await fetch('/api/usb/burst_mode');
                const data = await resp.json();

                if (data.success) {
                    const burstSwitch = document.getElementById('burstModeSwitch');
                    if (burstSwitch) {

                    }
                }
            } catch (e) {

            }
        }

        async function toggleBurstMode() {
            const burstSwitch = document.getElementById('burstModeSwitch');
            const enabled = burstSwitch.checked;

            try {
                const resp = await fetch('/api/usb/burst_mode', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ enabled: enabled })
                });

                const data = await resp.json();

                if (data.success) {
                    showToast(`ADB Burst模式已${enabled ? '启用' : '禁用'}`, 'success');

                    // 如果启用了Burst模式，建议重新检测USB速度
                    if (enabled) {
                        setTimeout(() => {
                            showToast('Burst模式已启用，建议重新检测USB速度以获得最佳性能', 'info');
                        }, 1000);
                    }
                } else {
                    showToast(`操作失败: ${data.error || '未知错误'}`, 'error');
                    // 恢复开关状态
                    burstSwitch.checked = !enabled;
                }
            } catch (e) {
                console.error('切换Burst模式失败:', e);
                showToast('操作失败: 网络错误', 'error');
                // 恢复开关状态
                burstSwitch.checked = !enabled;
            }
        }
