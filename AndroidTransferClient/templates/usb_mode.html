<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USB模式 - Android照片传输工具</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg width='48' height='48' viewBox='0 0 1024 1024' xmlns='http://www.w3.org/2000/svg'><path d='M0 0m512 0l0 0q512 0 512 512l0 0q0 512-512 512l0 0q-512 0-512-512l0 0q0-512 512-512Z' fill='%234992FF'/><path d='M260.654545 620.897745a37.236364 37.236364 0 1 1-74.472727-1.340509l3.165091-175.476363a186.181818 186.181818 0 0 1 186.144582-182.830546H679.005091a37.236364 37.236364 0 1 1 0 74.472728H375.491491a111.709091 111.709091 0 0 0-111.709091 109.698327L260.654545 620.897745z' fill='%23FFFFFF'/><path d='M697.455709 257.805964a27.927273 27.927273 0 1 1-33.214836 44.907054l-122.842764-90.875345a27.927273 27.927273 0 0 1 33.214836-44.907055l122.842764 90.875346z' fill='%23FFFFFF'/><path d='M675.579345 277.355055a27.927273 27.927273 0 1 1 35.355928 43.250036l-142.391855 116.363636a27.927273 27.927273 0 0 1-35.337309-43.250036l142.373236-116.363636z' fill='%23FFFFFF'/><path d='M800.581818 403.102255a37.236364 37.236364 0 1 1 74.472727 1.340509l-3.16509 175.476363a186.181818 186.181818 0 0 1-186.144582 182.830546H382.231273a37.236364 37.236364 0 1 1 0-74.472728h303.532218a111.709091 111.709091 0 0 0 111.709091-109.698327L800.581818 403.102255z' fill='%23FFFFFF'/><path d='M363.780655 766.194036a27.927273 27.927273 0 1 1 33.214836-44.907054l122.842764 90.875345a27.927273 27.927273 0 0 1-33.214837 44.907055l-122.842763-90.875346z' fill='%23FFFFFF'/><path d='M385.657018 746.644945a27.927273 27.927273 0 1 1-35.355927-43.250036l142.391854-116.363636a27.927273 27.927273 0 0 1 35.33731 43.250036l-142.373237 116.363636z' fill='%23FFFFFF'/></svg>">
    <!-- 移除外网字体以避免阻塞；使用系统字体栈与等宽字体回退 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            padding: 32px 24px;
        }

        .container {
            max-width: 1140px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 2px 6px 2px rgba(60,64,67,0.15);
            overflow: hidden;
        }

        .mode-header {
            background: #f8f9fa;
            padding: 20px 32px;
            border-bottom: 1px solid #e8eaed;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mode-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0;
        }

        .mode-badge.adb {
            background: #4285f4;
            color: white;
        }

        .header {
            background: white;
            padding: 32px 40px;
            border-bottom: 1px solid #e8eaed;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-logo {
            flex-shrink: 0;
        }

        .header-logo svg {
            display: block;
        }

        .header-content {
            flex: 1;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #202124;
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        .header p {
            color: #5f6368;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0;
        }

        .controls {
            padding: 20px 32px;
            background: white;
            border-bottom: 1px solid #e8eaed;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 0 24px;
            height: 40px;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.25px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: none;
            font-family: 'Roboto', sans-serif;
        }

        .btn:disabled {
            background: #f1f3f4 !important;
            color: #80868b !important;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-primary {
            background: #4285f4;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #1a73e8;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        .btn-primary:active:not(:disabled) {
            background: #1765cc;
        }

        .btn-success {
            background: #34a853;
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #2d9648;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        .btn-success:active:not(:disabled) {
            background: #24813b;
        }

        .btn-danger {
            background: #ea4335;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: #d33b2c;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        .btn-danger:active:not(:disabled) {
            background: #b93221;
        }

        .btn-tonal {
            background: rgba(26, 115, 232, 0.1);
            color: #1a73e8;
        }

        .btn-tonal:hover:not(:disabled) {
            background: rgba(26, 115, 232, 0.16);
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        .btn-tonal:active:not(:disabled) {
            background: rgba(26, 115, 232, 0.22);
        }

        .status {
            flex: 1;
            text-align: right;
            font-size: 14px;
            color: #666;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0;
        }

        .status-speed {
            background: #e8f0fe;
            color: #1a73e8;
            margin-right: 8px;
        }

        .status-connected {
            background: #e6f4ea;
            color: #137333;
        }

        .status-disconnected {
            background: #fce8e6;
            color: #c5221f;
        }

        .progress-container {
            padding: 16px 24px;
            background: #fff8e1;
            border-bottom: 1px solid rgba(0,0,0,0.12);
            display: none;
        }

        .progress-container.active {
            display: block;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: rgba(0,0,0,0.87);
            font-weight: 500;
            letter-spacing: 0.25px;
        }

        .progress-bar-container {
            background: rgba(0,0,0,0.12);
            border-radius: 2px;
            height: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar {
            background: #4285f4;
            height: 100%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 4px;
        }
        /* 不确定进度动画 */
        .progress-bar.indeterminate { width: 30%; animation: indeterminate 1.2s infinite ease-out; }
        @keyframes indeterminate { 0% { transform: translateX(-120%);} 100% { transform: translateX(400%);} }

        .current-file {
            font-size: 12px;
            color: rgba(0,0,0,0.6);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: 0.4px;
        }

        .content {
            padding: 32px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            border: 1px solid #e8eaed;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        .stat-card:hover {
            background: #f8f9fa;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            transform: translateY(-1px);
        }

        .stat-card h3 {
            font-size: 10px;
            color: #5f6368;
            margin-bottom: 4px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .stat-card p {
            font-size: 18px;
            font-weight: 600;
            color: #1a73e8;
            font-family: 'Roboto Mono', monospace;
            line-height: 1;
        }

        /* 四列统计卡片布局 */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }
        }

        .filter-bar {
            margin-bottom: 20px;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .filter-bar input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #dadce0;
            border-radius: 24px;
            background: white;
            font-size: 14px;
            font-family: 'Roboto', sans-serif;
            letter-spacing: 0;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-bar input:hover {
            border-color: #b0b3b8;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
        }

        .filter-bar input:focus {
            outline: none;
            border: 2px solid #4285f4;
            padding: 11px 15px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
        }

        .filter-bar select {
            padding: 10px 16px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Roboto', sans-serif;
            background: white;
            cursor: pointer;
            letter-spacing: 0;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-bar select:hover {
            border-color: #b0b3b8;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
        }

        .photo-list {
            height: calc(100vh - 260px);
            overflow-y: auto;
            border: 1px solid #e8eaed;
            border-radius: 12px;
            padding: 12px; /* 避免顶部被遮挡，卡片圆角完整显示 */
            background: #fff;
        }

        .photo-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #e8eaed;
            transition: background 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .photo-item:hover {
            background: #f8f9fa;
        }

        .photo-item:last-child {
            border-bottom: none;
        }

        .photo-checkbox {
            margin-right: 16px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #4285f4;
        }

        .photo-info {
            flex: 1;
        }

        .photo-name {
            font-weight: 500;
            margin-bottom: 4px;
            color: #202124;
            font-size: 14px;
            letter-spacing: 0;
        }

        .photo-details {
            font-size: 13px;
            color: #5f6368;
            letter-spacing: 0;
        }

        .photo-path {
            font-size: 12px;
            color: #80868b;
            margin-top: 4px;
            font-family: 'Roboto Mono', 'Courier New', monospace;
            letter-spacing: 0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            border: 3px solid #e8eaed;
            border-top: 3px solid #4285f4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .select-all-container {
            padding: 16px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e8eaed;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .select-all-container label {
            font-weight: 500;
            cursor: pointer;
            color: #202124;
            font-size: 14px;
            letter-spacing: 0;
        }

        code {
            background: #f1f3f4;
            padding: 3px 8px;
            border-radius: 6px;
            font-family: 'Roboto Mono', 'Courier New', monospace;
            font-size: 13px;
            color: #1a73e8;
            letter-spacing: 0;
        }

        /* Material Design Snackbar/Toast */
        .snackbar {
            visibility: hidden;
            min-width: 288px;
            max-width: 568px;
            background-color: #323232;
            color: #fff;
            text-align: left;
            border-radius: 4px;
            padding: 14px 16px;
            position: fixed;
            z-index: 10000;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.25px;
            line-height: 20px;
            box-shadow: 0 3px 5px -1px rgba(0,0,0,0.2), 0 6px 10px 0 rgba(0,0,0,0.14), 0 1px 18px 0 rgba(0,0,0,0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .snackbar.show {
            visibility: visible;
            animation: snackbar-fadein 0.15s cubic-bezier(0, 0, 0.2, 1), snackbar-fadeout 0.15s cubic-bezier(0.4, 0, 1, 1) 2.85s;
        }

        .snackbar.error {
            background-color: #d32f2f;
        }

        .snackbar.success {
            background-color: #2e7d32;
        }

        .snackbar.warning {
            background-color: #f57c00;
        }

        .snackbar.info {
            background-color: #1976d2;
        }

        .snackbar-message {
            flex: 1;
        }

        @keyframes snackbar-fadein {
            from { bottom: 0; opacity: 0; }
            to { bottom: 24px; opacity: 1; }
        }

        @keyframes snackbar-fadeout {
            from { bottom: 24px; opacity: 1; }
            to { bottom: 0; opacity: 0; }
        }

        /* Material Design Dialog */
        .dialog-overlay {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.32);
            animation: dialog-overlay-fadein 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dialog-overlay.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes dialog-overlay-fadein {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .dialog {
            background: white;
            border-radius: 4px;
            box-shadow: 0 11px 15px -7px rgba(0,0,0,0.2), 0 24px 38px 3px rgba(0,0,0,0.14), 0 9px 46px 8px rgba(0,0,0,0.12);
            min-width: 280px;
            max-width: 560px;
            max-height: calc(100% - 96px);
            overflow: hidden;
            animation: dialog-scale-in 0.2s cubic-bezier(0, 0, 0.2, 1);
        }

        @keyframes dialog-scale-in {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .dialog-title {
            padding: 24px 24px 20px;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 0.15px;
            line-height: 24px;
            color: rgba(0, 0, 0, 0.87);
        }

        .dialog-content {
            padding: 0 24px 24px;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.5px;
            line-height: 24px;
            color: rgba(0, 0, 0, 0.6);
            overflow-y: auto;
            max-height: 400px;
        }

        .dialog-content p {
            margin: 0 0 16px 0;
        }

        .dialog-content p:last-child {
            margin-bottom: 0;
        }

        .dialog-actions {
            padding: 8px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .dialog-button {
            padding: 0 16px;
            height: 36px;
            border: none;
            border-radius: 4px;
            background: none;
            color: #1a73e8;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.25px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dialog-button:hover {
            background: rgba(26, 115, 232, 0.04);
        }

        .dialog-button.primary {
            background: #1a73e8;
            color: white;
        }

        .dialog-button.primary:hover {
            background: #1765cc;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        .directory-picker-overlay {
            display: none;
            position: fixed;
            z-index: 10001;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.32);
        }

        .directory-picker-overlay.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .directory-picker-dialog {
            background: white;
            border-radius: 12px;
            box-shadow: 0 11px 15px -7px rgba(0,0,0,0.2), 0 24px 38px 3px rgba(0,0,0,0.14), 0 9px 46px 8px rgba(0,0,0,0.12);
            width: min(620px, calc(100% - 32px));
            max-height: calc(100vh - 96px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .directory-picker-header {
            padding: 24px 24px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .directory-picker-header h2 {
            font-size: 20px;
            font-weight: 500;
            color: rgba(0, 0, 0, 0.87);
            margin: 0;
        }

        .directory-picker-body {
            padding: 0 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .directory-picker-path {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 13px;
            color: rgba(0, 0, 0, 0.6);
        }

        .directory-picker-current {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-chip {
            border: none;
            background: rgba(26, 115, 232, 0.12);
            color: #1a73e8;
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-chip:hover:not(:disabled) {
            background: rgba(26, 115, 232, 0.18);
        }

        .btn-chip:disabled {
            background: rgba(60, 64, 67, 0.08);
            color: rgba(60, 64, 67, 0.6);
            cursor: not-allowed;
        }

        .directory-picker-list {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            background: #f8f9fa;
            overflow: hidden;
            max-height: 45vh;
            overflow-y: auto;
        }

        .directory-picker-list::-webkit-scrollbar {
            width: 6px;
        }

        .directory-picker-list::-webkit-scrollbar-thumb {
            border-radius: 3px;
            background: rgba(0,0,0,0.2);
        }

        .directory-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border: none;
            background: none;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            color: #202124;
            transition: background 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .directory-item:hover {
            background: rgba(26, 115, 232, 0.08);
        }

        .directory-item .folder-icon {
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #1a73e8;
        }

        .directory-item .directory-item-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .directory-picker-empty {
            padding: 24px;
            text-align: center;
            font-size: 13px;
            color: rgba(0, 0, 0, 0.6);
        }

        .directory-picker-footer {
            padding: 8px 24px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .directory-picker-hint {
            font-size: 12px;
            color: rgba(0, 0, 0, 0.6);
        }

        .icon-button {
            border: none;
            background: none;
            color: rgba(0, 0, 0, 0.6);
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            padding: 4px;
            border-radius: 50%;
            transition: background 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .icon-button:hover {
            background: rgba(0, 0, 0, 0.08);
        }

        /* Album View Styles */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));

    <script>
        // USB Mode JavaScript
        // Polyfill CSS.escape if missing (older Safari)
        try {
            if (typeof CSS === 'undefined' || typeof CSS.escape !== 'function') {
                window.CSS = window.CSS || {};
                window.CSS.escape = function(value) {
                    return String(value).replace(/[^a-zA-Z0-9_\-\u00A0-\uFFFF]/g, function(ch) {
                        const hex = ch.charCodeAt(0).toString(16).toUpperCase();
                        return '\\' + hex + ' ';
                    });
                };
            }
        } catch (e) { /* no-op */ }
        // 全局缩略图内存缓存（LRU，最多保留 10000 张，避免滚动后重复加载）
        const THUMB_CACHE_LIMIT = 10000;
        const thumbCache = new Map(); // key: photo.path, value: { url: blobUrl, ts: number, size: number }
        const THUMB_GRID_SIZE = 128; // 网格缩略图目标尺寸（更快）
        const COVER_THUMB_SIZE = 128; // 封面缩略图尺寸（极致快）

        function thumbCacheGet(key) {
            const v = thumbCache.get(key);
            if (!v) return null;
            v.ts = Date.now();
            return v;
        }

        function thumbCachePut(key, blob) {
            try {
                const url = URL.createObjectURL(blob);
                const entry = { url, ts: Date.now(), size: blob.size || 0 };
                thumbCache.set(key, entry);
                if (thumbCache.size > THUMB_CACHE_LIMIT) {
                    const arr = Array.from(thumbCache.entries());
                    arr.sort((a, b) => a[1].ts - b[1].ts); // 最久未用优先淘汰
                    const evictCount = thumbCache.size - THUMB_CACHE_LIMIT;
                    for (let i = 0; i < evictCount; i++) {
                        const [ek, ev] = arr[i];
                        try { URL.revokeObjectURL(ev.url); } catch (e) {}
                        thumbCache.delete(ek);
                    }
                    console.log(`[ThumbCache] Evicted ${evictCount}, now ${thumbCache.size}`);
                }
                console.log(`[ThumbCache] Cached ${key} (${(entry.size/1024).toFixed(1)} KB)`);
                return entry;
            } catch (e) {
                console.warn('[ThumbCache] Put failed:', e);
                return null;
            }
        }

        async function loadThumbInto(imgEl, path) {
            if (!imgEl || !path) return;
            const hit = thumbCacheGet(path);
            if (hit) {
                const done0 = () => { imgEl.classList.add('loaded'); const sk = imgEl.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); };
                imgEl.onload = done0;

                imgEl.src = entry ? entry.url : URL.createObjectURL(blob);

                    imgEl.onload = done2;

                    imgEl.src = `/api/thumb?path=${encodeURIComponent(path)}&size=${THUMB_GRID_SIZE}`;

        async function thumbPollLoop() {
            // 单例轮询：避免多个并发轮询造成压力
            if (thumbPollRunning) return;
            thumbPollRunning = true;

            const doOne = async () => {
                try {
                    if (globalPendingThumbs.size === 0) {
                        thumbPollRunning = false; // 无任务则停止
                        return;
                    }
                    // 取一批进行轮询：优先处理最新加入的（靠近当前视口更可能是新加入）
                    const arr = Array.from(globalPendingThumbs);
                    const batch = arr.length > MAX_STATUS_BATCH ? arr.slice(-MAX_STATUS_BATCH) : arr;
                    if (batch.length === 0) {
                        thumbPollRunning = false;
                        return;
                    }
                    const resp = await fetch('/api/thumb_status', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paths: batch, size: THUMB_GRID_SIZE })
                    });
                    const data = await resp.json().catch(() => ({}));
                    if (data && data.success && Array.isArray(data.ready)) {
                        let readyCount = 0;
                        for (let i = 0; i < data.ready.length; i++) {
                            if (!data.ready[i]) continue;
                            const path = batch[i];
                            globalPendingThumbs.delete(path);
                            thumbRetryCount.delete(path);
                            // 预览缩略图
                            const img = document.querySelector(`#thumbGrid .thumb-item[data-path="${CSS.escape(path)}"] img`);
                            if (img && (img.getAttribute('data-ph') === '1' || !img.src)) {
                                const done = () => { img.classList.add('loaded'); const sk = img.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); };
                                img.onload = done;
                                img.onerror = () => { const sk = img.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); img.parentElement?.insertAdjacentHTML('beforeend', '<div class="thumb-video-badge">预览失败</div>'); };
                                img.src = `/api/thumb?path=${encodeURIComponent(path)}&size=${THUMB_GRID_SIZE}`;
                                if (img.complete && img.naturalWidth > 0) done();
                                img.removeAttribute('data-ph');
                            }
                            // 相册封面
                            const cover = document.querySelector(`.album-cover img[data-cover="${CSS.escape(path)}"]`);
                            if (cover && !cover.src) {
                                cover.onload = () => { onCoverLoaded(cover); };
                                cover.onerror = () => { fallbackCover(cover, cover.alt || '') };
                                cover.src = `/api/thumb?path=${encodeURIComponent(path)}&size=${COVER_THUMB_SIZE}`;
                            }
                            readyCount++;
                        }
                        // 主动探测：对长时间未就绪的路径做有限度 GET 探测，避免卡死
                        try {
                            let probes = 0;
                            for (const path of batch) {
                                if (probes >= PROBE_FETCH_LIMIT) break;
                                if (!globalPendingThumbs.has(path)) continue;
                                const cnt = (thumbRetryCount.get(path) || 0) + 1;
                                thumbRetryCount.set(path, cnt);
                                if (cnt > MAX_THUMB_RETRY) {
                                    globalPendingThumbs.delete(path);
                                    const img = document.querySelector(`#thumbGrid .thumb-item[data-path="${CSS.escape(path)}"] img`);
                                    const sk = img?.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove();
                                    if (img) img.parentElement?.insertAdjacentHTML('beforeend', '<div class="thumb-video-badge">预览失败</div>');
                                    continue;
                                }
                                if (cnt % 3 !== 0) continue; // 每3轮探测一次
                                probes++;
                                fetch(`/api/thumb?path=${encodeURIComponent(path)}&size=${THUMB_GRID_SIZE}`, { method: 'GET' })
                                  .then(r => {
                                      if (r.ok) return r.blob();
                                      if (r.status === 304) return 'USE_CACHE';
                                      return null;
                                  })
                                  .then(blob => {
                                      if (!blob) return;
                                      const img = document.querySelector(`#thumbGrid .thumb-item[data-path="${CSS.escape(path)}"] img`);
                                      if (img && blob !== 'USE_CACHE') {
                                          const done = () => { img.classList.add('loaded'); const sk = img.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); };
                                          img.onload = done;
                                          img.onerror = () => { const sk = img.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); img.parentElement?.insertAdjacentHTML('beforeend', '<div class="thumb-video-badge">预览失败</div>'); };
                                          img.src = URL.createObjectURL(blob);
                                          if (img.complete && img.naturalWidth > 0) done();
                                          img.removeAttribute('data-ph');
                                      } else if (img && blob === 'USE_CACHE') {
                                          // 304：直接指向同URL，浏览器会使用本地缓存
                                          const done = () => { img.classList.add('loaded'); const sk = img.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); };
                                          img.onload = done;
                                          img.onerror = () => { const sk = img.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); img.parentElement?.insertAdjacentHTML('beforeend', '<div class="thumb-video-badge">预览失败</div>'); };
                                          img.src = `/api/thumb?path=${encodeURIComponent(path)}&size=${THUMB_GRID_SIZE}`;
                                          if (img.complete && img.naturalWidth > 0) done();
                                          img.removeAttribute('data-ph');
                                      }
                                      const cover = document.querySelector(`.album-cover img[data-cover="${CSS.escape(path)}"]`);
                                      if (cover && !cover.src) {
                                          if (blob !== 'USE_CACHE') {
                                              cover.onload = () => { onCoverLoaded(cover); };
                                              cover.src = URL.createObjectURL(blob);
                                          } else {
                                              cover.onload = () => { onCoverLoaded(cover); };
                                              cover.src = `/api/thumb?path=${encodeURIComponent(path)}&size=${COVER_THUMB_SIZE}`;
                                          }
                                      }
                                      globalPendingThumbs.delete(path);
                                      thumbRetryCount.delete(path);
                                  })
                                  .catch(() => {});
                            }
                        } catch (e) {}
                        // 更新整体缩略图进度条
                        const grid = document.getElementById('thumbGrid');
                        const tTotal = previewState.photos.length;

                        if (txt) txt.textContent = `${loadedImgs}/${tTotal} (${percent}%)`;
                    }
                } catch (e) {
                    // 忽略错误，稍后重试
                } finally {
                    // 根据队列大小调整轮询频率（队列大时稍微放缓）并兼顾响应速度
                    const delay = globalPendingThumbs.size > 2000 ? 900 : globalPendingThumbs.size > 500 ? 600 : 400;
                    thumbPollTimer = setTimeout(doOne, delay);
                }
            };

        }

                clearInterval(deviceStatusInterval);
                deviceStatusInterval = null;
            }
        }

        async function checkDeviceStatus() {
            try {
                const response = await fetch('/api/device_status');
                const data = await response.json();

                const statusBadge = document.getElementById('deviceStatus');
                const scanBtn = document.getElementById('scanBtn');
                if (data.connected) {
                    statusBadge.className = 'status-badge status-connected';
                    statusBadge.textContent = data.selected ? `已连接 (${data.selected})` : `已连接 (${data.devices.join(', ')})`;
                    // 确保扫描按钮可用
                    scanBtn.disabled = false;
                    // 自动关闭断开提示框
                    if (window.__disconnectDialogVisible) {
                        hideDialog({ suppressResolve: true });
                        window.__disconnectDialogVisible = false;
                    }
                    // ADB异常提示关闭
                    if (window.__adbIssueDialogVisible) {
                        hideDialog({ suppressResolve: true });
                        window.__adbIssueDialogVisible = false;
                    }
                    // 不在轮询中重复测速/取速率，避免干扰缩略图生成
                } else {
                    statusBadge.className = 'status-badge status-disconnected';
                    statusBadge.textContent = '未连接';
                    const usbBadge = document.getElementById('usbSpeedBadge');
                    if (usbBadge) usbBadge.style.display = 'none';
                }

                // 处理设备连接事件
                if (data.connect_detected) {
                    handleDeviceConnect();
                    refreshDevices();
                }

                if (data.disconnect_detected || !data.connected) {
                    handleDeviceDisconnect();
                    refreshDevices();
                }

                // ADB异常提示（非阻塞）
                if (data.adb_issue && !window.__adbIssueDialogVisible) {
                    window.__adbIssueDialogVisible = true;
                    showDialog({
                        title: 'ADB 状态异常',
                        message: '检测到 ADB 无法访问设备。\n\n请尝试：\n• 重新插拔数据线\n• 确保已允许 USB 调试\n• 尝试重启 ADB 服务',
                        actions: [
                            { label: '重启ADB', type: 'primary', onClick: () => attemptRestartAdb(), keepOpen: false },
                            { label: '我知道了' }
                        ]
                    });
                }
            } catch (error) {
                console.error('检查设备状态失败:', error);
            }
        }

        async function attemptRestartAdb() {
            try {
                const resp = await fetch('/api/adb_restart', { method: 'POST' });
                const data = await resp.json();
                if (data.success) {
                    showToast('ADB 服务已重启', { type: 'success' });
                    window.__adbIssueDialogVisible = false;
                } else {
                    showToast('重启失败: ' + (data.error || '未知错误'), { type: 'error' });
                }
            } catch (e) {
                showToast('重启失败: ' + e.message, { type: 'error' });
            }
        }

        function handleDeviceConnect() {
            // 设备连接时自动开始扫描
            const scanBtn = document.getElementById('scanBtn');
            scanBtn.disabled = false; // 启用扫描按钮

            // 避免在扫描或传输进行中重复触发
            if (scanStatusInterval || progressInterval) {
                showToast('📱 设备已连接', { type: 'info' });
                if (window.__disconnectDialogVisible) {
                    hideDialog({ suppressResolve: true });
                    window.__disconnectDialogVisible = false;
                }
                updateUsbSpeedInfo();
                setTimeout(() => updateUsbSpeedInfo(), 2000);
                return;
            }

            showToast('🎉 检测到新设备连接，自动开始扫描照片...', { type: 'success' });
            if (window.__disconnectDialogVisible) {
                hideDialog({ suppressResolve: true });
                window.__disconnectDialogVisible = false;
            }
            updateUsbSpeedInfo();
            setTimeout(() => updateUsbSpeedInfo(), 2000);
            setTimeout(() => {
                scanPhotos();
            }, 800);
        }

        function resetStateAfterDisconnect() {
            stopThumbPolling();
            globalPendingThumbs.clear();
            thumbRetryCount.clear();
            thumbCache.clear();
            albumPrefetching.clear();
            disconnectThumbIO();
            detachPreviewScroll();

            allPhotos = [];
            filteredPhotos = [];
            selectedPhotos.clear();
            selectedAlbumsAll.clear();
            excludedByAlbum.clear();
            allAlbums = {};
            currentAlbumKey = null;
            currentView = 'list';
            previewState = { albumKey: null, photos: [], loaded: 0, batchSize: 120, attached: false };

            const photoList = document.getElementById('photoList');
            if (photoList) {
                photoList.innerHTML = '<div class="empty-state"><h3>设备未连接</h3><p>请连接设备后点击“扫描照片”</p></div>';
            }

            const scanBtnEl = document.getElementById('scanBtn');
            if (scanBtnEl) {
                scanBtnEl.disabled = true;
                scanBtnEl.textContent = '扫描照片';
            }

            const stopBtn = document.getElementById('stopBtn');
            if (stopBtn) stopBtn.style.display = 'none';
            const transferBtn = document.getElementById('transferBtn');
            if (transferBtn) {
                transferBtn.style.display = 'inline-block';
                transferBtn.disabled = true;
            }
            const resumeBtn = document.getElementById('resumeBtn');
            if (resumeBtn) resumeBtn.style.display = 'none';

            const usbBadge = document.getElementById('usbSpeedBadge');
            if (usbBadge) {
                usbBadge.style.display = 'none';
                usbBadge.textContent = '';
            }

            const burstToggle = document.getElementById('burstModeToggle');
            if (burstToggle) burstToggle.style.display = 'none';

            const progressTextEl = document.getElementById('progressText');
            if (progressTextEl) progressTextEl.textContent = '等待扫描';
            const progressBarEl = document.getElementById('progressBar');
            if (progressBarEl) {
                progressBarEl.style.width = '0%';
                progressBarEl.textContent = '0%';
            }
            const currentFileEl = document.getElementById('currentFile');
            if (currentFileEl) currentFileEl.textContent = '等待开始...';

            updateTopActions('list');
            updateStats();
        }

        function handleDeviceDisconnect() {
            // 不停止设备状态轮询，便于重新连接后自动检测

            if (scanStatusInterval) {
                stopScanStatusPolling();
                const scanBtn = document.getElementById('scanBtn');
                scanBtn.disabled = false;
                scanBtn.textContent = '扫描照片';
            }

            if (progressInterval) {
                stopTransfer();
                clearInterval(progressInterval);
                document.getElementById('transferBtn').style.display = 'inline-block';
                document.getElementById('stopBtn').style.display = 'none';
            }

            if (!window.__disconnectDialogVisible) {
                showDialog({
                    title: '设备已断开',
                    message: '⚠️ USB设备已断开！\n\n请重新连接设备后再继续操作。'
                });
                window.__disconnectDialogVisible = true;
            }

            const statusBadge = document.getElementById('deviceStatus');
            statusBadge.className = 'status-badge status-disconnected';
            statusBadge.textContent = '设备已断开';

            document.getElementById('scanBtn').disabled = true;
            document.getElementById('transferBtn').disabled = true;

            resetStateAfterDisconnect();
        }

        // 页面加载：启动设备状态轮询与静默检测，并检查是否需要恢复任务
        // 使用 DOMContentLoaded 更快进入可交互状态，避免等待所有资源
        window.addEventListener('DOMContentLoaded', () => {
            // 初始化Burst模式状态
            loadBurstModeStatus();

            startDeviceStatusPolling();
            initialDeviceCheck();
            checkResumeProgress();
        });

        async function initialDeviceCheck() {
            try {
                const response = await fetch('/api/device_status');
                const data = await response.json();
                const statusBadge = document.getElementById('deviceStatus');
                const scanBtn = document.getElementById('scanBtn');

                if (data.connected) {
                    statusBadge.className = 'status-badge status-connected';
                    statusBadge.textContent = data.selected ? `已连接 (${data.selected})` : `已连接 (${data.devices.join(', ')})`;
                    scanBtn.disabled = false;
                    if (window.__disconnectDialogVisible) {
                        hideDialog({ suppressResolve: true });
                        window.__disconnectDialogVisible = false;
                    }
                    updateUsbSpeedInfo();
                    refreshDevices();
                    // 优先复用已有扫描结果
                    const stResp = await fetch('/api/scan_status');
                    const st = await stResp.json();
                    if (st && st.stage === 'done' && st.photo_count > 0) {
                        await loadScanResult();
                        restoreLastView();
                    } else if (st && (st.is_running || st.stage === 'finding' || st.stage === 'getting_info')) {
                        startScanStatusPolling();
                    } else {
                        // 不再默认自动扫描：首屏先可交互，让用户手动点击“扫描照片”
                        const scanBtnNow = document.getElementById('scanBtn');
                        if (scanBtnNow) scanBtnNow.disabled = false;
                    }
                } else {
                    statusBadge.className = 'status-badge status-disconnected';
                    statusBadge.textContent = '未连接';
                }
            } catch (error) {
                console.error('初始设备检测失败:', error);
            }
        }

        async function refreshDevices() {
            try {
                const resp = await fetch('/api/devices');
                const data = await resp.json();
                const sel = document.getElementById('deviceSelect');
                if (!sel) return;
                if (!data.devices || data.devices.length <= 1) {
                    sel.style.display = 'none';
                    sel.innerHTML = '';
                    return;
                }
                sel.style.display = 'inline-block';
                const current = data.selected || '';
                sel.innerHTML = data.devices.map(d => `<option value="${d}" ${d===current?'selected':''}>${d}</option>`).join('');
                sel.onchange = async () => {
                    const serial = sel.value;
                    try {
                        const r = await fetch('/api/select_device', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ serial }) });
                        const j = await r.json();
                        if (j.success) {
                            showToast(`已切换到设备: ${serial}`, { type: 'success' });
                            updateUsbSpeedInfo();
                        } else {
                            showToast('切换设备失败: ' + (j.error||'未知'), { type: 'error' });
                        }
                    } catch (e) {
                        showToast('切换设备失败: ' + e.message, { type: 'error' });
                    }
                };
            } catch (e) {
                // ignore
            }
        }

        async function updateUsbSpeedInfo() {
            try {
                const resp = await fetch('/api/usb/speed');
                const info = await resp.json();
                const statusBadge = document.getElementById('deviceStatus');
                const usbBadge = document.getElementById('usbSpeedBadge');
                const burstToggle = document.getElementById('burstModeToggle');

                if (!usbBadge) return;

                if (info && info.success) {
                    if (info.probing) {
                        usbBadge.textContent = 'USB 测速中…';
                    } else {
                        const label = info.label || 'USB 未知';
                        const mbps = typeof info.measured_mbps === 'number' && info.measured_mbps > 0 ? ` · ${info.measured_mbps.toFixed(1)} MB/s` : '';
                        usbBadge.textContent = label + mbps;
                    }
                    usbBadge.style.display = 'inline-flex';
                    if (burstToggle) burstToggle.style.display = 'inline-flex';
                } else {
                    // 显示未知占位，避免位置抖动
                    usbBadge.textContent = 'USB 未知';
                    usbBadge.style.display = 'inline-flex';
                    if (burstToggle) burstToggle.style.display = 'none';
                }

                // 加载Burst模式状态
                await loadBurstModeStatus();
            } catch (e) {
                console.error('更新USB速度信息失败:', e);
                const usbBadge = document.getElementById('usbSpeedBadge');
                if (usbBadge) {
                    usbBadge.textContent = 'USB 未知';
                    usbBadge.style.display = 'inline-flex';
                }
                if (burstToggle) burstToggle.style.display = 'none';
                // 仍然尝试加载Burst模式状态
                await loadBurstModeStatus();
            }
        }

        async function ignoreResumeForever() {
            try {
                localStorage.setItem('at_resume_ignore_forever', '1');
            } catch (e) {}
            try {
                await fetch('/api/clear_progress', { method: 'POST' });
            } catch (e) {}
            const resumeBtn = document.getElementById('resumeBtn');
            if (resumeBtn) resumeBtn.style.display = 'none';
            showToast('已忽略未完成任务，今后不再提示', { type: 'success' });
        }

        async function checkResumeProgress() {
            try {
                // 用户选择永久忽略时，不再弹框
                try {
                    if (localStorage.getItem('at_resume_ignore_forever') === '1') {
                        const resumeBtn = document.getElementById('resumeBtn');
                        if (resumeBtn) resumeBtn.style.display = 'none';
                        return;
                    }
                } catch (e) {}
                const response = await fetch('/api/check_progress');
                const data = await response.json();

                if (data.has_progress) {
                    const resumeBtn = document.getElementById('resumeBtn');
                    resumeBtn.style.display = 'inline-block';
                    resumeBtn.title = `有 ${data.pending} 个文件未传输（已完成 ${data.completed}/${data.total}）`;

                    // 三按钮对话：继续、稍后、忽略且不再提示
                    showDialog({
                        title: '发现未完成的传输',
                        message: `发现未完成的传输任务：\n\n总文件: ${data.total}\n已完成: ${data.completed}\n剩余: ${data.pending}\n失败: ${data.failed}\n\n要如何处理？`,
                        actions: [
                            { label: '稍后' },
                            { label: '忽略并不再提示', onClick: () => ignoreResumeForever() },
                            { label: '继续传输', type: 'primary', onClick: () => resumeTransfer() }
                        ]
                    });
                }
            } catch (error) {
                console.error('检查进度失败:', error);
            }
        }

        async function resumeTransfer() {
            const resumeBtn = document.getElementById('resumeBtn');
            resumeBtn.disabled = true;
            resumeBtn.textContent = '恢复中...';

            try {
                const response = await fetch('/api/resume_transfer', { method: 'POST' });
                const data = await response.json();

                if (data.success) {
                    document.getElementById('progressContainer').classList.add('active');
                    resumeBtn.style.display = 'none';
                    document.getElementById('stopBtn').style.display = 'inline-block';
                    document.getElementById('scanBtn').disabled = true;
                    document.getElementById('transferBtn').disabled = true;
                    startProgressPolling();
                    startDeviceStatusPolling();
                    showToast(data.message, { type: 'success' });
                } else {
                    showToast('恢复传输失败: ' + data.error, { type: 'error' });
                    resumeBtn.disabled = false;
                    resumeBtn.textContent = '🔄 继续传输';
                }
            } catch (error) {
                showToast('恢复传输失败: ' + error.message, { type: 'error' });
                resumeBtn.disabled = false;
                resumeBtn.textContent = '🔄 继续传输';
            }
        }

        async function checkDevice() {
            const btn = document.getElementById('checkDeviceBtn');
            btn.disabled = true;
            btn.textContent = '检查中...';

            try {
                const response = await fetch('/api/check_device');
                const data = await response.json();

                const statusBadge = document.getElementById('deviceStatus');
                if (data.connected) {
                    statusBadge.className = 'status-badge status-connected';
                    statusBadge.textContent = `已连接 (${data.devices.join(', ')})`;
                    document.getElementById('scanBtn').disabled = false;
                } else {
                    statusBadge.className = 'status-badge status-disconnected';
                    statusBadge.textContent = '未连接';
                    showDialog({
                        title: '未检测到设备',
                        message: '请确保：\n1. 手机已通过USB连接\n2. 已开启USB调试\n3. 已授权此电脑的ADB访问'
                    });
                }
            } catch (error) {
                showToast('检查设备失败: ' + error.message, { type: 'error' });
            } finally {
                btn.disabled = false;
                btn.textContent = '检查设备';
            }
        }

        async function scanPhotos() {
            const btn = document.getElementById('scanBtn');
            const photoList = document.getElementById('photoList');

            btn.disabled = true;
            btn.textContent = '扫描中...';

            stopScanStatusPolling();
            selectedPhotos.clear();
            allPhotos = [];
            filteredPhotos = [];
            document.getElementById('transferBtn').disabled = true;
            document.getElementById('stats').style.display = 'none';
            document.getElementById('filterBar').style.display = 'none';

            photoList.innerHTML = '<div class="loading"><div class="spinner"></div><p>正在扫描手机照片，请稍候...</p></div>';

            try {
                const response = await fetch('/api/scan', { method: 'POST' });
                const data = await response.json();

                if (data.success) {
                    startScanStatusPolling();
                    startDeviceStatusPolling();
                } else {
                    throw new Error(data.error || '扫描启动失败');
                }
            } catch (error) {
                showToast('扫描失败: ' + error.message, { type: 'error' });
                photoList.innerHTML = '<div class="empty-state"><h3>扫描失败</h3><p>' + error.message + '</p></div>';
                btn.disabled = false;
                btn.textContent = '重新扫描';
            }
        }

        function stopScanStatusPolling() {
            if (scanStatusInterval) {
                clearInterval(scanStatusInterval);
                scanStatusInterval = null;
            }
        }

        function startScanStatusPolling() {
            stopScanStatusPolling();
            updateScanStatus(true);
            scanStatusInterval = setInterval(updateScanStatus, 1000);
        }

        async function updateScanStatus(isInitial = false) {
            const photoList = document.getElementById('photoList');

            try {
                const response = await fetch('/api/scan_status');
                const status = await response.json();

                if (status.stage === 'error' || status.error) {
                    throw new Error(status.error || '扫描失败');
                }

            if (status.is_running) {
                    const stageDescriptions = {
                        idle: '准备扫描...',
                        finding: '正在查找照片文件...',
                        getting_info: '正在获取照片信息...',
                        thumbs: '正在预生成缩略图（可能较慢）...'
                    };

                    const stageText = stageDescriptions[status.stage] || '正在扫描手机照片...';
                    let extraInfo = '';

                    if (status.stage === 'finding') {
                        if ((status.files_found || 0) > 0) {
                            extraInfo = `已发现 ${status.files_found} 个文件`;
                        } else {
                            extraInfo = '';
                        }
                    } else if (status.stage === 'getting_info') {
                        const percent = status.total_files > 0 ? Math.round((status.files_processed / status.total_files) * 100) : 0;
                        extraInfo = `处理中: ${status.files_processed}/${status.total_files} (${percent}%)`;
                    } else if (status.stage === 'thumbs') {
                        const tTotal = status.thumbs_total || 0;
                        const tDone = status.thumbs_done || 0;
                        const percent = tTotal > 0 ? Math.round((tDone / tTotal) * 100) : 0;
                        extraInfo = `缩略图: ${tDone}/${tTotal} (${percent}%)`;
                    }

                    // 若已生成部分相册预览，则增量显示相册卡片 + 骨架
                    const ap = status.albums_preview || {};
                    const albumKeys = Object.keys(ap);
                    if (albumKeys.length > 0) {
                        const tTotal = status.thumbs_total || 0;
                        const tDone = status.thumbs_done || 0;
                        const percent = tTotal > 0 ? Math.round((tDone / tTotal) * 100) : 0;
                        let html = '';
                        html += `<div class="progress-container active" id="thumbProgressWrap">
                                    <div class="progress-info">
                                        <span>缩略图生成进度</span>
                                        <span id="thumbProgressText">${tDone}/${tTotal} (${percent}%)</span>
                                    </div>
                                    <div class="progress-bar-container"><div class="progress-bar" id="thumbProgressBar" style="width:${percent}%"></div></div>
                                </div>`;
                        html += '<div class="album-grid">';
                        // 排序
                        albumKeys.sort((a,b)=> (ap[a].priority||99) - (ap[b].priority||99));
                        albumKeys.forEach(k => {
                            const a = ap[k];
                            const cover = a.cover || '';
                            html += `
                                <div class="album-card" onclick="showToast('正在扫描相册，请稍候...', { type: 'info' })">
                                    <div class="album-cover">
                                        ${cover ? `
                                            <div class="skeleton-cover"></div>
                                            <img src="/api/thumb?path=${encodeURIComponent(cover)}" class="loaded" alt="${a.name}">
                                        ` : `
                                            <div class="album-cover-placeholder">${albumIconSVG(a.name)}</div>
                                        `}
                                    </div>
                                    <div class="album-info">
                                        <div class="album-header-row">
                                            <div class="album-title">
                                                <span class="album-icon" aria-hidden="true">${albumIconSVG(a.name)}</span>
                                                <span>${a.name}</span>
                                            </div>
                                            <div class="album-badge">${a.total_count} 张</div>
                                        </div>
                                        <div class="album-stats">
                                            <div class="album-stat-item">
                                                <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                                    <polyline points="21 15 16 10 5 21"></polyline>
                                                </svg>
                                                <span>已选择: <strong>0</strong></span>
                                            </div>
                                            <div class="album-stat-item">
                                                <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                                                </svg>
                                                <span class="album-size">${(a.total_size / 1024 / 1024).toFixed(2)} MB</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>`;
                        });
                        // 附加若干骨架卡片，暗示仍在加载
                        const skeletonCount = Math.min(6, Math.max(0, 12 - albumKeys.length));
                        for (let i=0;i<skeletonCount;i++) {
                            html += '<div class="album-card skeleton" style="height: 230px;"></div>';
                        }
                        html += '</div>';
                        photoList.innerHTML = html;
                    } else {
                        // 仍未有预览：显示不确定进度和骨架占位
                        let html = '';
                        html += `<div class="progress-container active">
                                    <div class="progress-info">
                                        <span>${stageText}</span>
                                        <span id="scanFindingText">${extraInfo || '正在扫描存储…'}</span>
                                    </div>
                                    <div class="progress-bar-container"><div class="progress-bar indeterminate"></div></div>
                                </div>`;
                        html += '<div class="album-grid">';
                        for (let i=0;i<8;i++) { html += '<div class="album-card skeleton" style="height: 230px;"></div>'; }
                        html += '</div>';
                        photoList.innerHTML = html;
                    }
                    return;
                }

                if (status.stage === 'done') {
                    stopScanStatusPolling();
                    stopDeviceStatusPolling();
                    await loadScanResult();
                    return;
                }

                if (!status.is_running && status.stage === 'idle' && !isInitial) {
                    stopScanStatusPolling();
                    const btn = document.getElementById('scanBtn');
                    btn.disabled = false;
                    btn.textContent = '重新扫描';
                }
            } catch (error) {
                stopScanStatusPolling();
                const btn = document.getElementById('scanBtn');
                btn.disabled = false;
                btn.textContent = '重新扫描';
                photoList.innerHTML = `<div class="empty-state"><h3>扫描失败</h3><p>${error.message}</p></div>`;
                console.error('更新扫描状态失败:', error);
            }
        }

        async function loadScanResult() {
            const photoList = document.getElementById('photoList');

            try {
                const response = await fetch('/api/scan_result');
                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.error || '扫描结果获取失败');
                }

                allPhotos = result.photos || [];
                allAlbums = result.albums || {};
                filteredPhotos = [...allPhotos];
                selectedPhotos.clear();

            // 显示相册视图
            switchToAlbumView();

                // 标记已有扫描结果，避免刷新后重复自动扫描
                localStorage.setItem('at_last_scan_done', '1');

                updateStats();
                document.getElementById('stats').style.display = 'grid';
            document.getElementById('viewSwitcher').style.display = 'none';
            document.getElementById('filterBar').style.display = 'none';
            } catch (error) {
                photoList.innerHTML = `<div class="empty-state"><h3>扫描失败</h3><p>${error.message}</p></div>`;
                showToast('扫描失败: ' + error.message, { type: 'error' });
            } finally {
                const btn = document.getElementById('scanBtn');
                btn.disabled = false;
                btn.textContent = '重新扫描';
            }
        }

        function displayPhotos() {
            const photoList = document.getElementById('photoList');

            if (filteredPhotos.length === 0) {
                photoList.innerHTML = '<div class="empty-state"><h3>没有找到照片</h3><p>请调整筛选条件</p></div>';
                return;
            }

            let html = '<div class="select-all-container">';
            html += '<input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()" class="photo-checkbox">';
            html += '<label for="selectAllCheckbox">全选 / 全不选</label>';
            html += `<span style="margin-left:12px; color:#666;">共 ${filteredPhotos.length} 张</span>`;
            html += '<button class="btn btn-tonal" style="margin-left:12px;height:32px;padding:0 12px;" onclick="invertSelection()">反选</button>';
            html += '</div>';

            // 限制显示数量，提高性能
            const maxDisplay = 1000;
            const displayCount = Math.min(filteredPhotos.length, maxDisplay);

            for (let i = 0; i < displayCount; i++) {
                const photo = filteredPhotos[i];
                const isSelected = selectedPhotos.has(photo.path);
                html += `
                    <div class="photo-item">
                        <input type="checkbox" class="photo-checkbox" ${isSelected ? 'checked' : ''}
                               onchange="togglePhoto('${photo.path}')" data-path="${photo.path}">
                        <div class="photo-info">
                            <div class="photo-name">${photo.name}</div>
                            <div class="photo-details">
                                大小: ${photo.size_mb} MB | 日期: ${photo.date}
                            </div>
                            <div class="photo-path">${photo.path}</div>
                        </div>
                    </div>
                `;
            }

            if (filteredPhotos.length > maxDisplay) {
                html += `<div style="text-align:center;padding:20px;color:#666;">显示前 ${maxDisplay} 张，共 ${filteredPhotos.length} 张照片。请使用相册视图浏览所有照片。</div>`;
            }

            photoList.innerHTML = html;
            // 统一由 updateStats 控制按钮可用状态（考虑相册整体选择）
            updateStats();

        function invertSelection() {
            const before = selectedPhotos.size;
            const set = new Set(selectedPhotos);
            filteredPhotos.forEach(p => {
                if (set.has(p.path)) {
                    selectedPhotos.delete(p.path);
                } else {
                    selectedPhotos.add(p.path);
                }
            });
            // 更新全选勾选状态
            const allSelected = filteredPhotos.every(p => selectedPhotos.has(p.path));
            const cb = document.getElementById('selectAllCheckbox');
            if (cb) cb.checked = allSelected;
            displayPhotos();
            updateStats();
        }

        function togglePhoto(path) {
            if (selectedPhotos.has(path)) {
                selectedPhotos.delete(path);
            } else {
                selectedPhotos.add(path);
            }
            updateStats();
        }

        function toggleSelectAll() {
            const checked = document.getElementById('selectAllCheckbox').checked;
            selectedPhotos.clear();

            if (checked) {
                filteredPhotos.forEach(photo => selectedPhotos.add(photo.path));
                showToast(`已选择所有 ${filteredPhotos.length} 张照片`, { type: 'success' });
            } else {
                showToast('已取消选择所有照片', { type: 'info' });
            }

            displayPhotos();
            updateStats();
        }

        function updateStats() {
            // 计算总数：优先使用相册聚合（更快更全），预览时用当前相册的照片数
            let total = 0;
            const albums = allAlbums || {};
            if (currentView === 'preview' && previewState && Array.isArray(previewState.photos)) {
                total = previewState.photos.length;
            } else if (Object.keys(albums).length > 0) {
                // 相册视图：汇总各相册的 total_count（无需已展开具体照片）
                Object.values(albums).forEach(a => { total += Number(a.total_count || 0); });
            } else {
                total = filteredPhotos.length;
            }
            document.getElementById('totalCount').textContent = total;
            // 计算全局已选数：相册整体选择（减去 excluded）+ 独立选择（排除已被整体选择覆盖的）
            let selectedCount = 0;
            selectedAlbumsAll.forEach(k => { selectedCount += (albums[k]?.total_count || 0) - ((excludedByAlbum.get(k)?.size) || 0); });
            // 去重：从独立选择中剔除已计入相册整体选择的路径
            selectedPhotos.forEach(p => {
                let covered = false;
                for (const k of selectedAlbumsAll) {
                    const prefix = k.replace(/\/+$/,'') + '/';
                    if (p.startsWith(prefix)) { covered = true; break; }
                }
                if (!covered) selectedCount++;
            });
            document.getElementById('selectedCount').textContent = selectedCount;

            // 计算所有照片的总大小（可能不精确）与已选大小（基于相册总大小即时显示）
            let allSize = 0;
            let selectedSize = 0;
            // 总大小：优先用相册聚合的 total_size（快速扫描立即可用）
            if (Object.keys(albums).length > 0) {
                Object.values(albums).forEach(a => { allSize += Number(a.total_size || 0); });
            } else {
                // 退化到逐照片累加
                allPhotos.forEach(ph => { allSize += (ph.size || 0); });
            }
            // 相册整体选中的体积快速汇总
            selectedAlbumsAll.forEach(k => { const alb = albums[k]; if (alb && alb.total_size) selectedSize += alb.total_size; });
            // 额外独立选择（不在相册整体选中集合内）的体积
            selectedPhotos.forEach(p => {
                let covered = false;
                for (const k of selectedAlbumsAll) { const prefix = k.replace(/\/+$/,'') + '/'; if (p.startsWith(prefix)) { covered = true; break; } }
                if (!covered) {
                    const ph = allPhotos.find(x => x.path === p);
                    if (ph && ph.size) selectedSize += ph.size;
                }
            });

            // GB自动转换函数
            function formatSize(bytes) {
                if (bytes >= 1024 * 1024 * 1024) {
                    return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
                } else {
                    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
                }
            }

            document.getElementById('totalSize').textContent = formatSize(allSize);
            document.getElementById('selectedSize').textContent = formatSize(selectedSize);

            const transferBtn = document.getElementById('transferBtn');
            if (transferBtn) transferBtn.disabled = (selectedCount === 0);
        }

        function filterPhotos() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            filteredPhotos = allPhotos.filter(photo =>
                photo.name.toLowerCase().includes(searchText) ||
                photo.path.toLowerCase().includes(searchText)
            );
            sortPhotos();
        }

        function sortPhotos() {
            const sortBy = document.getElementById('sortSelect').value;

            filteredPhotos.sort((a, b) => {
                switch (sortBy) {
                    case 'date_desc': return b.mtime - a.mtime;
                    case 'date_asc': return a.mtime - b.mtime;
                    case 'name_asc': return a.name.localeCompare(b.name);
                    case 'name_desc': return b.name.localeCompare(a.name);
                    case 'size_desc': return b.size - a.size;
                    case 'size_asc': return a.size - b.size;
                    default: return 0;
                }
            });

            displayPhotos();
        }

        function startProgressPolling() {
            progressInterval = setInterval(updateProgress, 500);
        }

        async function updateProgress() {
            try {
                const response = await fetch('/api/transfer_status');
                const status = await response.json();

                const percent = status.total > 0 ? Math.round((status.current / status.total) * 100) : 0;

                // 时间格式化：>=1小时显示 hh:mm:ss，否则 mm:ss
                function fmtTime(sec) {
                    const t = Math.max(0, Math.floor(sec || 0));
                    const h = Math.floor(t / 3600);
                    const m = Math.floor((t % 3600) / 60);
                    const s = t % 60;
                    if (h > 0) {
                        return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                    }
                    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                }

                const bytesDone = status.bytes_done || 0;
                const bytesTotal = status.bytes_total || 0;
                const doneMB = (bytesDone / 1024 / 1024).toFixed(2);
                const totalMB = (bytesTotal / 1024 / 1024).toFixed(2);
                const remainingMB = Math.max(0, (bytesTotal - bytesDone) / 1024 / 1024);
                let etaText = '--:--';
                let etaSec = 0;
                if (status.speed_mbps && status.speed_mbps > 0) {
                    etaSec = Math.max(0, remainingMB / status.speed_mbps);
                    etaText = fmtTime(etaSec);
                }
                const elapsedSec = Math.floor(status.elapsed_sec || 0);
                const totalEstSec = Math.floor(elapsedSec + etaSec);
                const totalText = fmtTime(totalEstSec);
                document.getElementById('progressText').textContent =
                    `正在传输: ${status.current} / ${status.total}`;
                document.getElementById('progressPercent').textContent = percent + '%';
                document.getElementById('progressBar').style.width = percent + '%';
                // 当前文件
                document.getElementById('currentFile').textContent = '当前: ' + (status.current_file || '');
                // 实时显示速度（使用后端实时EMA速度），附带USB标签；>1000MB显示GB
                if (status.speed_mbps && status.speed_mbps > 0) {
                    const usbLabel = status.usb_info && status.usb_info.label ? status.usb_info.label : 'USB';
                    document.getElementById('speedInfo').textContent = `${usbLabel} · ${status.speed_mbps.toFixed(1)} MB/s`;
                } else {
                    document.getElementById('speedInfo').textContent = `速度: 计算中...`;
                }
                // 大小显示：超过1000MB按GB
                function fmtSizeMBGB(mb) {
                    if (mb >= 1000) return (mb/1024).toFixed(2) + ' GB';
                    return mb.toFixed(2) + ' MB';
                }
                document.getElementById('sizeInfo').textContent = `已传输: ${fmtSizeMBGB(bytesDone/1024/1024)} / ${fmtSizeMBGB(bytesTotal/1024/1024)}`;
                // 时间显示：带中文单位（小时/分钟/秒）
                function fmtTimeCN(sec) {
                    const t = Math.max(0, Math.floor(sec||0));
                    const h = Math.floor(t/3600);
                    const m = Math.floor((t%3600)/60);
                    const s = t % 60;
                    let parts = [];
                    if (h > 0) parts.push(`${h}小时`);
                    if (m > 0 || h > 0) parts.push(`${m}分钟`);
                    parts.push(`${s}秒`);
                    return parts.join('');
                }
                document.getElementById('etaInfo').textContent = `预计剩余: ${fmtTimeCN(etaSec)}`;
                document.getElementById('totalEstInfo').textContent = `总预计: ${fmtTimeCN(totalEstSec)}`;

                // 暂停/继续按钮联动
                const pauseBtn = document.getElementById('pauseBtn');
                const resumeLiveBtn = document.getElementById('resumeLiveBtn');
                if (status.is_running) {
                    if (status.paused) {
                        pauseBtn.style.display = 'none';
                        resumeLiveBtn.style.display = 'inline-block';
                    } else {
                        pauseBtn.style.display = 'inline-block';
                        resumeLiveBtn.style.display = 'none';
                    }
                    document.getElementById('stopBtn').style.display = 'inline-block';
                }

                if (!status.is_running && status.current > 0) {
                    clearInterval(progressInterval);
                    stopDeviceStatusPolling();
                    document.getElementById('progressText').textContent = '传输完成!';
                    document.getElementById('currentFile').textContent =
                        status.failed.length > 0 ?
                        `完成! ${status.failed.length} 个文件失败` :
                        '所有文件传输成功!';
                    document.getElementById('transferBtn').style.display = 'inline-block';
                    document.getElementById('stopBtn').style.display = 'none';
                    document.getElementById('scanBtn').disabled = false;
                    document.getElementById('pauseBtn').style.display = 'none';
                    document.getElementById('resumeLiveBtn').style.display = 'none';

                    if (status.failed.length > 0) {
                        console.error('失败的文件:', status.failed);
                        setTimeout(checkResumeProgress, 1000);
                    }
                }
            } catch (error) {
                console.error('更新进度失败:', error);
            }
        }

            detachPreviewScroll();

            document.getElementById('listViewBtn').classList.add('active');
            document.getElementById('albumViewBtn').classList.remove('active');
