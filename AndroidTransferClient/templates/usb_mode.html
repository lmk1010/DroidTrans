                            }
                        } catch (e) {
                            showToast('切换设备失败: ' + e.message, { type: 'error' });
                        }
                    });
                }

                const burstSw = document.getElementById('moreBurstSwitch');
                if (burstSw) {
                    burstSw.addEventListener('change', async () => {
                        const enabled = burstSw.checked;
                        try {
                            const resp = await fetch('/api/usb/burst_mode', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled }) });
                            const data = await resp.json();
                            if (data.success) {
                                try { const sw = document.getElementById('burstModeSwitch'); if (sw) sw.checked = enabled; } catch (e) {}
                                showToast(`ADB Burst模式已${enabled ? '启用' : '禁用'}`, { type: 'success' });
                            } else {
                                burstSw.checked = !enabled;
                                showToast('操作失败: ' + (data.error||'未知错误'), { type: 'error' });
                            }
                        } catch (e) {
                            burstSw.checked = !enabled;
                            showToast('操作失败: ' + e.message, { type: 'error' });
                        }
                    });
                }

                const moreHist = document.getElementById('moreHistoryBtn');
                const moreHistTile = document.getElementById('moreHistoryAction');
                const openHist = () => { openHistoryDialog2(); };
                if (moreHist) moreHist.addEventListener('click', openHist);
                if (moreHistTile) moreHistTile.addEventListener('click', (e)=>{ if (e.target && e.target.id === 'moreHistoryBtn') return; openHist(); });

                const clearBtn = document.getElementById('moreClearHistoryBtn');
                const clearTile = document.getElementById('moreClearHistoryAction');
                const openClear = () => { openClearHistoryDialog(); };
                if (clearBtn) clearBtn.addEventListener('click', openClear);
                if (clearTile) clearTile.addEventListener('click', (e)=>{ if (e.target && e.target.id === 'moreClearHistoryBtn') return; openClear(); });

                const btnRetest = document.getElementById('btnRetestUsb');
                if (btnRetest) {
                    btnRetest.addEventListener('click', async () => {
                        const lbl = document.getElementById('moreUsbLabel');
                        if (lbl) lbl.textContent = '测速中…';
                        try {
                            const r = await fetch('/api/usb/speed');
                            const j = await r.json();
                            const text = (j && j.success) ? ((j.label || 'USB 未知') + (j.measured_mbps>0?` · ${j.measured_mbps.toFixed(1)} MB/s`:'')) : 'USB 未知';
                            if (lbl) lbl.textContent = text;
                        } catch (e) {
                            if (lbl) lbl.textContent = 'USB 未知';
                        }
                    });
                }
            } catch (e) {
                console.error('打开更多配置失败:', e);
                showToast('打开更多配置失败: ' + e.message, { type: 'error' });
            }
        }

        // 历史备份记录（USB视图，增强版）
        async function openHistoryDialog2() {
            async function fetchHistory(q = '') {
                const url = q ? `/api/history/batches?current=1&q=${encodeURIComponent(q)}` : '/api/history/batches?current=1';
                const resp = await fetch(url);
                return await resp.json();
            }

            async function fetchDevices() {
                try {
                    const resp = await fetch('/api/history/devices');
                    const data = await resp.json();
                    if (data && data.success) return data.devices || [];
                } catch (e) { console.warn('加载设备列表失败', e); }
                return [];
            }

            function renderHistoryContent(list, deviceLabel, q, devices, mode) {
                const deviceInfo = deviceLabel ? `设备: ${deviceLabel}` : '设备: 全部';
                const deviceOptions = (devices || []).map(d => {
                    const label = (d.device_name && d.device_name.trim()) ? `${d.device_name} (${d.device_id})` : d.device_id;
                    return `<option value=\"${escapeHtml(d.device_id)}\" ${d.device_id === deviceLabel ? 'selected' : ''}>${escapeHtml(label)} · ${d.photos || 0}</option>`;
                }).join('');
                const rows = list.map((b, idx) => {
                    const sz = (typeof b.total_size_mb === 'number') ? (b.total_size_mb >= 1024 ? (b.total_size_mb/1024).toFixed(2) + ' GB' : b.total_size_mb.toFixed(2) + ' MB') : '';
                    const dur = Number.isFinite(b.duration_sec) && b.duration_sec > 0 ? b.duration_sec : 0;
                    function fmtTimeCN(sec) {
                        const t = Math.max(0, Math.floor(sec||0));
                        const h = Math.floor(t/3600);
                        const m = Math.floor((t%3600)/60);
                        const s = t % 60;
                        if (h > 0) return `${h}小时${m}分钟${s}秒`;
                        if (m > 0) return `${m}分钟${s}秒`;
                        return `${s}秒`;
                    }
                    return `
                        <tr>
                            <td class=\"history-col-idx\">${idx + 1}</td>
                            <td class=\"history-col-time\">${escapeHtml(b.timestamp || '')}</td>
                            <td class=\"history-col-batch\">${escapeHtml(b.batch_id || '')}</td>
                            <td class=\"history-col-device\">${escapeHtml(b.device_id || '')}</td>
                            <td class=\"history-col-devname\">${escapeHtml(b.device_name || '')}</td>
                            <td class=\"history-col-count\">${b.photo_count ?? ''}</td>
                            <td class=\"history-col-size\">${sz}</td>
                            <td class=\"history-col-size\">${dur ? fmtTimeCN(dur) : ''}</td>
                            <td class=\"history-col-size\"><button class=\"btn\" data-open-folder=\"${encodeURIComponent(b.base_path || '')}\">打开</button></td>
                        </tr>`;
                }).join('');
                const empty = list.length === 0 ? `<div class=\"history-empty\" style=\"padding:16px 0;color:#6b7280;\">暂无历史记录</div>` : '';
                return `
                    <div class=\"history-toolbar\">
                        <div class=\"segmented\">
                            <button id=\"segCur\" class=\"seg-btn ${mode==='current' ? 'active' : ''}\">当前设备</button>
                            <button id=\"segAll\" class=\"seg-btn ${mode==='all' ? 'active' : ''}\">全部设备</button>
                        </div>
                        <select id=\"historyDeviceSelect\" class=\"history-device-select\">
                            <option value=\"\">选择设备</option>
                            ${deviceOptions}
                        </select>
                        <input id=\"historySearchInput\" type=\"text\" placeholder=\"按时间/批次搜索，例如 2025-01 或 20250101\" value=\"${q ? escapeHtml(q) : ''}\">
                        <button id=\"historySearchBtn\">搜索</button>
                        <button id=\"historyClearBtn\" class=\"danger\" title=\"清空历史备份记录\">清空</button>
                    </div>
                    ${empty}
                    ${list.length ? `
                    <div class=\"history-table-wrap\">
                        <table class=\"history-table\">
                            <thead>
                                <tr>
                                    <th class=\"history-col-idx\">#</th>
                                    <th class=\"history-col-time\">时间</th>
                                    <th class=\"history-col-batch\">批次号</th>
                                    <th class=\"history-col-device\">设备ID</th>
                                    <th class=\"history-col-devname\">设备名称</th>
                                    <th class=\"history-col-count\">照片数量</th>
                                    <th class=\"history-col-size\">大小</th>
                                    <th class=\"history-col-size\">耗时</th>
                                    <th class=\"history-col-size\">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rows}
                            </tbody>
                        </table>
                    </div>` : ''}
                `;
            }

            try {
                const data = await fetchHistory('');
                const devs = await fetchDevices();
                if (!data.success) {
                    showToast('读取历史记录失败: ' + (data.error || '未知错误'), { type: 'error' });
                    return;
                }
                const list = data.batches || [];
                const device = data.device || '';
                // 状态：current 默认使用 /current=1; 若无device则进入 all 模式
                let state = { mode: device ? 'current' : 'all', device: device || '', q: '' };
                const html = renderHistoryContent(list, device, state.q, devs, state.mode);
                showDialogWithOptions({ title: '历史备份记录', html, actions: [{ label: '关闭', type: 'primary' }], dialogClass: 'dialog-lg' });

                async function reload() {
                    let url = '/api/history/batches';
                    const params = new URLSearchParams();
                    if (state.mode === 'current') {
                        params.set('current', '1');
                    } else if (state.mode === 'device' && state.device) {
                        params.set('device', state.device);
                    }
                    if (state.q) params.set('q', state.q);
                    const resp = await fetch(url + (params.toString() ? ('?' + params.toString()) : ''));
                    const r = await resp.json();
                    const list2 = (r && r.batches) || [];
                    const deviceLabel = (r && r.device) || state.device || '';
                    dialogContentElement.innerHTML = renderHistoryContent(list2, deviceLabel, state.q, devs, state.mode);
                    // 重新绑定事件
                    bindHandlers();
                }

                function bindHandlers() {
                    const input = document.getElementById('historySearchInput');
                    const btn = document.getElementById('historySearchBtn');
                    const segCur = document.getElementById('segCur');
                    const segAll = document.getElementById('segAll');
                    const sel = document.getElementById('historyDeviceSelect');
                    const clear = document.getElementById('historyClearBtn');
                    // 打开文件夹
                    document.querySelectorAll('button[data-open-folder]').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            const p = decodeURIComponent(e.currentTarget.getAttribute('data-open-folder')||'');
                            if (!p) return;
                            try {
                                const r = await fetch('/api/wifi/open_folder', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ folder_path: p }) });
                                const d = await r.json();
                                if (!d.success) showToast('打开失败: ' + (d.error||'未知错误'), { type: 'error' });
                            } catch (err) {
                                showToast('打开失败: ' + err.message, { type: 'error' });
                            }
                        });
                    });
                    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { state.q = (input.value || '').trim(); reload(); } });
                    btn.addEventListener('click', () => { state.q = (input.value || '').trim(); reload(); });
                    segCur.addEventListener('click', () => { state.mode = 'current'; state.device = ''; reload(); });
                    segAll.addEventListener('click', () => { state.mode = 'all'; state.device = ''; reload(); });
                    sel.addEventListener('change', () => { const v = sel.value; if (v) { state.mode = 'device'; state.device = v; } else { state.mode = 'all'; state.device = ''; } reload(); });
                    if (clear) clear.addEventListener('click', () => openClearHistoryDialog());
                }
                bindHandlers();
            } catch (e) {
                console.error('加载历史备份失败:', e);
                showToast('加载历史备份失败: ' + e.message, { type: 'error' });
            }
        }

        async function openClearHistoryDialog() {
            const html = `
                <div style="padding: 8px 0; color:#374151;">此操作将清空应用内的历史备份记录（数据库）。</div>
                <label style="display:flex;align-items:center;gap:8px;margin-top:8px;">
                    <input type="checkbox" id="chkDeleteFiles">
                    <span>同时删除本地备份文件（${escapeHtml((defaultOutputPath||'').toString()) || '输出目录'}）</span>
                </label>
                <div style="margin-top:8px; color:#b91c1c;">注意：删除备份文件不可恢复，请谨慎操作。</div>
            `;
            showDialogWithOptions({
                title: '清空历史备份记录',
                html,
                actions: [
                    { label: '取消' },
                    { label: '清空', type: 'danger', onClick: async () => {
                        try {
                            const del = document.getElementById('chkDeleteFiles')?.checked === true;
                            const resp = await fetch('/api/history/clear', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ delete_files: del })
                            });
                            const data = await resp.json();
                            if (data && data.success) {
                                const extra = (typeof data.deleted_files === 'number') ? `（已删除 ${data.deleted_files} 项文件/目录）` : '';
                                showToast('已清空历史备份记录' + (del ? extra : ''), { type: 'success' });
                            } else {
                                showToast('清空失败: ' + (data.error || '未知错误'), { type: 'error' });
                            }
                        } catch (e) {
                            showToast('清空失败: ' + e.message, { type: 'error' });
                        }
                    }}
                ]
            });
        }

        // 历史备份记录（USB视图）
        async function openHistoryDialog() {
            try {
                const resp = await fetch('/api/history/batches?current=1');
                const data = await resp.json();
                if (!data.success) {
                    showToast('读取历史记录失败: ' + (data.error || '未知错误'), { type: 'error' });
                    return;
                }
                const list = data.batches || [];
                if (!list.length) {
                    showDialog({ title: '历史备份记录', message: '暂无历史记录' });
                    return;
                }
                const lines = list.map((b, idx) => {
                    const miss = (typeof b.missing_count === 'number' && b.missing_count > 0) ? ` | 缺失: ${b.missing_count}` : '';
                    const exist = (typeof b.exists_count === 'number') ? ` | 本地存在: ${b.exists_count}` : '';
                    return `${idx+1}. 设备: ${b.device_id} | 批次: ${b.batch_id} | 时间: ${b.timestamp} | 记录: ${b.photo_count} 张${exist}${miss}\n路径: ${b.base_path}`;
                });
                try { console.log('[History] batches', list); } catch (e) {}
                showDialog({
                    title: '历史备份记录',
                    message: lines,
                    actions: [
                        { label: '关闭', type: 'primary' }
                    ]
                });
            } catch (e) {
                console.error('加载历史备份失败:', e);
                showToast('加载历史备份失败: ' + e.message, { type: 'error' });
            }
        }
    </script>
</body>
</html>
