<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USB模式 - Android照片传输工具</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg width='48' height='48' viewBox='0 0 1024 1024' xmlns='http://www.w3.org/2000/svg'><path d='M0 0m512 0l0 0q512 0 512 512l0 0q0 512-512 512l0 0q-512 0-512-512l0 0q0-512 512-512Z' fill='%234992FF'/><path d='M260.654545 620.897745a37.236364 37.236364 0 1 1-74.472727-1.340509l3.165091-175.476363a186.181818 186.181818 0 0 1 186.144582-182.830546H679.005091a37.236364 37.236364 0 1 1 0 74.472728H375.491491a111.709091 111.709091 0 0 0-111.709091 109.698327L260.654545 620.897745z' fill='%23FFFFFF'/><path d='M697.455709 257.805964a27.927273 27.927273 0 1 1-33.214836 44.907054l-122.842764-90.875345a27.927273 27.927273 0 0 1 33.214836-44.907055l122.842764 90.875346z' fill='%23FFFFFF'/><path d='M675.579345 277.355055a27.927273 27.927273 0 1 1 35.355928 43.250036l-142.391855 116.363636a27.927273 27.927273 0 0 1-35.337309-43.250036l142.373236-116.363636z' fill='%23FFFFFF'/><path d='M800.581818 403.102255a37.236364 37.236364 0 1 1 74.472727 1.340509l-3.16509 175.476363a186.181818 186.181818 0 0 1-186.144582 182.830546H382.231273a37.236364 37.236364 0 1 1 0-74.472728h303.532218a111.709091 111.709091 0 0 0 111.709091-109.698327L800.581818 403.102255z' fill='%23FFFFFF'/><path d='M363.780655 766.194036a27.927273 27.927273 0 1 1 33.214836-44.907054l122.842764 90.875345a27.927273 27.927273 0 0 1-33.214837 44.907055l-122.842763-90.875346z' fill='%23FFFFFF'/><path d='M385.657018 746.644945a27.927273 27.927273 0 1 1-35.355927-43.250036l142.391854-116.363636a27.927273 27.927273 0 0 1 35.33731 43.250036l-142.373237 116.363636z' fill='%23FFFFFF'/></svg>">
    <!-- 移除外网字体以避免阻塞；使用系统字体栈与等宽字体回退 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            padding: 32px 24px;
        }

        .container {
            max-width: 1140px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 2px 6px 2px rgba(60,64,67,0.15);
            overflow: hidden;
        }

        .mode-header {
            background: #f8f9fa;
            padding: 20px 32px;
            border-bottom: 1px solid #e8eaed;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mode-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0;
        }

        .mode-badge.adb {
            background: #4285f4;
            color: white;
        }

        .header {
            background: white;
            padding: 32px 40px;
            border-bottom: 1px solid #e8eaed;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-logo {
            flex-shrink: 0;
        }

        .header-logo svg {
            display: block;
        }

        .header-content {
            flex: 1;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #202124;
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        .header p {
            color: #5f6368;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0;
        }

        .controls {
            padding: 20px 32px;
            background: white;
            border-bottom: 1px solid #e8eaed;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* Status bar: keep single line by default; allow horizontal scroll on narrow widths */
        .controls .status {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
            overflow: hidden;
            white-space: nowrap;
            max-width: 100%;
        }
        .controls .status > * { flex: 0 0 auto; }
        .controls .status .status-badge { white-space: nowrap; }
        .controls .status #historyBtn { white-space: nowrap; }
        .controls .status #deviceStatus { white-space: nowrap; }
        .controls .status #usbSpeedBadge { white-space: nowrap; max-width: 60vw; overflow: hidden; text-overflow: ellipsis; }
        .controls .status #deviceSelect { max-width: 50vw; }

        /* 小屏：隐藏细节，仅显示“更多配置”按钮，不再横滑 */
        @media (max-width: 768px) {
            .controls .status #usbSpeedBadge,
            .controls .status #deviceStatus,
            .controls .status #historyBtn,
            .controls .status #burstModeToggle,
            .controls .status #deviceSelect {
                display: none !important;
            }
            .controls .status #moreBtn { display: inline-block !important; }
        }

        .btn {
            padding: 0 24px;
            height: 40px;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.25px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: none;
            font-family: 'Roboto', sans-serif;
        }

        .btn:disabled {
            background: #f1f3f4 !important;
            color: #80868b !important;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-primary {
            background: #4285f4;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #1a73e8;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        .btn-primary:active:not(:disabled) {
            background: #1765cc;
        }

        .btn-success {
            background: #34a853;
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #2d9648;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        .btn-success:active:not(:disabled) {
            background: #24813b;
        }

        .btn-danger {
            background: #ea4335;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: #d33b2c;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        .btn-danger:active:not(:disabled) {
            background: #b93221;
        }

        .btn-tonal {
            background: rgba(26, 115, 232, 0.1);
            color: #1a73e8;
        }

        .btn-tonal:hover:not(:disabled) {
            background: rgba(26, 115, 232, 0.16);
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        .btn-tonal:active:not(:disabled) {
            background: rgba(26, 115, 232, 0.22);
        }

        .status {
            flex: 1;
            text-align: right;
            font-size: 14px;
            color: #666;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0;
        }

        .status-speed {
            background: #e8f0fe;
            color: #1a73e8;
            margin-right: 8px;
        }

        .status-connected {
            background: #e6f4ea;
            color: #137333;
        }

        .status-disconnected {
            background: #fce8e6;
            color: #c5221f;
        }

        .progress-container {
            padding: 16px 24px;
            background: #fff8e1;
            border-bottom: 1px solid rgba(0,0,0,0.12);
            display: none;
        }

        .progress-container.active {
            display: block;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: rgba(0,0,0,0.87);
            font-weight: 500;
            letter-spacing: 0.25px;
        }

        .progress-bar-container {
            background: rgba(0,0,0,0.12);
            border-radius: 2px;
            height: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar {
            background: #4285f4;
            height: 100%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 4px;
        }
        /* 不确定进度动画 */
        .progress-bar.indeterminate { width: 30%; animation: indeterminate 1.2s infinite ease-out; }
        @keyframes indeterminate { 0% { transform: translateX(-120%);} 100% { transform: translateX(400%);} }

        .current-file {
            font-size: 12px;
            color: rgba(0,0,0,0.6);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: 0.4px;
        }

        .content {
            position: relative;
            padding: 32px;
        }

        .transfer-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(3px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: all;
        }

        .transfer-overlay.active {
            display: flex;
        }

        .transfer-overlay .overlay-card {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 16px;
            padding: 24px 32px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.12);
            text-align: center;
            color: #202124;
            min-width: 260px;
            max-width: 360px;
        }

        .transfer-overlay .overlay-card .overlay-text {
            font-size: 16px;
            letter-spacing: 0.2px;
            line-height: 1.6;
        }

        .transfer-overlay .overlay-card .spinner {
            margin: 0 auto 16px auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            border: 1px solid #e8eaed;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        .stat-card:hover {
            background: #f8f9fa;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            transform: translateY(-1px);
        }

        .stat-card h3 {
            font-size: 10px;
            color: #5f6368;
            margin-bottom: 4px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .stat-card p {
            font-size: 18px;
            font-weight: 600;
            color: #1a73e8;
            font-family: 'Roboto Mono', monospace;
            line-height: 1;
        }

        /* 四列统计卡片布局 */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }
        }

        .filter-bar {
            margin-bottom: 20px;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .filter-bar input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #dadce0;
            border-radius: 24px;
            background: white;
            font-size: 14px;
            font-family: 'Roboto', sans-serif;
            letter-spacing: 0;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-bar input:hover {
            border-color: #b0b3b8;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
        }

        .filter-bar input:focus {
            outline: none;
            border: 2px solid #4285f4;
            padding: 11px 15px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
        }

        .filter-bar select {
            padding: 10px 16px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Roboto', sans-serif;
            background: white;
            cursor: pointer;
            letter-spacing: 0;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-bar select:hover {
            border-color: #b0b3b8;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
        }

        .photo-list {
            height: calc(100vh - 260px);
            overflow-y: auto;
            border: 1px solid #e8eaed;
            border-radius: 12px;
            padding: 12px; /* 避免顶部被遮挡，卡片圆角完整显示 */
            background: #fff;
        }

        .photo-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #e8eaed;
            transition: background 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .photo-item:hover {
            background: #f8f9fa;
        }

        .photo-item:last-child {
            border-bottom: none;
        }

        .photo-checkbox {
            margin-right: 16px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #4285f4;
        }

        .photo-info {
            flex: 1;
        }

        .photo-name {
            font-weight: 500;
            margin-bottom: 4px;
            color: #202124;
            font-size: 14px;
            letter-spacing: 0;
        }

        .photo-details {
            font-size: 13px;
            color: #5f6368;
            letter-spacing: 0;
        }

        .photo-path {
            font-size: 12px;
            color: #80868b;
            margin-top: 4px;
            font-family: 'Roboto Mono', 'Courier New', monospace;
            letter-spacing: 0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            border: 3px solid #e8eaed;
            border-top: 3px solid #4285f4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .select-all-container {
            padding: 16px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e8eaed;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .select-all-container label {
            font-weight: 500;
            cursor: pointer;
            color: #202124;
            font-size: 14px;
            letter-spacing: 0;
        }

        code {
            background: #f1f3f4;
            padding: 3px 8px;
            border-radius: 6px;
            font-family: 'Roboto Mono', 'Courier New', monospace;
            font-size: 13px;
            color: #1a73e8;
            letter-spacing: 0;
        }

        /* Material Design Snackbar/Toast */
        .snackbar {
            visibility: hidden;
            min-width: 288px;
            max-width: 420px;
            background-color: #323232;
            color: #fff;
            text-align: left;
            border-radius: 6px;
            padding: 12px 14px;
            position: fixed;
            z-index: 10000;
            top: 16px;
            right: 16px;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.25px;
            line-height: 20px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.18);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .snackbar.show {
            visibility: visible;
            animation: snackbar-fadein 0.15s cubic-bezier(0, 0, 0.2, 1), snackbar-fadeout 0.15s cubic-bezier(0.4, 0, 1, 1) 2.85s;
        }

        .snackbar.error {
            background-color: #d32f2f;
        }

        .snackbar.success {
            background-color: #2e7d32;
        }

        .snackbar.warning {
            background-color: #f57c00;
        }

        .snackbar.info {
            background-color: #1976d2;
        }

        .snackbar-message {
            flex: 1;
        }

        @keyframes snackbar-fadein {
            from { transform: translateY(-10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes snackbar-fadeout {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(-10px); opacity: 0; }
        }

        /* Material Design Dialog */
        .dialog-overlay {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.32);
            animation: dialog-overlay-fadein 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dialog-overlay.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes dialog-overlay-fadein {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .dialog {
            background: white;
            border-radius: 4px;
            box-shadow: 0 11px 15px -7px rgba(0,0,0,0.2), 0 24px 38px 3px rgba(0,0,0,0.14), 0 9px 46px 8px rgba(0,0,0,0.12);
            min-width: 280px;
            max-width: 560px;
            max-height: calc(100% - 96px);
            overflow: hidden;
            animation: dialog-scale-in 0.2s cubic-bezier(0, 0, 0.2, 1);
        }

        /* Large dialog variant for history view */
        .dialog.dialog-lg {
            max-width: 1320px;
            width: min(98vw, 1320px);
        }
        .dialog.dialog-lg .dialog-content {
            max-height: 80vh;
        }

        @keyframes dialog-scale-in {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .dialog-title {
            padding: 24px 24px 20px;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 0.15px;
            line-height: 24px;
            color: rgba(0, 0, 0, 0.87);
        }

        .dialog-content {
            padding: 0 24px 24px;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.5px;
            line-height: 24px;
            color: rgba(0, 0, 0, 0.6);
            overflow-y: auto;
            max-height: 400px;
        }

        .dialog-content p {
            margin: 0 0 16px 0;
        }

        .dialog-content p:last-child {
            margin-bottom: 0;
        }

        /* History table (MD-like) */
        .history-toolbar { display: flex; align-items: center; gap: 12px; padding: 0 0 12px 0; flex-wrap: wrap; }
        .history-toolbar .hint { color: #6b7280; font-size: 13px; }
        .history-toolbar input[type="text"] { flex: 1; min-width: 220px; height: 32px; padding: 0 10px; border: 1px solid #dadce0; border-radius: 6px; font-size: 13px; }
        .history-toolbar button { height: 32px; padding: 0 12px; border: 1px solid #dadce0; background: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .history-toolbar button:hover { background: #f8f9fb; }
        .history-device-select { height: 32px; border:1px solid #dadce0; border-radius:6px; padding: 0 8px; font-size:13px; min-width: 220px; }
        .segmented { display: inline-flex; border:1px solid #dadce0; border-radius: 8px; overflow:hidden; }
        .segmented .seg-btn { height: 32px; padding: 0 12px; border:0; border-right:1px solid #dadce0; background:#fff; cursor:pointer; font-size:13px; }
        .segmented .seg-btn:last-child { border-right:0; }
        .segmented .seg-btn.active { background:#e8f0fe; color:#1967d2; font-weight:600; }
        .history-table-wrap { width: 100%; overflow: auto; border: 1px solid #e5e7eb; border-radius: 8px; }
        .history-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .history-table th, .history-table td { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; text-align: left; font-size: 13px; color: #374151; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 20px; }
        .history-table th { background: #f6f8fa; color: #111827; font-weight: 600; position: sticky; top: 0; z-index: 1; }
        .history-table tr:hover td { background: #fafafa; }
        .history-col-idx { width: 44px; color: #6b7280; }
        .history-col-time { width: 180px; }
        .history-col-device { width: 200px; }
        .history-col-devname { width: 160px; }
        .history-col-count { width: 100px; }
        .history-col-batch { width: 160px; }
        .history-col-size { width: 120px; }
        /* 在大弹窗中强制展示所有列，且不换行 */
        .dialog.dialog-lg .history-table .history-col-device,
        .dialog.dialog-lg .history-table .history-col-devname,
        .dialog.dialog-lg .history-table .history-col-idx,
        .dialog.dialog-lg .history-table .history-col-time,
        .dialog.dialog-lg .history-table .history-col-batch,
        .dialog.dialog-lg .history-table .history-col-count,
        .dialog.dialog-lg .history-table .history-col-size {
            display: table-cell !important;
            white-space: nowrap;
        }
        /* 避免横向滚动条，若列内容过长以省略号显示 */
        .history-table-wrap { width: 100%; overflow-x: hidden; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 8px; }
        .history-toolbar button.danger { border-color: #ef4444; color: #b91c1c; }
        .history-toolbar button.danger:hover { background: #fee2e2; }

        /* Responsive adjustments */
        @media (max-width: 1024px) {
            .history-col-time { width: 160px; }

    <script src="{{ url_for('static', filename='usb_mode.js') if config.get('USE_SEPARATE_JS') else '' }}"></script>
    <script>
        // USB Mode JavaScript
        // Polyfill CSS.escape if missing (older Safari)
        try {
            if (typeof CSS === 'undefined' || typeof CSS.escape !== 'function') {
                window.CSS = window.CSS || {};
                window.CSS.escape = function(value) {
                    return String(value).replace(/[^a-zA-Z0-9_\-\u00A0-\uFFFF]/g, function(ch) {
                        const hex = ch.charCodeAt(0).toString(16).toUpperCase();
                        return '\\' + hex + ' ';
                    });
                };
            }
        } catch (e) { /* no-op */ }
        // 全局缩略图内存缓存（LRU，最多保留 10000 张，避免滚动后重复加载）
        const THUMB_CACHE_LIMIT = 10000;
        const thumbCache = new Map(); // key: photo.path, value: { url: blobUrl, ts: number, size: number }
        const THUMB_GRID_SIZE = 128; // 网格缩略图目标尺寸（更快）
        const COVER_THUMB_SIZE = 128; // 封面缩略图尺寸（极致快）

        // 本地持久化键
        const LS_ALBUMS_CACHE = 'usb_cache_albums_v1';
        const LS_SELECTED_ALBUMS = 'usb_state_selected_albums_all_v1';
        const LS_EXCLUDED_BY_ALBUM = 'usb_state_excluded_by_album_v1';
        const LS_SELECTED_PHOTOS = 'usb_state_selected_photos_v1';
        const LS_LAST_ALBUM_KEY = 'at_last_album_key';
        const LS_LAST_VIEW = 'usb_last_view_mode';

        function saveAlbumsCache() {
            try {
                // 仅缓存相册信息（不触发传输UI状态）
                const slim = {};
                Object.entries(allAlbums || {}).forEach(([k, v]) => {
                    slim[k] = {
                        name: v.name,
                        icon: v.icon,
                        priority: v.priority,
                        total_count: v.total_count || 0,
                        total_size: v.total_size || 0,
                        cover: v.cover || ((Array.isArray(v.photos) && v.photos[0]) ? v.photos[0].path : ''),
                    };
                });
                const payload = { ts: Date.now(), albums: slim };
                localStorage.setItem(LS_ALBUMS_CACHE, JSON.stringify(payload));
            } catch (e) { /* ignore */ }
        }

        function saveSelections() {
            try {
                localStorage.setItem(LS_SELECTED_ALBUMS, JSON.stringify(Array.from(selectedAlbumsAll || new Set())));
                const ex = {};
                for (const [k, v] of (excludedByAlbum || new Map()).entries()) {
                    ex[k] = Array.from(v || new Set());
                }
                localStorage.setItem(LS_EXCLUDED_BY_ALBUM, JSON.stringify(ex));
                if (selectedPhotos && selectedPhotos.size > 0) {
                    const cap = 5000;
                    const arr = [];
                    let i = 0;
                    for (const p of selectedPhotos) { arr.push(p); if (++i >= cap) break; }
                    localStorage.setItem(LS_SELECTED_PHOTOS, JSON.stringify(arr));
                } else {
                    localStorage.removeItem(LS_SELECTED_PHOTOS);
                }
            } catch (e) { /* ignore */ }
        }

        function clearAlbumsCache() {
            try {
                localStorage.removeItem(LS_ALBUMS_CACHE);
                localStorage.removeItem(LS_SELECTED_ALBUMS);
                localStorage.removeItem(LS_EXCLUDED_BY_ALBUM);
            } catch (e) { /* ignore */ }
        }

        function restoreFromLocal() {
            try {
                const raw = localStorage.getItem(LS_ALBUMS_CACHE);
                if (raw) {
                    // 存在历史相册缓存，但默认不自动加载，等待用户点击“开始扫描”
                    // const payload = JSON.parse(raw);
                    // 可在此设置标记，如需要：window.__hasCachedAlbums = true;
                }
            } catch (e) { /* ignore */ }
            try {
                const sa = localStorage.getItem(LS_SELECTED_ALBUMS);
                if (sa) selectedAlbumsAll = new Set(JSON.parse(sa));
            } catch (e) { /* ignore */ }
            try {
                const ex = localStorage.getItem(LS_EXCLUDED_BY_ALBUM);
                if (ex) {
                    const obj = JSON.parse(ex) || {};
                    const mp = new Map();
                    Object.entries(obj).forEach(([k, arr]) => { mp.set(k, new Set(arr || [])); });
                    excludedByAlbum = mp;
                }
            } catch (e) { /* ignore */ }
            try {
                const sp = localStorage.getItem(LS_SELECTED_PHOTOS);
                if (sp) selectedPhotos = new Set(JSON.parse(sp));
            } catch (e) { /* ignore */ }
        }

        function renderScanHero() {
            try {
                const photoList = document.getElementById('photoList');
                if (!photoList) return;
                const hasAlbums = (window.__hasAlbums === true) || (Object.keys(allAlbums || {}).length > 0);
                // 显示条件：已连接、未在扫描中、且无相册内容
                const shouldShow = window.__lastDeviceConnected === true && !scanStatusInterval && !window.__scanStarting && !hasAlbums && !window.__albumViewActive;
                if (!shouldShow) return;
                const html = `
                    <div style="min-height: 420px; display:flex; align-items:center; justify-content:center;">
                        <div style="text-align:center;">
                            <h3 style="margin:0 0 10px; color:#111827; font-size:18px;">准备好传输照片与视频</h3>
                            <p style="margin:0 0 16px; color:#4b5563;">点击下方按钮开始扫描手机中的相册与视频文件。扫描只在你需要时执行。</p>
                            <button class="btn-hero" onclick="scanPhotos()" id="heroScanBtn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1=\"12\" y1=\"15\" x2=\"12\" y2=\"3\"/></svg>
                                开始扫描相册与视频
                            </button>
                        </div>
                    </div>`;
                photoList.innerHTML = html;
            } catch (e) { /* ignore */ }
        }

        function thumbCacheGet(key) {
            const v = thumbCache.get(key);
            if (!v) return null;
            v.ts = Date.now();
            return v;
        }

        function thumbCachePut(key, blob) {
            try {
                const url = URL.createObjectURL(blob);
                const entry = { url, ts: Date.now(), size: blob.size || 0 };
                thumbCache.set(key, entry);
                if (thumbCache.size > THUMB_CACHE_LIMIT) {
                    const arr = Array.from(thumbCache.entries());
                    arr.sort((a, b) => a[1].ts - b[1].ts); // 最久未用优先淘汰
                    const evictCount = thumbCache.size - THUMB_CACHE_LIMIT;
                    for (let i = 0; i < evictCount; i++) {
                        const [ek, ev] = arr[i];
                        try { URL.revokeObjectURL(ev.url); } catch (e) {}
                        thumbCache.delete(ek);
                    }
                    console.log(`[ThumbCache] Evicted ${evictCount}, now ${thumbCache.size}`);
                }
                console.log(`[ThumbCache] Cached ${key} (${(entry.size/1024).toFixed(1)} KB)`);
                return entry;
            } catch (e) {
                console.warn('[ThumbCache] Put failed:', e);
                return null;
            }
        }

        async function loadThumbInto(imgEl, path) {
            if (!imgEl || !path) return;
            const hit = thumbCacheGet(path);
            if (hit) {
                const done0 = () => { imgEl.classList.add('loaded'); const sk = imgEl.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); };
                imgEl.onload = done0;
                imgEl.onerror = () => { const sk = imgEl.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); imgEl.parentElement?.insertAdjacentHTML('beforeend', '<div class="thumb-video-badge">预览失败</div>'); };
                imgEl.src = hit.url;
                if (imgEl.complete && imgEl.naturalWidth > 0) done0();
                return;
            }
            try {
                // 不使用 no-cache，避免频繁 304；如返回304，改为直接img.src触发浏览器缓存
                    const resp = await fetch(`/api/thumb?path=${encodeURIComponent(path)}&size=${THUMB_GRID_SIZE}`);
                if (!resp.ok) {
                    if (resp.status === 304) {
                        const done1 = () => { imgEl.classList.add('loaded'); const sk = imgEl.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); };
                        imgEl.onload = done1;
                        imgEl.src = `/api/thumb?path=${encodeURIComponent(path)}&size=${THUMB_GRID_SIZE}`;
                        if (imgEl.complete && imgEl.naturalWidth > 0) done1();
                        return;
                    }
                    throw new Error(`HTTP ${resp.status}`);
                }
                const blob = await resp.blob();
                const entry = thumbCachePut(path, blob);
                const done = () => { imgEl.classList.add('loaded'); const sk = imgEl.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); };
                imgEl.onload = done;
                imgEl.onerror = () => { const sk = imgEl.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); imgEl.parentElement?.insertAdjacentHTML('beforeend', '<div class="thumb-video-badge">预览失败</div>'); };
                imgEl.src = entry ? entry.url : URL.createObjectURL(blob);
                imgEl.removeAttribute('data-ph');
                if (imgEl.complete && imgEl.naturalWidth > 0) done();
            } catch (e) {
                // 兜底：仍尝试直接指向原URL，让浏览器利用缓存
                try {
                    const done2 = () => { imgEl.classList.add('loaded'); const sk = imgEl.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); };
                    imgEl.onload = done2;
                    imgEl.onerror = () => { const sk = imgEl.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); imgEl.parentElement?.insertAdjacentHTML('beforeend', '<div class="thumb-video-badge">预览失败</div>'); };
                    imgEl.src = `/api/thumb?path=${encodeURIComponent(path)}&size=${THUMB_GRID_SIZE}`;
                    imgEl.removeAttribute('data-ph');
                    if (imgEl.complete && imgEl.naturalWidth > 0) done2();
                } catch (err) {
                    const sk = imgEl.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove();
                    imgEl.parentElement?.insertAdjacentHTML('beforeend', '<div class="thumb-video-badge">预览失败</div>');
                    console.error('[ThumbCache] Load failed:', path, e);
                }
            }
        }
        let allPhotos = [];
        let filteredPhotos = [];
        let selectedPhotos = new Set();
        // 相册级快速选择（即时显示数量）
        let selectedAlbumsAll = new Set();
        let excludedByAlbum = new Map(); // albumKey -> Set(paths)
        // 设备与扫描状态标记
        try { window.__lastDeviceConnected = false; } catch (e) {}
        try { window.__scanStarting = false; } catch (e) {}
        let scanStatusInterval = null;
        let deviceStatusInterval = null;
        let progressInterval = null;
        // 全局缩略图轮询控制（避免重复定时器/超大请求）
        let thumbPollTimer = null;
        let thumbPollRunning = false;
        const globalPendingThumbs = new Set(); // 待检测缩略图路径
        const MAX_STATUS_BATCH = 1000; // 增加到1000，处理更多缩略图
        const MAX_THUMB_RETRY = 120;  // 单个缩略图最大重试次数（~60s, 500ms间隔）
        const PROBE_FETCH_LIMIT = 200; // 增加到200，提升可见区加载速度
        let batchFetchTimer = null;
        function scheduleBatchFetch() {
            if (batchFetchTimer) return;
            batchFetchTimer = setTimeout(() => {
                batchFetchTimer = null;
                try { batchFetchVisibleThumbs(128); } catch (e) {}  // 增加到128
            }, 60);
        }

        async function batchFetchVisibleThumbs(limit = 128) {  // 从48增加到128
            const list = document.getElementById('photoList');
            const grid = document.getElementById('thumbGrid');
            if (!list || !grid) return;
            const imgs = grid.querySelectorAll('img.thumb-img');
            const viewTop = list.scrollTop - 400;  // 扩大预加载范围
            const viewBot = list.scrollTop + list.clientHeight + 1200;  // 扩大预加载范围
            const req = [];
            for (let i=0;i<imgs.length && req.length<limit;i++) {
                const img = imgs[i];
                if (!img || img.getAttribute('data-loaded') === '1' || img.src) continue;
                const tile = img.closest('.thumb-item');
                if (!tile) continue;
                const top = tile.offsetTop;
                const bottom = top + tile.offsetHeight;
                if (bottom >= viewTop && top <= viewBot) {
                    const p = img.getAttribute('data-path');
                    if (p) req.push(p);
                }
            }
            if (!req.length) return;
            try {
                const resp = await fetch('/api/thumb_batch_fetch', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ paths: req, size: THUMB_GRID_SIZE, limit: limit })
                });
                const data = await resp.json();
                if (data && data.success && Array.isArray(data.items)) {
                    data.items.forEach(it => {
                        if (!it || !it.path || !it.b64) return;
                        const img = grid.querySelector(`img.thumb-img[data-path="${CSS.escape(it.path)}"]`);
                        if (!img || img.getAttribute('data-loaded')==='1') return;
                        const done = () => { img.classList.add('loaded'); const sk = img.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); };
                        img.onload = done;
                        img.onerror = () => { const sk = img.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); img.parentElement?.insertAdjacentHTML('beforeend', '<div class="thumb-video-badge">预览失败</div>'); };
                        img.src = 'data:image/jpeg;base64,' + it.b64;
                        img.setAttribute('data-loaded','1');
                        if (img.complete && img.naturalWidth > 0) done();
                    });
                }
            } catch (e) { /* ignore */ }
        }

        async function batchFetchPaths(paths, per = 128) {
            try {
                const grid = document.getElementById('thumbGrid');
                if (!grid || !paths || !paths.length) return;
                for (let i = 0; i < paths.length; i += per) {
                    const chunk = paths.slice(i, i + per);
                    try {
                        const resp = await fetch('/api/thumb_batch_fetch', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ paths: chunk, size: THUMB_GRID_SIZE, limit: chunk.length })
                        });
                        const data = await resp.json();
                        if (data && data.success && Array.isArray(data.items)) {
                            data.items.forEach(it => {
                                if (!it || !it.path || !it.b64) return;
                                const img = grid.querySelector(`img.thumb-img[data-path="${CSS.escape(it.path)}"]`);
                                if (!img || img.getAttribute('data-loaded')==='1') return;
                                const done = () => { img.classList.add('loaded'); const sk = img.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); };
                                img.onload = done;
                                img.onerror = () => { const sk = img.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); img.parentElement?.insertAdjacentHTML('beforeend', '<div class="thumb-video-badge">预览失败</div>'); };
                                img.src = 'data:image/jpeg;base64,' + it.b64;
                                img.setAttribute('data-loaded','1');
                                if (img.complete && img.naturalWidth > 0) done();
                            });
                        }
                    } catch (e) { /* ignore chunk errors */ }
                }
            } catch (e) { /* ignore */ }
        }
        const thumbRetryCount = new Map();
        // 相册首屏预取（进入前提前准备照片清单与部分缩略图）
        const albumPrefetching = new Set();
        async function prefetchAlbumPhotos(albumKey, limit = 1000) {  // 增加到1000张
            try {
                if (!albumKey) return;
                const a = allAlbums[albumKey];
                if (!a) return;
                if (Array.isArray(a.photos) && a.photos.length) return; // 已有
                if (albumPrefetching.has(albumKey)) return;
                albumPrefetching.add(albumKey);
                const resp = await fetch(`/api/album_photos?album=${encodeURIComponent(albumKey)}&offset=0&limit=${limit}`);
                const data = await resp.json().catch(()=>({success:false}));
                if (data && data.success) {
                    allAlbums[albumKey].photos = data.photos || [];
                    // 预热前120张缩略图，提升点击后首屏和前几屏速度
                    const pre = (allAlbums[albumKey].photos || []).slice(0, 120).map(p=>p.path);
                    if (pre.length) {
                        pre.forEach(p => globalPendingThumbs.add(p));
                        try { fetch('/api/thumb_batch_generate', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ paths: pre, batch_size: 100 }) }); } catch (e) {}
                        thumbPollLoop();
                    }
                }
            } catch (e) {
            } finally {
                albumPrefetching.delete(albumKey);
            }
        }
        // 可见区域优先：IntersectionObserver 懒加载
        let thumbIO = null;
        function ensureThumbIO() {
            if (thumbIO) return thumbIO;
            try {
                thumbIO = new IntersectionObserver((entries) => {
                    for (const entry of entries) {
                        if (!entry.isIntersecting) continue;
                        const img = entry.target;
                        try { thumbIO.unobserve(img); } catch (e) {}
                        const p = img.getAttribute('data-path');
                        if (!p) continue;
                        // 直接尝试加载，突破仅靠后台轮询的滞后
                        loadThumbInto(img, p);
                    }
                }, { root: document.getElementById('photoList'), rootMargin: '1200px 0px 1200px 0px', threshold: 0.01 });
            } catch (e) {
                thumbIO = null;
            }
            return thumbIO;
        }
        function disconnectThumbIO() { try { if (thumbIO) { thumbIO.disconnect(); } } catch (e) {} finally { thumbIO = null; } }

        function stopThumbPolling() {
            if (thumbPollTimer) {
                clearTimeout(thumbPollTimer);
                thumbPollTimer = null;
            }
            thumbPollRunning = false;
        }

        async function thumbPollLoop() {
            // 单例轮询：避免多个并发轮询造成压力
            if (thumbPollRunning) return;
            thumbPollRunning = true;

            const doOne = async () => {
                try {
                    if (globalPendingThumbs.size === 0) {
                        thumbPollRunning = false; // 无任务则停止
                        return;
                    }
                    // 取一批进行轮询：优先处理最新加入的（靠近当前视口更可能是新加入）
                    const arr = Array.from(globalPendingThumbs);
                    const batch = arr.length > MAX_STATUS_BATCH ? arr.slice(-MAX_STATUS_BATCH) : arr;
                    if (batch.length === 0) {
                        thumbPollRunning = false;
                        return;
                    }
                    const resp = await fetch('/api/thumb_status', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paths: batch, size: THUMB_GRID_SIZE })
                    });
                    const data = await resp.json().catch(() => ({}));
                    if (data && data.success && Array.isArray(data.ready)) {
                        let readyCount = 0;
                        for (let i = 0; i < data.ready.length; i++) {
                            if (!data.ready[i]) continue;
                            const path = batch[i];
                            globalPendingThumbs.delete(path);
                            thumbRetryCount.delete(path);
                            // 预览缩略图
                            const img = document.querySelector(`#thumbGrid .thumb-item[data-path="${CSS.escape(path)}"] img`);
                            if (img && (img.getAttribute('data-ph') === '1' || !img.src)) {
                                const done = () => { img.classList.add('loaded'); const sk = img.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); };
                                const hit = thumbCacheGet(path);
                                if (hit && hit.url) {
                                    img.onload = done;
                                    img.src = hit.url;
                                    if (img.complete && img.naturalWidth > 0) done();
                                    img.removeAttribute('data-ph');
                                } else {
                                    fetch(`/api/thumb?path=${encodeURIComponent(path)}&size=${THUMB_GRID_SIZE}`)
                                      .then(r => r.ok ? r.blob() : null)
                                      .then(blob => {
                                          if (!blob) return;
                                          const entry = thumbCachePut(path, blob);
                                          img.onload = done;
                                          img.onerror = () => { const sk = img.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); img.parentElement?.insertAdjacentHTML('beforeend', '<div class=\"thumb-video-badge\">预览失败</div>'); };
                                          img.src = (entry && entry.url) ? entry.url : URL.createObjectURL(blob);
                                          if (img.complete && img.naturalWidth > 0) done();
                                          img.removeAttribute('data-ph');
                                      }).catch(()=>{});
                                }
                            }
                            // 相册封面
                            const cover = document.querySelector(`.album-cover img[data-cover="${CSS.escape(path)}"]`);
                            if (cover && !cover.src) {
                                const hit2 = thumbCacheGet(path);
                                if (hit2 && hit2.url) {
                                    cover.onload = () => { onCoverLoaded(cover); };
                                    cover.src = hit2.url;
                                } else {
                                    fetch(`/api/thumb?path=${encodeURIComponent(path)}&size=${COVER_THUMB_SIZE}`)
                                      .then(r => r.ok ? r.blob() : null)
                                      .then(blob => {
                                          if (!blob) return;
                                          const entry2 = thumbCachePut(path, blob);
                                          cover.onload = () => { onCoverLoaded(cover); };
                                          cover.onerror = () => { fallbackCover(cover, cover.alt || '') };
                                          cover.src = (entry2 && entry2.url) ? entry2.url : URL.createObjectURL(blob);
                                      }).catch(()=>{});
                                }
                            }
                            readyCount++;
                        }
                        // 主动探测：对长时间未就绪的路径做有限度 GET 探测，避免卡死
                        try {
                            let probes = 0;
                            for (const path of batch) {
                                if (probes >= PROBE_FETCH_LIMIT) break;
                                if (!globalPendingThumbs.has(path)) continue;
                                const cnt = (thumbRetryCount.get(path) || 0) + 1;
                                thumbRetryCount.set(path, cnt);
                                if (cnt > MAX_THUMB_RETRY) {
                                    globalPendingThumbs.delete(path);
                                    const img = document.querySelector(`#thumbGrid .thumb-item[data-path="${CSS.escape(path)}"] img`);
                                    const sk = img?.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove();
                                    if (img) img.parentElement?.insertAdjacentHTML('beforeend', '<div class="thumb-video-badge">预览失败</div>');
                                    continue;
                                }
                                if (cnt % 3 !== 0) continue; // 每3轮探测一次
                                probes++;
                                fetch(`/api/thumb?path=${encodeURIComponent(path)}&size=${THUMB_GRID_SIZE}`, { method: 'GET' })
                                  .then(r => {
                                      if (r.ok) return r.blob();
                                      if (r.status === 304) return 'USE_CACHE';
                                      return null;
                                  })
                                  .then(blob => {
                                      if (!blob) return;
                                      const img = document.querySelector(`#thumbGrid .thumb-item[data-path="${CSS.escape(path)}"] img`);
                                      if (img && blob !== 'USE_CACHE') {
                                          const done = () => { img.classList.add('loaded'); const sk = img.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); };
                                          img.onload = done;
                                          img.onerror = () => { const sk = img.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); img.parentElement?.insertAdjacentHTML('beforeend', '<div class="thumb-video-badge">预览失败</div>'); };
                                          img.src = URL.createObjectURL(blob);
                                          if (img.complete && img.naturalWidth > 0) done();
                                          img.removeAttribute('data-ph');
                                      } else if (img && blob === 'USE_CACHE') {
                                          // 304：直接指向同URL，浏览器会使用本地缓存
                                          const done = () => { img.classList.add('loaded'); const sk = img.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); };
                                          img.onload = done;
                                          img.onerror = () => { const sk = img.parentElement?.querySelector('.thumb-skeleton'); if (sk) sk.remove(); img.parentElement?.insertAdjacentHTML('beforeend', '<div class="thumb-video-badge">预览失败</div>'); };
                                          img.src = `/api/thumb?path=${encodeURIComponent(path)}&size=${THUMB_GRID_SIZE}`;
                                          if (img.complete && img.naturalWidth > 0) done();
                                          img.removeAttribute('data-ph');
                                      }
                                      const cover = document.querySelector(`.album-cover img[data-cover="${CSS.escape(path)}"]`);
                                      if (cover && !cover.src) {
                                          if (blob !== 'USE_CACHE') {
                                              cover.onload = () => { onCoverLoaded(cover); };
                                              cover.src = URL.createObjectURL(blob);
                                          } else {
                                              cover.onload = () => { onCoverLoaded(cover); };
                                              cover.src = `/api/thumb?path=${encodeURIComponent(path)}&size=${COVER_THUMB_SIZE}`;
                                          }
                                      }
                                      globalPendingThumbs.delete(path);
                                      thumbRetryCount.delete(path);
                                  })
                                  .catch(() => {});
                            }
                        } catch (e) {}
                        // 更新整体缩略图进度条
                        const grid = document.getElementById('thumbGrid');
                        const tTotal = previewState.photos.length;
                        const loadedImgs = grid ? grid.querySelectorAll('.thumb-img.loaded').length : 0;
                        const percent = tTotal > 0 ? Math.round((loadedImgs / tTotal) * 100) : 0;
                        const bar = document.getElementById('thumbProgressBar');
                        const txt = document.getElementById('thumbProgressText');
                        if (bar) bar.style.width = `${percent}%`;
                        if (txt) txt.textContent = `${loadedImgs}/${tTotal} (${percent}%)`;
                    }
                } catch (e) {
                    // 忽略错误，稍后重试
                } finally {
                    // 根据队列大小调整轮询频率（队列大时稍微放缓）并兼顾响应速度
                    const delay = globalPendingThumbs.size > 2000 ? 600 : globalPendingThumbs.size > 500 ? 300 : 150;
                    thumbPollTimer = setTimeout(doOne, delay);
                }
            };
            thumbPollTimer = setTimeout(doOne, 120);
        }

        function showToast(message, options = {}) {

        async function attemptRestartAdb() {
            try {

                    try { console.log('[ADB] restart ok'); } catch (e) {}
                    showToast('ADB 服务已重启', { type: 'success' });
                    window.__adbIssueDialogVisible = false;
                } else {
                    try { console.log('[ADB] restart failed', data); } catch (e) {}
                    showToast('重启失败: ' + (data.error || '未知错误'), { type: 'error' });

            } catch (e) {
                try { console.log('[ADB] restart error', e); } catch (ex) {}
                showToast('重启失败: ' + e.message, { type: 'error' });

        }

        function handleDeviceConnect() {
            // 设备连接时不再自动扫描，由用户主动点击
            const scanBtn = document.getElementById('scanBtn');
            scanBtn.disabled = false; // 启用扫描按钮

            // 避免在扫描或传输进行中重复触发
            if (window.__scanStarting || scanStatusInterval || progressInterval) {
                showToast('📱 设备已连接', { type: 'info' });
                if (window.__disconnectDialogVisible) {
                    hideDialog({ suppressResolve: true });
                    window.__disconnectDialogVisible = false;
                }
                updateUsbSpeedInfo();
                setTimeout(() => updateUsbSpeedInfo(), 2000);
                return;
            }

            showToast('📱 设备已连接', { type: 'success' });
            if (window.__disconnectDialogVisible) {
                hideDialog({ suppressResolve: true });
                window.__disconnectDialogVisible = false;
            }
            updateUsbSpeedInfo();
            setTimeout(() => updateUsbSpeedInfo(), 2000);
            // 显示大按钮引导用户点击开始扫描
            try { window.__lastDeviceConnected = true; } catch (e) {}
            try { renderScanHero(); } catch (e) {}
        }

        function resetStateAfterDisconnect() {
            stopThumbPolling();
            globalPendingThumbs.clear();
            thumbRetryCount.clear();
            thumbCache.clear();
            albumPrefetching.clear();
            disconnectThumbIO();
            detachPreviewScroll();

            allPhotos = [];
            filteredPhotos = [];
            selectedPhotos.clear();
            selectedAlbumsAll.clear();
            excludedByAlbum.clear();
            allAlbums = {};
            currentAlbumKey = null;
            currentView = 'list';
            previewState = { albumKey: null, photos: [], loaded: 0, batchSize: 200, attached: false };

            try { clearAlbumsCache(); } catch (e) {}
            try { localStorage.removeItem('at_last_album_key'); localStorage.removeItem('usb_last_view_mode'); localStorage.removeItem('at_last_scan_done'); } catch (e) {}
            const photoList = document.getElementById('photoList');
            if (photoList) {

            }
            try { window.__lastDeviceConnected = false; } catch (e) {}
            try { renderScanHero(); } catch (e) {}

            const scanBtnEl = document.getElementById('scanBtn');
            if (scanBtnEl) {
                scanBtnEl.disabled = true;
                scanBtnEl.textContent = '扫描照片';

            if (stopBtn) stopBtn.style.display = 'none';
            const transferBtn = document.getElementById('transferBtn');
            if (transferBtn) {

                transferBtn.disabled = true;
            }
            const resumeBtn = document.getElementById('resumeBtn');
            if (resumeBtn) resumeBtn.style.display = 'none';

            if (usbBadge) {
                usbBadge.style.display = 'none';
                usbBadge.textContent = '';
            }

            const burstToggle = document.getElementById('burstModeToggle');
            if (burstToggle) burstToggle.style.display = 'none';

            const pc = document.getElementById('progressContainer');
            if (pc) pc.classList.remove('active');

            if (progressTextEl) progressTextEl.textContent = '等待扫描';
            const progressPercentEl = document.getElementById('progressPercent');
            if (progressPercentEl) progressPercentEl.textContent = '0%';
            const progressBarEl = document.getElementById('progressBar');
            if (progressBarEl) {
                progressBarEl.classList.remove('indeterminate');
                progressBarEl.style.width = '0%';
                progressBarEl.textContent = '0%';

                    if (el) { el.textContent = ''; el.style.display = 'none'; }

            if (currentFileEl) currentFileEl.textContent = '等待开始...';

            try { window.__albumViewActive = false; window.__hasAlbums = false; } catch (e) {}

            saveSelections();

        function handleDeviceDisconnect() {
            // 仅在“此前曾连接过”的场景下展示断开弹窗，避免初始未连接时误报
            if (window.__lastDeviceConnected !== true) {
                // 仍做基本UI降级，但不弹窗
                try { console.log('[Disconnect] suppressed (never connected before)'); } catch (e) {}
                const statusBadge = document.getElementById('deviceStatus');
                statusBadge.className = 'status-badge status-disconnected';
                statusBadge.textContent = '未连接';
                document.getElementById('scanBtn').disabled = true;
                document.getElementById('transferBtn').disabled = true;
                resetStateAfterDisconnect();
                return;
            }
            // 不停止设备状态轮询，便于重新连接后自动检测

            if (scanStatusInterval) {
                stopScanStatusPolling();
                const scanBtn = document.getElementById('scanBtn');
                scanBtn.disabled = false;
                scanBtn.textContent = '扫描照片';
            }

            if (progressInterval) {
                stopTransfer();
                clearInterval(progressInterval);
                document.getElementById('transferBtn').style.display = 'inline-block';
                document.getElementById('stopBtn').style.display = 'none';
            }

            if (!window.__disconnectDialogVisible) {
                try { console.log('[Disconnect] showing dialog'); } catch (e) {}
                showDialog({
                    title: '设备已断开',
                    message: '⚠️ USB设备已断开！\n\n请重新连接设备后再继续操作。'
                });
                window.__disconnectDialogVisible = true;
            }

            const statusBadge = document.getElementById('deviceStatus');
            statusBadge.className = 'status-badge status-disconnected';
            statusBadge.textContent = '设备已断开';

            document.getElementById('scanBtn').disabled = true;
            document.getElementById('transferBtn').disabled = true;

            resetStateAfterDisconnect();
        }

        // 页面加载：启动设备状态轮询与静默检测，并检查是否需要恢复任务
        // 使用 DOMContentLoaded 更快进入可交互状态，避免等待所有资源
        window.addEventListener('DOMContentLoaded', () => {
            // 初始化Burst模式状态
            loadBurstModeStatus();
            // 优先从本地缓存恢复（即使未连接也可浏览上一次相册）
            restoreFromLocal();

            startDeviceStatusPolling();
            initialDeviceCheck();
            checkResumeProgress();
            try { renderScanHero(); } catch (e) {}
        });

        async function initialDeviceCheck() {
            try {
                const response = await fetch('/api/device_status');
                const data = await response.json();
                const statusBadge = document.getElementById('deviceStatus');
                const scanBtn = document.getElementById('scanBtn');

                if (data.connected) {
                    statusBadge.className = 'status-badge status-connected';
                    statusBadge.textContent = data.selected ? `已连接 (${data.selected})` : `已连接 (${data.devices.join(', ')})`;
                    scanBtn.disabled = false;
                    if (window.__disconnectDialogVisible) {
                        hideDialog({ suppressResolve: true });
                        window.__disconnectDialogVisible = false;
                    }
                    updateUsbSpeedInfo();
                    refreshDevices();
                    // 优先复用已有扫描结果
                    const stResp = await fetch('/api/scan_status');
                    const st = await stResp.json();
                    window.__lastDeviceConnected = true;
                    if (st && (st.is_running || st.stage === 'finding' || st.stage === 'getting_info')) {
                        startScanStatusPolling();
                        try { renderScanHero(); } catch (e) {}
                    } else {
                        // 不自动加载上次结果：首屏展示按钮，由用户决定是否扫描
                        const scanBtnNow = document.getElementById('scanBtn');
                        if (scanBtnNow) scanBtnNow.disabled = false;
                        try { renderScanHero(); } catch (e) {}
                    }
                } else {
                    statusBadge.className = 'status-badge status-disconnected';
                    statusBadge.textContent = '未连接';
                    window.__lastDeviceConnected = false;
                    try { renderScanHero(); } catch (e) {}
                }
            } catch (error) {
                console.error('初始设备检测失败:', error);
            }
        }

        async function refreshDevices() {
            try {
                const resp = await fetch('/api/devices');
                const data = await resp.json();
                const sel = document.getElementById('deviceSelect');
                if (!sel) return;
                if (!data.devices || data.devices.length <= 1) {
                    sel.style.display = 'none';
                    sel.innerHTML = '';
                    return;
                }
                sel.style.display = 'inline-block';
                const current = data.selected || '';
                sel.innerHTML = data.devices.map(d => `<option value="${d}" ${d===current?'selected':''}>${d}</option>`).join('');
                sel.onchange = async () => {
                    const serial = sel.value;
                    try {
                        const r = await fetch('/api/select_device', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ serial }) });
                        const j = await r.json();
                        if (j.success) {
                            showToast(`已切换到设备: ${serial}`, { type: 'success' });
                            updateUsbSpeedInfo();
                        } else {
                            showToast('切换设备失败: ' + (j.error||'未知'), { type: 'error' });
                        }
                    } catch (e) {
                        showToast('切换设备失败: ' + e.message, { type: 'error' });
                    }
                };
            } catch (e) {
                // ignore
            }
        }

        async function updateUsbSpeedInfo() {
            try {
                const resp = await fetch('/api/usb/speed');
                const info = await resp.json();
                const statusBadge = document.getElementById('deviceStatus');
                const usbBadge = document.getElementById('usbSpeedBadge');
                const burstToggle = document.getElementById('burstModeToggle');
                const scanBtn = document.getElementById('scanBtn');

                if (!usbBadge) return;

                if (info && info.success) {
                    if (info.probing) {
                        try { console.log('[USB] probing...'); } catch (e) {}
                        usbBadge.textContent = 'USB 测速中…';

                        // 测速进行中，禁用扫描按钮
                        if (scanBtn) {
                            scanBtn.disabled = true;
                            scanBtn.title = 'USB速度测试进行中，请稍候...';
                        }

                        // 3秒后重新检查
                        setTimeout(() => updateUsbSpeedInfo(), 3000);
                    } else if (info.test_failed) {
                        // 测速失败
                        try { console.log('[USB] test failed'); } catch (e) {}
                        usbBadge.textContent = 'USB 测速失败';
                        usbBadge.style.color = '#ef4444';

                        // 测速失败，启用扫描按钮，让用户点击后看到处理选项
                        if (scanBtn) {
                            scanBtn.disabled = false;
                            scanBtn.title = '点击查看USB测速失败的处理选项';
                        }
                    } else {
                        const label = info.label || 'USB 未知';
                        const mbps = typeof info.measured_mbps === 'number' && info.measured_mbps > 0 ? ` · ${info.measured_mbps.toFixed(1)} MB/s` : '';
                        try { console.log('[USB] speed info', { label, measured_mbps: info.measured_mbps, speed_test_done: info.speed_test_done }); } catch (e) {}
                        usbBadge.textContent = label + mbps;
                        usbBadge.style.color = '';

                        // 测速完成，启用扫描按钮
                        if (scanBtn && info.speed_test_done) {
                            scanBtn.disabled = false;
                            scanBtn.title = '';
                        }
                    }
                    usbBadge.style.display = 'inline-flex';
                    if (burstToggle) burstToggle.style.display = 'inline-flex';
                } else {
                    // 显示未知占位，避免位置抖动
                    try { console.log('[USB] speed unknown'); } catch (e) {}
                    usbBadge.textContent = 'USB 未知';
                    usbBadge.style.display = 'inline-flex';
                    usbBadge.style.color = '';
                    if (burstToggle) burstToggle.style.display = 'none';
                }

                // 加载Burst模式状态
                await loadBurstModeStatus();
            } catch (e) {
                console.error('更新USB速度信息失败:', e);
                const usbBadge = document.getElementById('usbSpeedBadge');
                if (usbBadge) {
                    usbBadge.textContent = 'USB 未知';
                    usbBadge.style.display = 'inline-flex';
                    usbBadge.style.color = '';
                }
                if (burstToggle) burstToggle.style.display = 'none';
                // 仍然尝试加载Burst模式状态
                await loadBurstModeStatus();
            }
        }

        async function ignoreResumeForever() {
            try {
                localStorage.setItem('at_resume_ignore_forever', '1');
            } catch (e) {}
            try {
                await fetch('/api/clear_progress', { method: 'POST' });
            } catch (e) {}
            const resumeBtn = document.getElementById('resumeBtn');
            if (resumeBtn) resumeBtn.style.display = 'none';
            showToast('已忽略未完成任务，今后不再提示', { type: 'success' });
        }

        async function checkResumeProgress() {
            try {
                // 用户选择永久忽略时，不再弹框
                try {
                    if (localStorage.getItem('at_resume_ignore_forever') === '1') {
                        const resumeBtn = document.getElementById('resumeBtn');
                        if (resumeBtn) resumeBtn.style.display = 'none';
                        return;
                    }
                } catch (e) {}
                const response = await fetch('/api/check_progress');
                const data = await response.json();

                if (data.has_progress) {
                    const resumeBtn = document.getElementById('resumeBtn');
                    resumeBtn.style.display = 'inline-block';
                    resumeBtn.title = `有 ${data.pending} 个文件未传输（已完成 ${data.completed}/${data.total}）`;

                    // 三按钮对话：继续、稍后、忽略且不再提示
                    showDialog({
                        title: '发现未完成的传输',
                        message: `发现未完成的传输任务：\n\n总文件: ${data.total}\n已完成: ${data.completed}\n剩余: ${data.pending}\n失败: ${data.failed}\n\n要如何处理？`,
                        actions: [
                            { label: '稍后' },
                            { label: '忽略并不再提示', onClick: () => ignoreResumeForever() },
                            { label: '继续传输', type: 'primary', onClick: () => resumeTransfer() }
                        ]
                    });
                }
            } catch (error) {
                console.error('检查进度失败:', error);
            }
        }

        async function resumeTransfer() {
            const resumeBtn = document.getElementById('resumeBtn');
            resumeBtn.disabled = true;
            resumeBtn.textContent = '恢复中...';

            try {
                const response = await fetch('/api/resume_transfer', { method: 'POST' });
                const data = await response.json();

                if (data.success) {
                    document.getElementById('progressContainer').classList.add('active');
                    resumeBtn.style.display = 'none';
                    document.getElementById('stopBtn').style.display = 'inline-block';
                    document.getElementById('scanBtn').disabled = true;
                    document.getElementById('transferBtn').disabled = true;
                    setContentMask(true, '传输进行中，请勿操作');
                    startProgressPolling();
                    startDeviceStatusPolling();
                    showToast(data.message, { type: 'success' });
                } else {
                    showToast('恢复传输失败: ' + data.error, { type: 'error' });
                    resumeBtn.disabled = false;
                    resumeBtn.textContent = '🔄 继续传输';
                }
            } catch (error) {
                showToast('恢复传输失败: ' + error.message, { type: 'error' });
                resumeBtn.disabled = false;
                resumeBtn.textContent = '🔄 继续传输';
            }
        }

        async function checkDevice() {
            const btn = document.getElementById('checkDeviceBtn');
            btn.disabled = true;
            btn.textContent = '检查中...';

            try {
                const response = await fetch('/api/check_device');
                const data = await response.json();

                const statusBadge = document.getElementById('deviceStatus');
                if (data.connected) {
                    statusBadge.className = 'status-badge status-connected';
                    statusBadge.textContent = `已连接 (${data.devices.join(', ')})`;
                    document.getElementById('scanBtn').disabled = false;
                } else {
                    statusBadge.className = 'status-badge status-disconnected';
                    statusBadge.textContent = '未连接';
                    try { console.log('[DialogTrigger] manual check: no device'); } catch (e) {}
                    showDialog({
                        title: '未检测到设备',
                        message: '请确保：\n1. 手机已通过USB连接\n2. 已开启USB调试\n3. 已授权此电脑的ADB访问'
                    });
                }
            } catch (error) {
                showToast('检查设备失败: ' + error.message, { type: 'error' });

                btn.disabled = false;
                btn.textContent = '检查设备';
