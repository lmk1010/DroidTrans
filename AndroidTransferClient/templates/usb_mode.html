        function restoreLastView() {
            // 恢复用户上次使用的视图
            const lastView = localStorage.getItem('usb_last_view_mode') || 'album';

            if (lastView === 'album' && Object.keys(allAlbums).length > 0) {
                switchToAlbumView();
            } else {
                switchToListView();
            }
        }

        function displayAlbums() {
            const photoList = document.getElementById('photoList');

            if (Object.keys(allAlbums).length === 0) {
                photoList.innerHTML = '<div class="empty-state"><h3>暂无相册</h3><p>请先扫描照片</p></div>';
                return;
            }

            let html = '';
            html += '<div class="album-grid">';
            const coverGenList = [];

            // 按优先级排序相册
            const sortedAlbums = Object.entries(allAlbums).sort((a, b) => a[1].priority - b[1].priority);

            sortedAlbums.forEach(([albumKey, albumData]) => {
                if ((albumData.total_count || 0) <= 0) return; // 隐藏空相册
                // 计算相册已选数：整体选中则为 total_count 减去 excluded；否则统计 selectedPhotos 前缀命中
                let selectedCount = 0;
                if (selectedAlbumsAll.has(albumKey)) {
                    const excl = excludedByAlbum.get(albumKey);
                    selectedCount = (albumData.total_count || 0) - (excl ? excl.size : 0);
                } else {
                    const prefix = albumKey.replace(/\/+$/,'') + '/';
                    selectedPhotos.forEach(p => { if (p.startsWith(prefix)) selectedCount++; });
                }
                const coverPath = albumData.cover || ((albumData.photos || [])[0]?.path) || '';
                const sizeBytes = Number(albumData.total_size || 0);
                const sizeText = (sizeBytes >= 100*1024*1024) ? (sizeBytes/1024/1024/1024).toFixed(2) + ' GB' : (sizeBytes/1024/1024).toFixed(2) + ' MB';

                html += `
                    <div class="album-card" data-album="${albumKey}" onclick="openAlbumPreview('${albumKey}')">
                        <div class="album-cover">
                            ${coverPath ? `
                                <div class="skeleton-cover"></div>
                                <img data-cover="${coverPath}" alt="${albumData.name}"
                                     loading="lazy" decoding="async" fetchpriority="low"
                                     onload="onCoverLoaded(this)" onerror="fallbackCover(this, this.alt)">
                            ` : `
                                <div class="album-cover-placeholder">${albumIconSVG(albumData.name)}</div>
                            `}
                        </div>
                        <div class="album-info">
                            <div class="album-header-row">
                                <div class="album-title">
                                    <span class="album-icon" aria-hidden="true">${albumIconSVG(albumData.name)}</span>
                                    <span>${albumData.name}</span>
                                </div>
                                <div class="album-badge">${albumData.total_count} 张</div>
                            </div>
                            <div class="album-stats">
                                <div class="album-stat-item">
                                    <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                        <polyline points="21 15 16 10 5 21"></polyline>
                                    </svg>
                                    <span>体积: <strong>${sizeText}</strong></span>
                                </div>
                                <div class="album-stat-item">
                                    <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                                    </svg>
                                    <span class="album-size">已选: ${selectedCount}</span>
                                </div>
                            </div>
                            <div class="album-actions">
                                <button class="album-action-btn primary" onclick="event.stopPropagation(); toggleAlbumSelection('${albumKey}')">
                                    ${selectedCount === albumData.total_count ? '反选' : '全选'}
                                </button>
                                <button class="album-action-btn secondary" onclick="event.stopPropagation(); openAlbumPreview('${albumKey}')">
                                    预览
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            photoList.innerHTML = html;

            updateStats();
            updateTopActions('album');

            // 优先直接为相册封面设置 src，避免返回列表时封面“丢失”再等待轮询
            try {
                const coverImgs = document.querySelectorAll('.album-cover img[data-cover]');
                coverImgs.forEach(img => {
                    const p = img.getAttribute('data-cover');
                    if (!p) return;
                    // 若内存缓存命中，直接使用 blobUrl；否则先尝试直接请求缩略图
                    const hit = thumbCacheGet(p);
                    if (hit && hit.url) {
                        img.src = hit.url;
                    } else {
                        img.src = `/api/thumb?path=${encodeURIComponent(p)}&size=${COVER_THUMB_SIZE}`;
                    }
                });
            } catch (e) { /* ignore */ }

            // 批量触发封面缩略图生成并纳入全局轮询
            try {
                // 收集封面路径
                const imgs = document.querySelectorAll('.album-cover img[data-cover]');
                const paths = [];
                imgs.forEach(img => { const p = img.getAttribute('data-cover'); if (p) { paths.push(p); globalPendingThumbs.add(p); } });
                if (paths.length) {
                    fetch('/api/thumb_batch_generate', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ paths, batch_size: 50, size: COVER_THUMB_SIZE }) }).catch(()=>{});
                    thumbPollLoop();
                }
            } catch (e) {}

            // 预取最可能点击的相册：上次打开的相册，否则第一个
            try {
                const last = localStorage.getItem('at_last_album_key');
                const prefer = (last && allAlbums[last]) ? last : (sortedAlbums.length ? sortedAlbums[0][0] : null);
                if (prefer) prefetchAlbumPhotos(prefer);
            } catch (e) {}

            // 悬停预取：鼠标移入时提前准备该相册首屏
            try {
                const cards = document.querySelectorAll('.album-card[data-album]');
                cards.forEach(card => {
                    const k = card.getAttribute('data-album');
                    card.addEventListener('mouseenter', () => prefetchAlbumPhotos(k));
                    // 触屏设备：首次触摸也可触发
                    card.addEventListener('touchstart', () => prefetchAlbumPhotos(k), { passive: true });
                });
            } catch (e) {}
        }

        function selectAllAlbums() {
            // 立即标记所有相册为整体选中，数量即时更新
            selectedAlbumsAll = new Set(Object.keys(allAlbums || {}));
            excludedByAlbum = new Map();
            updateStats();
            if (currentView === 'album') displayAlbums();
            showToast('已选择所有相册', { type: 'success' });
        }

        function invertAllAlbums() {
            // 立即按相册级反选：已整体选中的取消，未整体选中的设为整体选中
            const keys = Object.keys(allAlbums || {});
            const newSelected = new Set();
            keys.forEach(k => { if (!selectedAlbumsAll.has(k)) newSelected.add(k); });
            selectedAlbumsAll = newSelected;
            excludedByAlbum = new Map();
            // 清空具体项（避免与相册级标记冲突）
            selectedPhotos.clear();
            updateStats();
            if (currentView === 'album') displayAlbums();
            // 不再后台展开具体路径，由服务端在开始传输时展开
        }

        // 扁平化图标（Material风格）
        function albumIconSVG(name) {
            const n = (name || '').toLowerCase();
            let icon = 'folder';
            if (n.includes('相机') || n.includes('camera')) icon = 'camera';
            else if (n.includes('截') || n.includes('screenshot')) icon = 'image';
            else if (n.includes('视频') || n.includes('video') || n.includes('抖音') || n.includes('快手')) icon = 'film';
            else if (n.includes('下载') || n.includes('download')) icon = 'download';
            else if (n.includes('微信') || n.includes('qq') || n.includes('telegram') || n.includes('whatsapp')) icon = 'chat';

            switch (icon) {
                case 'camera':
                    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3l2-3h8l2 3h3a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
                case 'image':
                    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
                case 'film':
                    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg>';
                case 'download':
                    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
                case 'chat':
                    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a4 4 0 0 1-4 4H7l-4 4V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>';
                default:
                    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h3l2-3h6l2 3h3a2 2 0 0 1 2 2z"/></svg>';
            }
        }

        function fallbackCover(imgEl, albumName) {
            try {
                if (!imgEl || !imgEl.parentNode) return;
                const parent = imgEl.parentNode;
                imgEl.style.display = 'none';
                const sk = parent.querySelector('.skeleton-cover');
                if (sk) sk.remove();
                parent.innerHTML += `<div class=\"album-cover-placeholder\">${albumIconSVG(albumName)}</div>`;
            } catch (e) {
                console.error('封面回退失败:', e);
            }
        }

        function onCoverLoaded(imgEl) {
            try {
                imgEl.classList.add('loaded');
                const parent = imgEl.parentNode;
                const sk = parent && parent.querySelector('.skeleton-cover');
                if (sk) sk.remove();
            } catch (e) {
                // no-op
            }
        }
        function selectAlbum(albumKey) {
            currentAlbumKey = albumKey;
            const albumData = allAlbums[albumKey];

            // 切换到列表视图并只显示该相册的照片
            filteredPhotos = [...albumData.photos];
            switchToListView();

            showToast(`已选择相册: ${albumData.name}`, 'info');
        }

        function toggleAlbumSelection(albumKey) {
            const albumData = allAlbums[albumKey];
            if (!albumData) return;
            // 使用相册级选择语义，避免必须展开全部具体路径
            if (selectedAlbumsAll.has(albumKey)) {
                const excl = excludedByAlbum.get(albumKey);
                if (excl && excl.size > 0) {
                    // 已整体选择且有排除项：清除排除，变为真正的全选
                    excludedByAlbum.delete(albumKey);
                    showToast(`已选择 ${albumData.name} 全部 (${albumData.total_count})`, { type: 'success' });
                } else {
                    // 已整体选择且无排除：取消选择
                    selectedAlbumsAll.delete(albumKey);
                    showToast(`已取消选择 ${albumData.name}`, { type: 'info' });
                }
            } else {
                // 设置为整体选中并清除排除
                selectedAlbumsAll.add(albumKey);
                excludedByAlbum.delete(albumKey);
                showToast(`已选择 ${albumData.name} 全部 (${albumData.total_count})`, { type: 'success' });
            }

            // 刷新UI与统计
            if (currentView === 'album') {
                displayAlbums();
            } else if (currentView === 'preview' && (previewState.albumKey === albumKey || currentAlbumKey === albumKey)) {
                refreshPreviewSelectionUI();
            }
            updateStats();
        }

        // 新的相册预览（缩略图网格 + 分批加载）
        let previewState = { albumKey: null, photos: [], loaded: 0, batchSize: 120, attached: false };

        async function openAlbumPreview(albumKey) {
            currentAlbumKey = albumKey;
            const albumData = allAlbums[albumKey];
            if (!albumData) return;
            currentView = 'preview';
            document.getElementById('filterBar').style.display = 'none';
            updateTopActions('preview');
            try { localStorage.setItem('at_last_album_key', albumKey); } catch (e) {}

            // 立即渲染占位骨架，避免点击卡顿
            const photoList = document.getElementById('photoList');
            const skeletonCount = 120; // 足够多的骨架，占满首屏，允许立即滚动
            let skHTML = '<div class="thumb-grid" id="thumbGrid">';
            for (let i=0;i<skeletonCount;i++) { skHTML += '<div class="thumb-item"><div class="thumb-skeleton"></div></div>'; }
            skHTML += '</div>';
            photoList.innerHTML = skHTML;

            // 初始状态（空列表，稍后填充）
            previewState = { albumKey, photos: [], loaded: 0, batchSize: 120, attached: false };
            attachPreviewScroll();
            showToast(`正在载入 ${albumData.name} (${albumData.total_count} 张)…`, { type: 'info' });

            // 异步获取第一页并渲染，避免阻塞点击
            (async () => {
                try {
                    let photosArr = (albumData.photos || []);
                    if (!photosArr.length) {
                        const resp = await fetch(`/api/album_photos?album=${encodeURIComponent(albumKey)}&offset=0&limit=500`);
                        const data = await resp.json();
                        if (data && data.success) {
                            photosArr = data.photos || [];
                            allAlbums[albumKey].photos = photosArr;
                        }
                    }
                    const photosSorted = photosArr.slice().sort((a,b)=> (b.mtime||0) - (a.mtime||0));
                    previewState.photos = photosSorted;
                    previewState.loaded = 0;
                    renderAlbumPreviewGrid(true);
                } catch (e) {
                    console.error('加载相册列表失败', e);
                    // 占位退化
                    document.getElementById('thumbGrid').innerHTML = '<div style="padding:16px;color:#666;">加载失败</div>';
                }
            })();
        }

        function renderAlbumPreviewGrid(reset = false) {
            const photoList = document.getElementById('photoList');
            if (reset || !photoList.querySelector('.thumb-grid')) {
                photoList.innerHTML = `<div class="thumb-grid" id="thumbGrid"></div>`;
            }
            const grid = document.getElementById('thumbGrid');
            const start = previewState.loaded;
            const end = Math.min(previewState.photos.length, start + previewState.batchSize);

            const pendingPaths = [];
            for (let i = start; i < end; i++) {
                const p = previewState.photos[i];
                const isImg = hasPreviewImageExt(p.path);
                const isVid = hasPreviewVideoExt(p.path);
                const canPreview = isImg || isVid || true; // 无扩展名也尝试预览（后端侦测类型）
                const selected = selectedPhotos.has(p.path);
                const tile = document.createElement('div');
                tile.className = 'thumb-item';
                tile.dataset.path = p.path;
                tile.innerHTML = `
                    <div class="thumb-skeleton"></div>
                    ${canPreview ? `<img class="thumb-img" decoding="async" data-path="${p.path}" alt="${p.name}" title="${p.name}">` : ''}
                    ${selected ? '<div class="thumb-overlay">✓</div>' : ''}
                    ${isVid ? '<div class="thumb-video-badge">视频</div>' : ''}
                    <div class="thumb-name" title="${p.name}">${p.name}</div>
                `;
                // 点击选择/取消
                tile.addEventListener('click', () => {
                    const albumKey = previewState.albumKey || currentAlbumKey;
                    if (selectedAlbumsAll.has(albumKey)) {
                        // 整体选中状态下，点击切换为例外（排除）
                        const excl = excludedByAlbum.get(albumKey) || new Set();
                        if (excl.has(p.path)) {
                            excl.delete(p.path);
                            const ov = tile.querySelector('.thumb-overlay');
                            if (!ov) tile.insertAdjacentHTML('beforeend', '<div class="thumb-overlay">✓</div>');
                        } else {
                            excl.add(p.path);
                            const ov = tile.querySelector('.thumb-overlay');
                            if (ov) ov.remove();
                        }
                        excludedByAlbum.set(albumKey, excl);
                    } else {
                        if (selectedPhotos.has(p.path)) selectedPhotos.delete(p.path); else selectedPhotos.add(p.path);
                        const ov = tile.querySelector('.thumb-overlay');
                        if (ov) ov.remove(); else tile.insertAdjacentHTML('beforeend', '<div class="thumb-overlay">✓</div>');
                    }
                    updateStats();
                });
                grid.appendChild(tile);

                // 可见优先：监听进入视口时立刻加载
                const imgNode = tile.querySelector('img.thumb-img');
                if (imgNode) {
                    const io = ensureThumbIO();
                    if (io) {
                        try { io.observe(imgNode); } catch (e) { /* ignore */ }
                    } else {
                        // 无 IO 支持则直接尝试一次，避免长时间骨架
                        loadThumbInto(imgNode, p.path);
                    }
                }

                // 视频默认封面（数据URI），之后就绪会替换
                if (isVid) {
                    const img = tile.querySelector('img');
                    if (img) {
                        img.setAttribute('data-ph', '1');
                        img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"><rect width="256" height="256" rx="16" fill="%23e8f0fe"/><circle cx="128" cy="128" r="56" fill="%234285f4"/><polygon points="112,96 176,128 112,160" fill="white"/></svg>';
                        img.classList.add('loaded');
                        const sk = tile.querySelector('.thumb-skeleton'); if (sk) sk.remove();
                    }
                }

                // 改为后台批量生成，由全局轮询器批量检测状态并设置src（包括无扩展名）
                pendingPaths.push(p.path);
                globalPendingThumbs.add(p.path);
            }
            previewState.loaded = end;

            // 批量触发后台生成（每批最多30），并启动全局批处理轮询
            if (pendingPaths.length) {
                try {
                    fetch('/api/thumb_batch_generate', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ paths: pendingPaths, batch_size: 30, size: THUMB_GRID_SIZE }) });
                } catch (e) {}
                // 启动（或保持）全局轮询循环
                thumbPollLoop();
            }
        }

        function refreshPreviewSelectionUI() {
            const grid = document.getElementById('thumbGrid');
            if (!grid) return;
            const tiles = grid.children;
            for (const tile of tiles) {
                const path = tile.dataset.path;
                if (!path) continue;
                const albumKey = previewState.albumKey || currentAlbumKey;
                let has = false;
                if (selectedAlbumsAll.has(albumKey)) {
                    const excl = excludedByAlbum.get(albumKey);
                    has = !(excl && excl.has(path));
                } else {
                    has = selectedPhotos.has(path);
                }
                const ov = tile.querySelector('.thumb-overlay');
                if (has) {
                    if (!ov) tile.insertAdjacentHTML('beforeend', '<div class="thumb-overlay">✓</div>');
                } else {
                    if (ov) ov.remove();
                }
            }
        }

        function selectAllInCurrentAlbum() {
            if (!currentAlbumKey) return;
            // 立即标记整相册选中
            selectedAlbumsAll.add(currentAlbumKey);
            excludedByAlbum.delete(currentAlbumKey);
            refreshPreviewSelectionUI();
            updateStats();
            // 不再后台展开具体路径，由服务端在开始传输时展开
            showToast('已选择整相册', { type: 'success' });
        }

        function invertSelectionInCurrentAlbum() {
            if (!currentAlbumKey) return;
            if (selectedAlbumsAll.has(currentAlbumKey)) {
                // 取消整相册选中
                selectedAlbumsAll.delete(currentAlbumKey);
                excludedByAlbum.delete(currentAlbumKey);
                updateStats();
            } else {
                // 整相册反选为选中
                selectAllInCurrentAlbum();
                return;
            }
            refreshPreviewSelectionUI();
            updateStats();
            showToast('已对本相册进行反选', { type: 'info' });
        }

        function attachPreviewScroll() {
            if (previewState.attached) return;
            const photoList = document.getElementById('photoList');
            const onScroll = () => {
                if (currentView !== 'preview') return;
                const nearBottom = photoList.scrollTop + photoList.clientHeight >= photoList.scrollHeight - 300;
                if (nearBottom) {
                    // 如果还有未渲染的，继续渲染
                    if (previewState.loaded < previewState.photos.length) {
                        renderAlbumPreviewGrid(false);
                        return;
                    }
                    // 若已渲染完当前页，但总数更大，则分页拉取更多
                    const album = currentAlbumKey;
                    const total = (allAlbums[album] && allAlbums[album].total_count) ? allAlbums[album].total_count : previewState.photos.length;
                    if (previewState.photos.length < total) {
                        const offset = previewState.photos.length;
                        const limit = 500;
                        fetch(`/api/album_photos?album=${encodeURIComponent(album)}&offset=${offset}&limit=${limit}`)
                            .then(r=>r.json()).then(d=>{
                                if (d && d.success) {
                                    const more = d.photos || [];
                                    previewState.photos = previewState.photos.concat(more);
                                    renderAlbumPreviewGrid(false);
                                }
                            }).catch(()=>{});
                    }
                }
            };
            photoList.__previewScroll = onScroll;
            photoList.addEventListener('scroll', onScroll);
            previewState.attached = true;
        }

        function detachPreviewScroll() {
            const photoList = document.getElementById('photoList');
            if (photoList.__previewScroll) {
                photoList.removeEventListener('scroll', photoList.__previewScroll);
                delete photoList.__previewScroll;
            }
            previewState.attached = false;
            // 离开预览时，减少无用的缩略图轮询
            stopThumbPolling();
            // 断开可见性观察，释放引用
            disconnectThumbIO();
        }

        function backToAlbumCollection() {
            currentView = 'album';
            currentAlbumKey = null;
            detachPreviewScroll();
            // 如果已完成扫描且有相册数据
            if (Object.keys(allAlbums || {}).length > 0) {
                displayAlbums();
            } else {
                // 扫描中：展示当前已有的相册预览（会由 updateScanStatus 持续刷新）
                updateScanStatus(true);
            }
            updateTopActions('album');
        }

        // Override startTransfer to handle album transfers（服务端展开，避免前端海量分页请求）
        async function startTransfer() {
            // 开始传输时停止缩略图轮询，释放请求与CPU
            stopThumbPolling();
            // 计算实际选中的照片数量（包括相册整体选择）
            let totalSelectedCount = 0;
            const albums = allAlbums || {};
            selectedAlbumsAll.forEach(k => {
                totalSelectedCount += (albums[k]?.total_count || 0) - ((excludedByAlbum.get(k)?.size) || 0);
            });
            // 去重：从独立选择中剔除已计入相册整体选择的路径
            selectedPhotos.forEach(p => {
                let covered = false;
                for (const k of selectedAlbumsAll) {
                    const prefix = k.replace(/\/+$/,'') + '/';
                    if (p.startsWith(prefix)) { covered = true; break; }
                }
                if (!covered) totalSelectedCount++;
            });

            if (totalSelectedCount === 0) {
                showToast('请至少选择一张照片或一个相册', 'warning');
                return;
            }

            const outputPath = outputPathInput.value.trim();
            if (!outputPath) {
                showToast('请输入输出目录路径', 'warning');
                return;
            }

            try {
                const response = await fetch('/api/transfer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify((() => {
                        // 仅提交选择摘要，服务端自行展开，避免前端加载海量分页
                        const albumsArr = Array.from(selectedAlbumsAll || []);
                        const excludeMap = {};
                        albumsArr.forEach(k => {
                            const ex = excludedByAlbum.get(k);
                            if (ex && ex.size) excludeMap[k] = Array.from(ex);
                        });
                        // singles: 未被相册整体选择覆盖的独立选择
                        const singles = [];
                        selectedPhotos.forEach(p => {
                            let covered = false;
                            for (const k of albumsArr) {
                                const prefix = k.replace(/\/+$/,'') + '/';
                                if (p.startsWith(prefix)) { covered = true; break; }
                            }
                            if (!covered) singles.push(p);
                        });
                        return {
                            selection: { albums: albumsArr, exclude: excludeMap, singles },
                            output_dir: outputPath
                        };
                    })())
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('progressContainer').classList.add('active');
                    document.getElementById('transferBtn').style.display = 'none';
                    document.getElementById('stopBtn').style.display = 'inline-block';
                    document.getElementById('scanBtn').disabled = true;
                    document.getElementById('currentFile').textContent = `保存到: ${outputPath}`;
                    const pt = document.getElementById('progressText');
                    if (pt) pt.textContent = '正在初始化（测速/预估大小）…';
                    startProgressPolling();
                    startDeviceStatusPolling();
                } else {
                    showToast('启动传输失败: ' + data.error, { type: 'error' });
                }
            } catch (error) {
                showToast('启动传输失败: ' + error.message, { type: 'error' });
            }
        }

        // Burst Mode 相关函数
        async function loadBurstModeStatus() {
            try {
                const resp = await fetch('/api/usb/burst_mode');
                const data = await resp.json();

                if (data.success) {
                    const burstSwitch = document.getElementById('burstModeSwitch');
                    if (burstSwitch) {
                        burstSwitch.checked = data.enabled;
                    }
                }
            } catch (e) {
                console.error('加载Burst模式状态失败:', e);
            }
        }

        async function toggleBurstMode() {
            const burstSwitch = document.getElementById('burstModeSwitch');
            const enabled = burstSwitch.checked;

            try {
                const resp = await fetch('/api/usb/burst_mode', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ enabled: enabled })
                });

                const data = await resp.json();

                if (data.success) {
                    showToast(`ADB Burst模式已${enabled ? '启用' : '禁用'}`, 'success');

                    // 如果启用了Burst模式，建议重新检测USB速度
                    if (enabled) {
                        setTimeout(() => {
                            showToast('Burst模式已启用，建议重新检测USB速度以获得最佳性能', 'info');
                        }, 1000);
                    }
                } else {
                    showToast(`操作失败: ${data.error || '未知错误'}`, 'error');
                    // 恢复开关状态
                    burstSwitch.checked = !enabled;
                }
            } catch (e) {
                console.error('切换Burst模式失败:', e);
                showToast('操作失败: 网络错误', 'error');
                // 恢复开关状态
                burstSwitch.checked = !enabled;
            }
        }

        // 顶部外层按钮栏
        function updateTopActions(mode) {
            const bar = document.getElementById('topActions');
            if (!bar) return;
            if (mode === 'preview') {
                bar.innerHTML = `
                    <button class="btn btn-tonal" onclick="backToAlbumCollection()">返回相册</button>
                    <button class="btn btn-tonal" onclick="selectAllInCurrentAlbum()">全选当前相册</button>
                    <button class="btn btn-tonal" onclick="invertSelectionInCurrentAlbum()">反选当前相册</button>
                `;
            } else {
                bar.innerHTML = `
                    <button class="btn btn-tonal" onclick="selectAllAlbums()">全选所有相册</button>
                    <button class="btn btn-tonal" onclick="invertAllAlbums()">反选所有相册</button>
                `;
            }
        }
    </script>
