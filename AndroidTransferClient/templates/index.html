<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android照片传输工具 - Material Design</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg width='48' height='48' viewBox='0 0 1024 1024' xmlns='http://www.w3.org/2000/svg'><path d='M0 0m512 0l0 0q512 0 512 512l0 0q0 512-512 512l0 0q-512 0-512-512l0 0q0-512 512-512Z' fill='%234992FF'/><path d='M260.654545 620.897745a37.236364 37.236364 0 1 1-74.472727-1.340509l3.165091-175.476363a186.181818 186.181818 0 0 1 186.144582-182.830546H679.005091a37.236364 37.236364 0 1 1 0 74.472728H375.491491a111.709091 111.709091 0 0 0-111.709091 109.698327L260.654545 620.897745z' fill='%23FFFFFF'/><path d='M697.455709 257.805964a27.927273 27.927273 0 1 1-33.214836 44.907054l-122.842764-90.875345a27.927273 27.927273 0 0 1 33.214836-44.907055l122.842764 90.875346z' fill='%23FFFFFF'/><path d='M675.579345 277.355055a27.927273 27.927273 0 1 1 35.355928 43.250036l-142.391855 116.363636a27.927273 27.927273 0 0 1-35.337309-43.250036l142.373236-116.363636z' fill='%23FFFFFF'/><path d='M800.581818 403.102255a37.236364 37.236364 0 1 1 74.472727 1.340509l-3.16509 175.476363a186.181818 186.181818 0 0 1-186.144582 182.830546H382.231273a37.236364 37.236364 0 1 1 0-74.472728h303.532218a111.709091 111.709091 0 0 0 111.709091-109.698327L800.581818 403.102255z' fill='%23FFFFFF'/><path d='M363.780655 766.194036a27.927273 27.927273 0 1 1 33.214836-44.907054l122.842764 90.875345a27.927273 27.927273 0 0 1-33.214837 44.907055l-122.842763-90.875346z' fill='%23FFFFFF'/><path d='M385.657018 746.644945a27.927273 27.927273 0 1 1-35.355927-43.250036l142.391854-116.363636a27.927273 27.927273 0 0 1 35.33731 43.250036l-142.373237 116.363636z' fill='%23FFFFFF'/></svg>">
    <!-- 移除外网字体以避免阻塞；使用系统字体栈与等宽字体回退 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 2px 6px 2px rgba(60,64,67,0.15);
            overflow: hidden;
        }

        .header {
            background: white;
            padding: 28px 32px;
            border-bottom: 1px solid #e8eaed;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            flex-shrink: 0;
        }

        .header-logo svg {
            display: block;
        }

        .header-content {
            flex: 1;
        }

        .header h1 {
            font-size: 20px;
            margin-bottom: 4px;
            color: #202124;
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        .header p {
            color: #5f6368;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0;
        }

        .mode-selector {
            padding: 40px 32px 48px;
        }

        .mode-selector-title {
            text-align: center;
            margin-bottom: 12px;
            color: #202124;
            font-size: 24px;
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        .mode-selector-subtitle {
            text-align: center;
            color: #5f6368;
            margin-bottom: 32px;
            font-size: 14px;
            letter-spacing: 0;
        }

        .mode-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
        }

        .mode-card {
            background: white;
            border: none;
            padding: 40px 28px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .mode-card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12), 0 4px 8px rgba(0, 0, 0, 0.08);
            transform: translateY(-6px);
        }

        /* USB模式 - 蓝色主题 */
        .mode-card.adb {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
        }

        .mode-card.adb .icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 24px;
            color: #4285f4;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mode-card.adb:hover {
            background: linear-gradient(135deg, #bbdefb 0%, #90caf9 100%);
        }

        .mode-card.adb:hover .icon {
            color: #1565c0;
            transform: scale(1.1);
        }

        /* WiFi模式 - 绿色主题 */
        .mode-card.wifi {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
        }

        .mode-card.wifi .icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 24px;
            color: #34a853;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mode-card.wifi:hover {
            background: linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 100%);
        }

        .mode-card.wifi:hover .icon {
            color: #2e7d32;
            transform: scale(1.1);
        }

        .mode-card h2 {
            font-size: 19px;
            margin-bottom: 12px;
            color: #202124;
            font-weight: 500;
            letter-spacing: 0;
        }

        .mode-card p {
            font-size: 13px;
            color: #5f6368;
            line-height: 1.6;
            letter-spacing: 0;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .header {
                padding: 12px 16px;
            }

            .header h1 {
                font-size: 15px;
            }

            .header p {
                font-size: 9px;
            }

            .mode-selector {
                padding: 16px 16px 20px;
            }

            .mode-selector-title {
                font-size: 17px;
            }

            .mode-selector-subtitle {
                font-size: 10px;
                margin-bottom: 14px;
            }

            .mode-cards {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .mode-card {
                padding: 18px 14px;
            }

            .mode-card .icon {
                width: 34px;
                height: 34px;
                margin-bottom: 10px;
            }

            .mode-card h2 {
                font-size: 14px;
            }

            .mode-card p {
                font-size: 9px;
                line-height: 1.3;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-logo">
                <!-- 循环传输箭头Logo -->
                <svg width="40" height="40" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
                  <path d="M0 0m512 0l0 0q512 0 512 512l0 0q0 512-512 512l0 0q-512 0-512-512l0 0q0-512 512-512Z" fill="#4992FF"/>
                  <path d="M260.654545 620.897745a37.236364 37.236364 0 1 1-74.472727-1.340509l3.165091-175.476363a186.181818 186.181818 0 0 1 186.144582-182.830546H679.005091a37.236364 37.236364 0 1 1 0 74.472728H375.491491a111.709091 111.709091 0 0 0-111.709091 109.698327L260.654545 620.897745z" fill="#FFFFFF"/>
                  <path d="M697.455709 257.805964a27.927273 27.927273 0 1 1-33.214836 44.907054l-122.842764-90.875345a27.927273 27.927273 0 0 1 33.214836-44.907055l122.842764 90.875346z" fill="#FFFFFF"/>
                  <path d="M675.579345 277.355055a27.927273 27.927273 0 1 1 35.355928 43.250036l-142.391855 116.363636a27.927273 27.927273 0 0 1-35.337309-43.250036l142.373236-116.363636z" fill="#FFFFFF"/>
                  <path d="M800.581818 403.102255a37.236364 37.236364 0 1 1 74.472727 1.340509l-3.16509 175.476363a186.181818 186.181818 0 0 1-186.144582 182.830546H382.231273a37.236364 37.236364 0 1 1 0-74.472728h303.532218a111.709091 111.709091 0 0 0 111.709091-109.698327L800.581818 403.102255z" fill="#FFFFFF"/>
                  <path d="M363.780655 766.194036a27.927273 27.927273 0 1 1 33.214836-44.907054l122.842764 90.875345a27.927273 27.927273 0 0 1-33.214837 44.907055l-122.842763-90.875346z" fill="#FFFFFF"/>
                  <path d="M385.657018 746.644945a27.927273 27.927273 0 1 1-35.355927-43.250036l142.391854-116.363636a27.927273 27.927273 0 0 1 35.33731 43.250036l-142.373237 116.363636z" fill="#FFFFFF"/>
                </svg>
            </div>
            <div class="header-content">
                <h1>Android 照片传输工具</h1>
                <p>高性能 · 多模式 · 智能传输</p>
            </div>
        </div>

        <div class="mode-selector">
            <h2 class="mode-selector-title">选择传输模式</h2>
            <p class="mode-selector-subtitle">选择最适合您的传输方式</p>

            <div class="mode-cards">
                <div class="mode-card adb" onclick="window.location.href='/usb'">
                    <div class="icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M15,7H17V9H15V7M9,7H11V9H9V7M15,11H17V13H15V11M9,11H11V13H9V11M15,15H17V17H15V15M9,15H11V17H9V15M13,19H18V21H13V19M13,3H18V5H13V3M19,3A2,2 0 0,1 21,5V19A2,2 0 0,1 19,21H13V19H5A2,2 0 0,1 3,17V7A2,2 0 0,1 5,5H11V3H13V5H19M19,19V5H13V7H11V5H5V17H19V19Z"/>
                        </svg>
                    </div>
                    <h2>USB 模式</h2>
                    <p>有线连接，高速稳定<br>支持大批量快速传输<br>需开启 USB 调试</p>
                </div>

                <div class="mode-card wifi" onclick="window.location.href='/wifi'">
                    <div class="icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12,21L15.6,16.2C14.6,15.45 13.35,15 12,15C10.65,15 9.4,15.45 8.4,16.2L12,21M12,3C7.95,3 4.21,4.34 1.2,6.6L3,9C5.5,7.12 8.62,6 12,6C15.38,6 18.5,7.12 21,9L22.8,6.6C19.79,4.34 16.05,3 12,3M12,9C9.3,9 6.81,9.89 4.8,11.4L6.6,13.8C8.1,12.67 9.97,12 12,12C14.03,12 15.9,12.67 17.4,13.8L19.2,11.4C17.19,9.89 14.7,9 12,9Z"/>
                        </svg>
                    </div>
                    <h2>WiFi 模式</h2>
                    <p>无线传输，便捷灵活<br>无需数据线连接<br>需在同一局域网</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
