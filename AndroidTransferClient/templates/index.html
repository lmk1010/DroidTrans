<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android照片传输工具 - Material Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            padding: 32px 24px;
        }

        .container {
            max-width: 1140px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 2px 6px 2px rgba(60,64,67,0.15);
            overflow: hidden;
        }

        .header {
            background: white;
            padding: 32px 40px;
            border-bottom: 1px solid #e8eaed;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #202124;
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        .header p {
            color: #5f6368;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0;
        }

        .mode-selector {
            padding: 64px 32px;
        }

        .mode-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 32px;
            margin-top: 48px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .mode-card {
            background: #f8f9fa;
            border: 1px solid #dadce0;
            padding: 48px 32px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            position: relative;
        }

        .mode-card:hover {
            background: white;
            border-color: #4285f4;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            transform: translateY(-4px);
        }

        .mode-card .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 32px;
            color: #5f6368;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mode-card:hover .icon {
            color: #4285f4;
            transform: scale(1.05);
        }

        .mode-card.wifi:hover .icon {
            color: #34a853;
        }

        .mode-card h2 {
            font-size: 22px;
            margin-bottom: 12px;
            color: #202124;
            font-weight: 500;
            letter-spacing: 0;
        }

        .mode-card p {
            font-size: 14px;
            color: #5f6368;
            line-height: 1.6;
            letter-spacing: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Android 照片传输工具</h1>
            <p>高性能 · 多模式 · 智能传输</p>
        </div>

        <div class="mode-selector">
            <h2 style="text-align: center; margin-bottom: 12px; color: #202124; font-size: 32px; font-weight: 400; letter-spacing: -0.5px;">选择传输模式</h2>
            <p style="text-align: center; color: #5f6368; margin-bottom: 48px; font-size: 16px; letter-spacing: 0;">选择最适合您的传输方式</p>

            <div class="mode-cards">
                <div class="mode-card adb" onclick="window.location.href='/usb'">
                    <div class="icon">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M15,7H17V9H15V7M9,7H11V9H9V7M15,11H17V13H15V11M9,11H11V13H9V11M15,15H17V17H15V15M9,15H11V17H9V15M13,19H18V21H13V19M13,3H18V5H13V3M19,3A2,2 0 0,1 21,5V19A2,2 0 0,1 19,21H13V19H5A2,2 0 0,1 3,17V7A2,2 0 0,1 5,5H11V3H13V5H19M19,19V5H13V7H11V5H5V17H19V19Z"/>
                        </svg>
                    </div>
                    <h2>USB 模式</h2>
                    <p>有线连接，高速稳定<br>支持大批量快速传输<br>需开启 USB 调试</p>
                </div>

                <div class="mode-card wifi" onclick="window.location.href='/wifi'">
                    <div class="icon">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12,21L15.6,16.2C14.6,15.45 13.35,15 12,15C10.65,15 9.4,15.45 8.4,16.2L12,21M12,3C7.95,3 4.21,4.34 1.2,6.6L3,9C5.5,7.12 8.62,6 12,6C15.38,6 18.5,7.12 21,9L22.8,6.6C19.79,4.34 16.05,3 12,3M12,9C9.3,9 6.81,9.89 4.8,11.4L6.6,13.8C8.1,12.67 9.97,12 12,12C14.03,12 15.9,12.67 17.4,13.8L19.2,11.4C17.19,9.89 14.7,9 12,9Z"/>
                        </svg>
                    </div>
                    <h2>WiFi 模式</h2>
                    <p>无线传输，便捷灵活<br>无需数据线连接<br>需在同一局域网</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
