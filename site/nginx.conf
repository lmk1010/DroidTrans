server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # 带内容 hash 的构建产物可以长缓存；html 每次都回源，改了立刻生效
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # 发布清单和安装包都在 R2 上（droid.mkstore.life），官网在这个域下。
  # 页面直接 fetch 那个域会被 CORS 挡掉，所以在这里反代一层，
  # 让浏览器眼里 /latest.json 始终是同源请求。
  location = /latest.json {
    proxy_pass https://droid.mkstore.life/latest.json;
    proxy_set_header Host droid.mkstore.life;
    proxy_ssl_server_name on;
    # 清单本身很小，缓存久了会让「刚发的版本官网还不显示」
    proxy_cache_valid 200 30s;
    add_header Cache-Control "no-cache";
  }

  # 安装包直接跳去 R2，不经过这台机器 —— 几十 MB 的包没必要占服务器带宽
  location ~ ^/(latest\.(apk|dmg)|DroidTrans-.*\.(dmg|apk|ipa))$ {
    return 302 https://droid.mkstore.life$request_uri;
  }

  # /privacy 和 /privacy.html 都能打开，省得链接写错就 404
  location / {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "no-cache";
  }

  error_page 404 /index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;
}
