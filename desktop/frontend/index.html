<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>DroidTrans</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <div class="shell">
    <aside class="rail">
      <div class="brand">
        <svg class="logo" viewBox="0 0 1024 1024" aria-hidden="true">
          <path d="M0 0m512 0l0 0q512 0 512 512l0 0q0 512-512 512l0 0q-512 0-512-512l0 0q0-512 512-512Z" fill="#4C8DFF"/>
          <path d="M260.654545 620.897745a37.236364 37.236364 0 1 1-74.472727-1.340509l3.165091-175.476363a186.181818 186.181818 0 0 1 186.144582-182.830546H679.005091a37.236364 37.236364 0 1 1 0 74.472728H375.491491a111.709091 111.709091 0 0 0-111.709091 109.698327L260.654545 620.897745z" fill="#fff"/>
          <path d="M697.455709 257.805964a27.927273 27.927273 0 1 1-33.214836 44.907054l-122.842764-90.875345a27.927273 27.927273 0 0 1 33.214836-44.907055l122.842764 90.875346z" fill="#fff"/>
          <path d="M675.579345 277.355055a27.927273 27.927273 0 1 1 35.355928 43.250036l-142.391855 116.363636a27.927273 27.927273 0 0 1-35.337309-43.250036l142.373236-116.363636z" fill="#fff"/>
          <path d="M800.581818 403.102255a37.236364 37.236364 0 1 1 74.472727 1.340509l-3.16509 175.476363a186.181818 186.181818 0 0 1-186.144582 182.830546H382.231273a37.236364 37.236364 0 1 1 0-74.472728h303.532218a111.709091 111.709091 0 0 0 111.709091-109.698327L800.581818 403.102255z" fill="#fff"/>
          <path d="M363.780655 766.194036a27.927273 27.927273 0 1 1 33.214836-44.907054l122.842764 90.875345a27.927273 27.927273 0 0 1-33.214837 44.907055l-122.842763-90.875346z" fill="#fff"/>
          <path d="M385.657018 746.644945a27.927273 27.927273 0 1 1-35.355927-43.250036l142.391854-116.363636a27.927273 27.927273 0 0 1 35.33731 43.250036l-142.373237 116.363636z" fill="#fff"/>
        </svg>
        <div>
          <strong>DroidTrans</strong>
          <span>卓传</span>
        </div>
      </div>
      <nav>
        <button type="button" data-view="home" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>
          <span data-i18n="navHome">总览</span>
        </button>
        <button type="button" data-view="usb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11v5a4 4 0 0 0 8 0v-5"/><path d="M12 4.5v12"/><path d="M9.2 7.5h5.6"/><circle cx="12" cy="4.2" r="1.35" fill="currentColor" stroke="none"/></svg>
          USB
        </button>
        <button type="button" data-view="wifi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.4a9 9 0 0 1 14 0"/><path d="M8.2 15.5a5 5 0 0 1 7.6 0"/><circle cx="12" cy="18.4" r="1.15" fill="currentColor" stroke="none"/></svg>
          Wi-Fi
        </button>
        <button type="button" data-view="history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.6 1.6"/></svg>
          <span data-i18n="navHist">图库</span>
        </button>
      </nav>
      <div class="rail-foot">
        <button type="button" id="langBtn" class="lang-btn">EN</button>
        <p id="adbHint" class="hint" title="">ADB</p>
      </div>
    </aside>

    <main>
      <section id="view-home" class="view active">
        <header class="page-head">
          <h1 data-i18n="homeTitle">把手机里的照片，搬到这台电脑</h1>
          <p data-i18n="homeSub">一根线，或同一局域网。安静、直接、本地完成。</p>
          <p id="homeStatus" class="home-status">USB · LAN · go</p>
        </header>
        <div class="tiles">
          <button type="button" class="tile" data-go="usb">
            <svg class="tile-icon" viewBox="6 2 12 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11v5a4 4 0 0 0 8 0v-5"/><path d="M12 4.5v12"/><path d="M9.2 7.5h5.6"/><circle cx="12" cy="4.2" r="1.5" fill="currentColor" stroke="none"/></svg>
            <span class="tile-copy">
              <em>USB</em>
              <h2 data-i18n="usbTile">有线快传</h2>
              <p data-i18n="usbTileSub">开启 USB 调试后扫描相册，并发 pull 到本地。</p>
            </span>
          </button>
          <button type="button" class="tile" data-go="wifi">
            <svg class="tile-icon" viewBox="3.5 8 17 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.4a9 9 0 0 1 14 0"/><path d="M8.2 15.5a5 5 0 0 1 7.6 0"/><circle cx="12" cy="18.6" r="1.5" fill="currentColor" stroke="none"/></svg>
            <span class="tile-copy">
              <em>Wi-Fi</em>
              <h2 data-i18n="wifiTile">手机直传</h2>
              <p data-i18n="wifiTileSub">App 搜到这台电脑，文件走 TCP / FTP / HTTP。</p>
            </span>
          </button>
        </div>
      </section>

      <section id="view-usb" class="view">
        <header class="page-head row">
          <div>
            <h1>USB</h1>
            <p id="usbDevice" data-i18n="waiting">等待设备</p>
          </div>
          <div class="actions">
            <button type="button" id="scanBtn" class="primary" data-i18n="scan">扫描相册</button>
            <button type="button" id="xferBtn" class="primary" disabled data-i18n="xfer">开始传输</button>
          </div>
        </header>
        <div class="path-row glass">
          <label data-i18n="save">保存到</label>
          <input id="usbOut" type="text" spellcheck="false" />
        </div>
        <div id="albumGrid" class="albums"></div>
        <div id="photoGrid" class="photos hidden"></div>
        <footer class="xfer-bar hidden" id="xferBar">
          <span id="xferText">准备传输</span>
          <div class="bar"><i id="xferFill"></i></div>
        </footer>
      </section>

      <section id="view-wifi" class="view">
        <header class="page-head">
          <h1 data-i18n="wifiTitle">Wi-Fi 接收</h1>
          <p data-i18n="wifiSub">手机 App 填这个地址，或在同一局域网里搜索。</p>
        </header>
        <div class="listen">
          <span class="glyph">
            <svg viewBox="3.5 8 17 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.4a9 9 0 0 1 14 0"/><path d="M8.2 15.5a5 5 0 0 1 7.6 0"/><circle cx="12" cy="18.6" r="1.5" fill="currentColor" stroke="none"/></svg>
          </span>
          <div class="listen-copy">
            <span class="kicker" data-i18n="localAddr">本机地址</span>
            <strong id="wifiURL" title="">—</strong>
          </div>
          <button type="button" id="copyUrl" class="icon-btn" data-i18n-title="copy" title="复制" aria-label="复制">
            <svg class="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg>
            <svg class="i-check hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12l5 5L20 7"/></svg>
          </button>
        </div>
        <div class="path-row glass">
          <label data-i18n="save">保存到</label>
          <input id="wifiOut" type="text" spellcheck="false" />
          <button type="button" id="openOut" class="ghost" data-i18n="open">打开文件夹</button>
        </div>
        <h3 class="sub" data-i18n="online">在线设备</h3>
        <div id="onlineList" class="list"></div>
        <h3 class="sub" data-i18n="batches">最近图库</h3>
        <div id="batchList" class="gallery"></div>
      </section>

      <section id="view-history" class="view">
        <header class="page-head row">
          <h1 data-i18n="histTitle">图库</h1>
          <button type="button" id="clearHist" class="ghost danger" data-i18n="clear">清空</button>
        </header>
        <div id="histList" class="gallery"></div>
      </section>
    </main>
  </div>

  <aside id="inbox" class="inbox hidden" aria-live="polite">
    <span class="inbox-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v10"/><path d="M8 9l4 4 4-4"/><path d="M5 18h14"/></svg>
    </span>
    <div class="inbox-copy">
      <strong id="inboxTitle">正在接收</strong>
      <span id="inboxText"></span>
    </div>
    <button type="button" id="inboxOpen" class="ghost" data-i18n="open">打开</button>
    <button type="button" id="inboxDismiss" class="icon-btn" title="关闭" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
    </button>
    <div class="bar"><i id="inboxFill"></i></div>
  </aside>
  <div id="menu" class="menu hidden" role="menu"></div>
  <div id="viewer" class="viewer hidden">
    <div class="viewer-bar">
      <button type="button" id="viewerBack" class="ghost">返回</button>
      <h2 id="viewerTitle">图库</h2>
      <button type="button" id="viewerOpen" class="ghost" data-i18n="open">打开文件夹</button>
    </div>
    <div id="viewerGrid" class="viewer-grid"></div>
    <div id="lightbox" class="lightbox hidden">
      <img id="lightboxImg" alt="" />
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
