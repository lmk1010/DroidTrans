name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v* 标签时触发，例如 v1.0.0
  workflow_dispatch:  # 允许手动触发

jobs:
  # 构建 Android APK
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: ./AndroidTransferApp
        run: chmod +x gradlew

      - name: Build APK
        working-directory: ./AndroidTransferApp
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: AndroidTransferApp/app/build/outputs/apk/release/*.apk

  # 构建 macOS 版本
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        working-directory: ./AndroidTransferClient
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Python backend
        working-directory: ./AndroidTransferClient
        run: |
          pip install pyinstaller
          pyinstaller app.spec

      - name: Install Node dependencies
        working-directory: ./AndroidTransferClient
        run: npm ci

      - name: Build Electron app for macOS
        working-directory: ./AndroidTransferClient
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: |
            AndroidTransferClient/dist/*.dmg
            AndroidTransferClient/dist/*.zip
            AndroidTransferClient/dist/*.dmg.blockmap
            AndroidTransferClient/dist/*.zip.blockmap

  # 构建 Windows 版本
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        working-directory: ./AndroidTransferClient
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Python backend
        working-directory: ./AndroidTransferClient
        run: |
          pip install pyinstaller
          pyinstaller app.spec

      - name: Install Node dependencies
        working-directory: ./AndroidTransferClient
        run: npm ci

      - name: Build Electron app for Windows
        working-directory: ./AndroidTransferClient
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            AndroidTransferClient/dist/*.exe
            AndroidTransferClient/dist/*.exe.blockmap

  # 创建 Release 并上传所有构建产物
  create-release:
    needs: [build-android, build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/android-apk/*.apk
            artifacts/macos-builds/*.dmg
            artifacts/macos-builds/*.zip
            artifacts/windows-builds/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

