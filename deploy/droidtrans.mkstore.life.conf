# droidtrans.mkstore.life — 卓传官网（静态，Vite + React 构建产物）
#
# Cloudflare DNS → 本机 80；HTTPS 由 Cloudflare 终结，源站不放证书。
# 静态文件：/opt/neox-nginx/html/droidtrans/ → 容器 /usr/share/nginx/html/droidtrans
#
# 这个文件由 scripts/deploy-site.sh 同步过去，别直接在服务器上改。
server {
    listen 80;
    server_name droidtrans.mkstore.life;

    root /usr/share/nginx/html/droidtrans;
    index index.html;

    # 带内容 hash 的构建产物，改一个字文件名就变，可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 发布清单在 R2（droid.mkstore.life），和官网不同源。
    # 页面直接去 fetch 会被 CORS 挡掉，所以在这里反代一层，
    # 让浏览器眼里 /latest.json 始终是同源请求。
    location = /latest.json {
        proxy_pass https://droid.mkstore.life/latest.json;
        proxy_set_header Host droid.mkstore.life;
        proxy_ssl_server_name on;
        # 缓存久了会出现「刚发的版本官网还不显示」
        add_header Cache-Control "no-cache";
    }

    # 授权与收款接口，反代到宿主机上的授权服务。
    #
    # 目标必须写 docker 网桥的网关地址：nginx 跑在容器里，
    # 容器内的 127.0.0.1 指向它自己，够不到宿主机的服务。
    # 宿主机那边只对这两个网段放行了 8791，公网直连进不来。
    location /api/ {
        proxy_pass http://172.18.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Waffo 的 webhook 要拿未经改动的原始报文验签，
        # 这里不能开任何会重写 body 的东西
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # 安装包直接跳去 R2，几十 MB 的包没必要占这台机器的带宽
    location ~ ^/(latest\.(apk|dmg)|DroidTrans-.*\.(dmg|apk|ipa))$ {
        return 302 https://droid.mkstore.life$request_uri;
    }

    # /privacy 和 /privacy.html 都能打开，省得链接写错就 404
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
